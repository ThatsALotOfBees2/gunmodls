<!doctype html><html><head><meta charset="utf-8"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tactical Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Chivo+Mono:wght@400;500&family=Archivo:wght@400;500;600&display=swap">
<style>
  /* Layout: full-bleed stage; field-manual plate top-left, two-row control strip along the bottom. */
  :root {
    --bg: #e6e6ec;
    --bg-deep: #c9cad3;
    --fg: #16171d;
    --muted: #5b5e6b;
    --panel: rgba(240, 240, 246, 0.8);
    --line: rgba(22, 23, 29, 0.16);
    --accent: #6a3fe0;
    --accent-fg: #f7f3ff;
    --alarm: #b3121c;
    --font-display: "Chakra Petch", "Arial Narrow", sans-serif;
    --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Chivo Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0c11; --bg-deep: #05060a; --fg: #e8e8f0; --muted: #8e92a6;
      --panel: rgba(13, 14, 20, 0.74); --line: rgba(232, 232, 240, 0.13);
      --accent: #8f63ff; --accent-fg: #0e0819; --alarm: #e0343c; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0c11; --bg-deep: #05060a; --fg: #e8e8f0; --muted: #8e92a6;
    --panel: rgba(13, 14, 20, 0.74); --line: rgba(232, 232, 240, 0.13);
    --accent: #8f63ff; --accent-fg: #0e0819; --alarm: #e0343c; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 38%, var(--bg) 0%, var(--bg) 35%, var(--bg-deep) 100%);
    background-color: var(--bg);
    color: var(--fg); font-family: var(--font-body); overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; outline: none; }
  .plate {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); left: max(16px, env(safe-area-inset-left, 0px));
    max-width: min(360px, calc(100vw - 32px)); display: grid; gap: 6px; pointer-events: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .plate h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5.2vw, 36px);
    line-height: 0.95; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .plate h1 span { color: var(--accent); }
  .specs {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 6px 0 0;
    font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .specs dt { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10.5px; padding-top: 1px; }
  .specs dd { margin: 0; }
  .state { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; font: 500 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
  .chip b { font-weight: 500; color: var(--accent); }
  .chip.alarm b { color: var(--alarm); }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: center; pointer-events: none;
  }
  .controls {
    pointer-events: auto; display: grid; gap: 6px; justify-items: center; max-width: 100%;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 14px; padding: 8px;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; max-width: 100%; }
  .group { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--line); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .group::-webkit-scrollbar { display: none; }
  .controls { grid-template-columns: minmax(0, 1fr); }
  .row { min-width: 0; }
  .row > .group { min-width: 0; flex: 0 1 auto; }
  .tag { font: 500 10px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 0 2px 0 4px; }
  button {
    font: 500 13px/1 var(--font-body); color: var(--fg); background: transparent; border: 0;
    padding: 8px 11px; border-radius: 7px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; flex: none;
  }
  button:hover { background: var(--line); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  button.toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #hud {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 18px);
    display: flex; align-items: center; gap: 12px; pointer-events: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px 8px 8px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); --hud: var(--accent);
  }
  #hud svg { display: block; flex: none; }
  #hud .track { fill: none; stroke: var(--line); stroke-width: 5; }
  #hud .track.thin { stroke-width: 3; }
  #hud .ring { fill: none; stroke: var(--hud); stroke-width: 5; stroke-linecap: round; }
  #hud .hold { fill: none; stroke: var(--fg); stroke-width: 3; stroke-linecap: round; }
  #hud #hud-ticks rect { fill: var(--line); }
  #hud #hud-ticks rect.on { fill: var(--hud); }
  #hud .glyph { display: none; fill: none; stroke: var(--hud); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  #hud .glyph rect:not(.fill) { fill: none; }
  #hud .glyph .fill, #hud .g-upload rect { fill: var(--hud); stroke: none; }
  #hud[data-state="carry"] .g-carry, #hud[data-state="cancel"] .g-carry, #hud[data-state="pickup"] .g-carry,
  #hud[data-state="plant"] .g-plant, #hud[data-state="upload"] .g-upload, #hud[data-state="disabling"] .g-upload,
  #hud[data-state="complete"] .g-complete, #hud[data-state="disabled"] .g-disabled, #hud[data-state="preview"] .g-preview { display: inline; }
  #hud[data-state="disabling"] .hold, #hud[data-state="disabled"] { --hud: var(--alarm); }
  #hud[data-state="disabling"] .hold { stroke: var(--alarm); }
  #hud[data-state="upload"] .g-upload rect { animation: hudbar 0.9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
  #hud[data-state="upload"] .g-upload rect:nth-child(2) { animation-delay: -0.3s; }
  #hud[data-state="upload"] .g-upload rect:nth-child(3) { animation-delay: -0.6s; }
  @keyframes hudbar { from { transform: scaleY(0.45); } to { transform: scaleY(1); } }
  #hud[data-state="complete"] { --hud: #b89cff; }
  #hud[data-state="complete"] svg { animation: hudpop 0.6s ease-out 1; }
  @keyframes hudpop { 0% { transform: scale(0.8); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { #hud * { animation: none !important; } }
  .hud-text { display: grid; gap: 2px; min-width: 128px; }
  .hud-text b { font: 600 15px/1.1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }
  .hud-text span { font: 500 11.5px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  #hud[data-state="disabled"] .hud-text b, #hud[data-state="disabling"] .hud-text b { color: var(--alarm); }
  button.hold { touch-action: none; user-select: none; -webkit-user-select: none; }
  button.hold[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  #act-disable.hold[aria-pressed="true"] { background: var(--alarm); color: #fff; }
  .hint {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 20px);
    font: 11px var(--font-mono); letter-spacing: 0.06em; color: #9a9db0; text-align: right; pointer-events: none;
  }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    font: 12px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: #8e92a6;
  }
  @media (max-width: 640px) {
    .hint { display: none; }
    #hud { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); right: 16px; padding: 6px 10px 6px 6px; }
    #hud svg { width: 56px; height: 56px; }
    .plate .specs, .plate .state { display: none; }
    .plate { padding: 10px 12px; }
    .specs { font-size: 11px; }
    .specs .wide { display: none; }
    button { padding: 7px 8px; font-size: 12px; }
    .tag { display: none; }
  }
</style>
<style>
  body { margin: 0; }
  [hidden] { display: none !important; }

<body>
<div id="stage" aria-label="Interactive 3D model of a rugged tactical phone held in a gloved left hand"></div>

<header class="plate">
  <div class="eyebrow">Operator gadget</div>
  <h1>Tactical <span>Phone</span></h1>
  <dl class="specs">
    <dt>Size</dt><dd>86 × 160 × 22 mm, armoured corners, 0.42 kg</dd>
    <dt>Screen</dt><dd>68 × 128 mm, 16-cell tactical atlas</dd>
    <dt>Hold</dt><dd>Left hand, thumb on the glass</dd>
  </dl>
  <div class="state" aria-live="polite"><span class="chip">Clip <b id="st-clip">idle</b></span><span class="chip">Screen <b id="st-cell">map</b></span></div>
</header>
<div class="hint">Drag to orbit · Scroll to zoom<br>Right-drag to pan · Tap the glass</div>
<div id="loading">Waking the phone…</div>

<nav class="bar" aria-label="Controls">
  <div class="controls">
    <div class="row">
      <div class="group" role="group" aria-label="Clip" id="clips"></div>
    </div>
    <div class="row">
      <div class="group" role="group" aria-label="Screen state" id="states">
        <button type="button" data-state="" title="Follow the clip">Auto</button><button type="button" data-state="off">Off</button><button type="button" data-state="boot">Boot</button><button type="button" data-state="lock">Lock</button><button type="button" data-state="home">Home</button><button type="button" data-state="map">Map</button><button type="button" data-state="drone">Drone</button><button type="button" data-state="scan">Scan</button><button type="button" data-state="lock_on">Lock-on</button><button type="button" data-state="alert">Alert</button><button type="button" data-state="low_battery">Low battery</button><button type="button" data-state="shutdown">Shutdown</button>
      </div>
    </div>
    <div class="row">
      <div class="group" role="group" aria-label="Idle app" id="apps" title="The app idle shows">
        <button type="button" data-app="map">Map</button><button type="button" data-app="drone">Drone</button><button type="button" data-app="scan">Scan</button><button type="button" data-app="home">Home</button>
      </div>
      <div class="group" role="group" aria-label="Lighting" id="lights">
        <button type="button" data-light="studio">Studio</button><button type="button" data-light="daylight">Daylight</button><button type="button" data-light="night">Night</button>
      </div>
      <div class="group" role="group" aria-label="View">
        <button type="button" data-view="ref" title="Held, like the reference photo">Held</button>
        <button type="button" data-view="34">¾</button>
        <button type="button" data-view="front">Front</button>
        <button type="button" data-view="side">Side</button>
        <button type="button" data-view="back">Back</button>
      </div>
      <button type="button" class="toggle" id="hand" aria-pressed="true" title="Show the glove (H)">Glove</button>
      <button type="button" class="toggle" id="spin" aria-pressed="false" title="Orbit the camera slowly">Orbit</button>
      <button type="button" class="toggle" id="sound" aria-pressed="true" title="Sounds">Sound</button>
    </div>
  </div>
</nav>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.7/src/index.js",
    "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/build/index.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices, toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';

// Metres, +Y up the phone, the screen faces -Z (toward the holder), the holder's left +X (DESIGN.md 1).

/* ------------------------------------------------------------------ helpers */

// Monotone cubic interpolation through [x, y] points (no overshoot).
function curve(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const constant = v => () => v;

// Loft a superellipse cross-section along X. top/bot/hw/n are functions of x.
// round: radius used to roll the edges at both ends; caps are flat.
function loft({ x0, x1, top, bot, hw, n = constant(2.6), cy = null, steps = 160, seg = 72, round = 0, roundStart = round, roundEnd = round, groove = null }) {
  const xs = [];
  // denser stations near the ends so the rolled edges stay smooth
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const e = 0.5 - 0.5 * Math.cos(Math.PI * u);
    xs.push(x0 + (x1 - x0) * (0.55 * u + 0.45 * e));
  }
  const pos = [], idx = [];
  const ring = (x) => {
    let T = top(x), B = bot(x), W = hw(x);
    const ds = x - x0, de = x1 - x;
    let inset = 0;
    if (roundStart > 0 && ds < roundStart) inset = Math.max(inset, roundStart - Math.sqrt(Math.max(0, roundStart * roundStart - (roundStart - ds) ** 2)));
    if (roundEnd > 0 && de < roundEnd) inset = Math.max(inset, roundEnd - Math.sqrt(Math.max(0, roundEnd * roundEnd - (roundEnd - de) ** 2)));
    let gB = 0, gW = 0;
    if (groove) { const g = groove(x); gB = g; gW = g; }
    T -= inset; B += inset + gB; W -= inset + gW;
    // a rounding radius larger than the section must not turn the ring inside out
    W = Math.max(0.002, W);
    const c = cy ? cy(x) : (T + B) / 2, ry = Math.max(0.001, (T - B) / 2);
    const e = 2 / n(x), out = [];
    for (let j = 0; j < seg; j++) {
      const t = (j / seg) * Math.PI * 2, co = Math.cos(t), si = Math.sin(t);
      const z = W * Math.sign(co) * Math.pow(Math.abs(co), e);
      const y = c + ry * Math.sign(si) * Math.pow(Math.abs(si), e);
      out.push([x, y, z]);
    }
    return out;
  };
  const rings = xs.map(ring);
  rings.forEach(r => r.forEach(p => pos.push(...p)));
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * seg + j, b = i * seg + (j + 1) % seg, c = (i + 1) * seg + j, d = (i + 1) * seg + (j + 1) % seg;
      idx.push(a, c, b, b, c, d);
    }
  }
  // flat caps with their own vertices
  const capAt = (r, flip) => {
    const base = pos.length / 3;
    const cx = r.reduce((s, p) => s + p[1], 0) / r.length;
    pos.push(r[0][0], cx, 0);
    r.forEach(p => pos.push(...p));
    for (let j = 0; j < seg; j++) {
      const a = base + 1 + j, b = base + 1 + (j + 1) % seg;
      flip ? idx.push(base, a, b) : idx.push(base, b, a);
    }
  };
  // caps face outward: -x at the start, +x at the end
  capAt(rings[0], true);
  capAt(rings[rings.length - 1], false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Polygon with per-corner radius: pts = [[x, y, r], ...]
function roundedShape(pts, shape = new THREE.Shape()) {
  const n = pts.length;
  const P = pts.map(p => new THREE.Vector2(p[0], p[1]));
  for (let i = 0; i < n; i++) {
    const prev = P[(i - 1 + n) % n], cur = P[i], next = P[(i + 1) % n], r = pts[i][2] || 0;
    const v1 = prev.clone().sub(cur), v2 = next.clone().sub(cur);
    const l1 = v1.length(), l2 = v2.length();
    const rr = Math.min(r, l1 / 2.05, l2 / 2.05);
    const a = cur.clone().add(v1.normalize().multiplyScalar(rr));
    const b = cur.clone().add(v2.normalize().multiplyScalar(rr));
    if (i === 0) shape.moveTo(a.x, a.y); else shape.lineTo(a.x, a.y);
    if (rr > 0) shape.quadraticCurveTo(cur.x, cur.y, b.x, b.y);
  }
  shape.closePath();
  return shape;
}
function roundedPath(pts) { return roundedShape(pts, new THREE.Path()); }

// Extrude a side-profile shape (in the XY plane) across Z, centred on zc.
function slab(shape, width, { bevel = 0.04, segs = 3, zc = 0, curveSegments = 24 } = {}) {
  const depth = Math.max(0.001, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.9, bevelSegments: segs, curveSegments,
  });
  g.translate(0, 0, zc - depth / 2);
  return g;
}

// Lathe around the X axis. pts = [[x, r], ...]
function latheX(pts, seg = 64) {
  const g = new THREE.LatheGeometry(pts.map(([x, r]) => new THREE.Vector2(r, x)), seg);
  g.rotateZ(-Math.PI / 2);
  g.scale(1, 1, 1);
  // after rotateZ(-90deg) the lathe axis (y) maps to +x
  return g;
}

function clean(g) {
  g = g.index ? g.toNonIndexed() : g;
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  return g;
}
function creased(g, angle = 34) { return toCreasedNormals(clean(g), THREE.MathUtils.degToRad(angle)); }

const evaluator = new Evaluator();
evaluator.attributes = ['position', 'normal'];
evaluator.useGroups = false;
// Cutters passed together must not overlap each other (they are merged into one brush).
function subtract(base, ...cutters) {
  let a = new Brush(clean(base)); a.updateMatrixWorld();
  const cut = new Brush(mergeGeometries(cutters.map(clean))); cut.updateMatrixWorld();
  const r = evaluator.evaluate(a, cut, SUBTRACTION);
  return r.geometry;
}
// For cutters that overlap, subtract them one after another.
function subtractEach(base, ...cutters) {
  let g = base;
  for (const c of cutters) g = subtract(g, c);
  return g;
}
function box(x0, x1, y0, y1, z0, z1) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return g;
}



// Screw head with its drive recess ("inlet"). Built along +y with the underside at y = 0.
// style: 'slot' (flat blade), 'phillips' (cross), 'hex' (socket). countersunk heads sit nearly flush.
function screwHead(r, { style = 'slot', h, countersunk = false, seg = 36 } = {}) {

// a circle (or ring when hole > 0) as a THREE.Shape, centred on (cx, cy)
function circ(r, cx = 0, cy = 0, hole = 0) {
  const s = new THREE.Shape(); s.absarc(cx, cy, r, 0, Math.PI * 2, false);
  if (hole > 0) { const h = new THREE.Path(); h.absarc(cx, cy, hole, 0, Math.PI * 2, true); s.holes.push(h); }
  return s;
}

function buildPhone(K) {
  const { M } = K;

  const N = { tactical_phone: root };
  const reg = (n) => (N[n.name] = n);

  const R = PH.rail, C = PH.corner, Hh = PH.hole, S = PH.screen, B = PH.back, L = PH.lug;
  const inset = (v, b) => v - b * 0.9;
  const SMALL_WEAR = { chip: 0.6, k: 220 };

  /* ---------------------------------------------------------------- rail: front band, rubber gasket seam, rear band */
  const holePts = (g = 0) => [
    [-Hh.x - g, Hh.yb - g, 0.006], [Hh.x + g, Hh.yb - g, 0.006], [Hh.x + g, Hh.yt - 0.006 + g, 0.001], [Hh.x - 0.006 + g, Hh.yt + g, 0.001],

  const railRect = (d = 0) => rect(-inset(R.x, R.b) + d, inset(R.x, R.b) - d, -inset(R.y, R.b) + d, inset(R.y, R.b) - d, R.r - d);
  {

    add(body, slabZ(ringShape(railRect(), [roundedPath(holePts(R.b * 0.9))]), R.z0, 0.0026, R.b, 3, 12), M.gunmetal, 'body_rail');
    const inner = roundedPath([[-0.0368, -0.0752, 0.007], [0.0368, -0.0752, 0.007], [0.0368, 0.0752, 0.007], [-0.0368, 0.0752, 0.007]]);
    add(body, slabZ(ringShape(railRect(), [inner]), 0.0042, R.z1, 0.0009, 2, 12), M.gunmetal, 'body_rail_rear');
    add(body, slabZ(rect(-R.x + 0.0006, R.x - 0.0006, -R.y + 0.0006, R.y - 0.0006, R.r - 0.0006), 0.0021, 0.0047, 0.0003, 1, 12), M.rubber, 'body_rail_gasket');
  }
  /* bezel: the black band between the rail and the glass (tucks under the rail) */
  {
    const outer = roundedShape(holePts(0.0008));
    const win = roundedPath([[-S.w / 2 - 0.001, S.y - S.h / 2 - 0.001, 0.005], [S.w / 2 + 0.001, S.y - S.h / 2 - 0.001, 0.005], [S.w / 2 + 0.001, S.y + S.h / 2 + 0.001, 0.003], [-S.w / 2 - 0.001, S.y + S.h / 2 + 0.001, 0.003]]);

    const inner = roundedPath([[-w, y0, 0.004], [w, y0, 0.004], [w, y1 - 0.0035, 0.001], [w - 0.0035, y1, 0.001], [-w + 0.0035, y1, 0.001], [-w, y1 - 0.0035, 0.001]]);

    const gout = roundedShape([[-w - 0.0002, y0 - 0.0002, 0.0042], [w + 0.0002, y0 - 0.0002, 0.0042], [w + 0.0002, y1 - 0.0034, 0.001], [w - 0.0034, y1 + 0.0002, 0.001], [-w + 0.0034, y1 + 0.0002, 0.001], [-w - 0.0002, y1 - 0.0034, 0.001]]);

  /* ---------------------------------------------------------------- armoured corners */

      front.push(slabZ(roundedShape(map(L0)), -0.0106, -0.0030, 0.0012, 2, 7));
      back.push(slabZ(roundedShape(map(L0)), 0.0030, C.z, 0.0012, 2, 7));

function concreteTexture(seamsX, seamsY, tone) {

  let s = 1234567;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 60; i++) {
    const gx = rnd() * 1024, gy = rnd() * 1024, g = x.createRadialGradient(gx, gy, 0, gx, gy, 80 + rnd() * 240);
    const v = rnd() < 0.5 ? 0 : 255; g.addColorStop(0, `rgba(${v},${v},${v},${0.035 + rnd() * 0.04})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, 1024, 1024);
  }
  for (let i = 0; i < 26000; i++) { const v = rnd() < 0.5 ? 20 : 220; x.fillStyle = `rgba(${v},${v},${v},${0.05 + rnd() * 0.08})`; x.fillRect(rnd() * 1024, rnd() * 1024, 1 + rnd() * 2, 1 + rnd() * 2); }
  x.lineWidth = 3;
  for (let i = 0; i <= seamsX; i++) { const p = (i / seamsX) * 1024; x.strokeStyle = 'rgba(0,0,0,0.5)'; x.beginPath(); x.moveTo(p, 0); x.lineTo(p, 1024); x.stroke(); x.strokeStyle = 'rgba(255,255,255,0.08)'; x.beginPath(); x.moveTo(p + 3, 0); x.lineTo(p + 3, 1024); x.stroke(); }
  for (let i = 0; i <= seamsY; i++) { const p = (i / seamsY) * 1024; x.strokeStyle = 'rgba(0,0,0,0.5)'; x.beginPath(); x.moveTo(0, p); x.lineTo(1024, p); x.stroke(); x.strokeStyle = 'rgba(255,255,255,0.08)'; x.beginPath(); x.moveTo(0, p + 3); x.lineTo(1024, p + 3); x.stroke(); }
  if (seamsX) for (let i = 0; i < seamsX; i++) for (let j = 0; j < seamsY; j++) for (const [u, v] of [[0.25, 0.3], [0.75, 0.3], [0.25, 0.7], [0.75, 0.7]]) {

}

function clipOf() { return { clip: PLAY.clip, t: +PLAY.t.toFixed(3), cell: SCREEN_CELLS[PHONE.screen.cell], pose: poseName, hand: GLOVE.visible }; }
function sceneRefresh() {
  const C = PHONE.clips[PLAY.clip];
  if (C) PHONE.pose(PLAY.clip, PLAY.t); else PHONE.rest();
  PHONE.screen.setCell(PLAY.cell ?? (PLAY.state ? stateCell(PLAY.state, PLAY.time) : cellFor(PLAY.clip, C ? (C.loop ? wrap(PLAY.t, C.len) : Math.min(PLAY.t, C.len)) : 0)));
  applyLed(PLAY.led ?? ledFor(PLAY.clip));
}
// one-shots chain back to idle (power_off holds off; port_open holds open)
const CHAIN = { wake: 'unlock', unlock: 'idle', scan: 'idle' };
let onClipChange = () => { };
function playClip(name) { PLAY.clip = name; PLAY.t = 0; PLAY.playing = true; PLAY.cell = null; PLAY.led = null; PLAY.state = null; onClipChange(name); }
// sound cues: [sound, time in the clip]; looping clips repeat their cues every loop
const CLIP_CUES = {
  idle: [], wake: [['button', 0.05], ['wake', 0.25]], unlock: [['tap', 0.3], ['unlock', 0.42]], scan: [['button', 0.05], ['scan', 0.3], ['scan_result', 1.0]],
  alert: [['alert', 0]], power_off: [['button', 0.05], ['power_off', 0.6]], port_open: [['flap_open', 0.02]],
};
let onCue = () => { };
function sceneTick(dt) {
  PLAY.time += dt;
  if (PLAY.playing) {
    const C0 = PHONE.clips[PLAY.clip], a = C0 && C0.loop ? wrap(PLAY.t, C0.len) : PLAY.t;
    PLAY.t += dt;
    const b = C0 && C0.loop ? wrap(PLAY.t, C0.len) : PLAY.t;
    for (const [snd, at] of CLIP_CUES[PLAY.clip] || []) if ((b >= a && at > a && at <= b) || (b < a && (at > a || at <= b)) || (at === 0 && PLAY.t === dt)) onCue(snd);
    const C = PHONE.clips[PLAY.clip];
    if (C && !C.loop && PLAY.t >= C.len) { const nx = CHAIN[PLAY.clip]; if (nx) playClip(nx); else { PLAY.t = C.len; PLAY.playing = false; } }
  }
  sceneRefresh();
}

/* views (world space, from the held pose) */
function viewFor(name) {
  HOLD.updateMatrixWorld(true);
  const L = (x, y, z) => HOLD.localToWorld(V3(x, y, z));
  const T = L(0, 0.002, 0);
  switch (name) {
    case 'ref': { const d = V3(-0.12, 0.27, -1).normalize().multiplyScalar(0.255), t = V3(0.008, 0.014, 0); return { pos: L(d.x + t.x, d.y + t.y, d.z), target: L(t.x, t.y, 0), fov: 40 }; }
    case 'front': return { pos: L(0, 0.006, -0.42), target: L(0, 0.006, 0) };
    case 'back': return { pos: L(0.16, 0.08, 0.36), target: L(0, 0.006, 0) };
    case 'side': return { pos: L(-0.42, 0.01, -0.03), target: L(0, 0.006, 0) };
    case 'top': return { pos: L(0.04, 0.3, -0.12), target: L(0, 0.05, 0) };
    case 'bottom': return { pos: L(0.05, -0.2, -0.13), target: L(0, -0.075, 0) };
    case 'fp': return { pos: V3(0, 1.62, 0), target: L(0, 0, 0) };
    default: return { pos: L(-0.2, 0.1, -0.33), target: L(0, 0.006, 0) };     // '34': front three-quarter
  }
}
setPose('ref');

let actx = null; const sfxBuf = {};
function audioUnlock() { if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); } if (actx.state !== 'running') actx.resume().catch(() => { }); }
function playSfx(name, gain = 0.8) {
  if (!actx || !SOUND_DATA[name]) return;
  const go = (b) => { const s = actx.createBufferSource(), g = actx.createGain(); g.gain.value = gain; s.buffer = b; s.connect(g).connect(actx.destination); s.start(); };
  if (sfxBuf[name]) return go(sfxBuf[name]);
  fetch(SOUND_DATA[name]).then((r) => r.arrayBuffer()).then((a) => actx.decodeAudioData(a)).then((b) => { sfxBuf[name] = b; go(b); }).catch(() => { });
}


/* ------------------------------------------------------------------ UI */

const $ = (id) => document.getElementById(id);
let camTween = null, spinning = false, soundOn = true;
function unlockAudio() { if (typeof audioUnlock === 'function') audioUnlock(); }
function goView(name, instant = false) {
  const v = viewFor(name); camTween = null;
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  if (v.fov) { camera.fov = v.fov; camera.updateProjectionMatrix(); } else if (camera.fov !== 34) { camera.fov = 34; camera.updateProjectionMatrix(); }
  if (instant) { camera.position.copy(v.pos); controls.target.copy(v.target); controls.update(); return; }
  camTween = { from: camera.position.clone(), fromT: controls.target.clone(), to: v.pos, tt: v.target, t: 0 };
}
function setSpin(on) { spinning = on; controls.autoRotate = on; controls.autoRotateSpeed = 0.8; $('spin').setAttribute('aria-pressed', String(on)); }
for (const name of PHONE.order) {
  const b = document.createElement('button'); b.type = 'button'; b.dataset.clip = name; b.textContent = name.replace('_', ' ');
  b.addEventListener('click', () => { unlockAudio(); playClip(name); }); $('clips').appendChild(b);
}
onClipChange = (name) => {
  if (typeof markState === 'function') markState();
  document.querySelectorAll('[data-clip]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.clip === name)));
  $('st-clip').textContent = name.replace('_', ' ');
};
document.querySelectorAll('[data-app]').forEach((b) => b.addEventListener('click', () => { PLAY.app = b.dataset.app; document.querySelectorAll('[data-app]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }));

document.querySelectorAll('[data-state]').forEach((b) => b.addEventListener('click', () => {
  unlockAudio(); PLAY.state = b.dataset.state || null; PLAY.cell = null; PLAY.led = null; PLAY.time = 0; markState();
  if (soundOn && typeof playSfx === 'function') { const s = { boot: 'wake', lock_on: 'scan_result', alert: 'alert', low_battery: 'low_battery', shutdown: 'power_off', home: 'tap', map: 'tap', drone: 'tap', scan: 'scan' }[PLAY.state]; if (s) playSfx(s); }
}));
function markLight() { document.querySelectorAll('[data-light]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.light === lightingName))); }
document.querySelectorAll('[data-light]').forEach((b) => b.addEventListener('click', () => { setLighting(b.dataset.light); markLight(); }));
onCue = (snd) => { if (soundOn && typeof playSfx === 'function') playSfx(snd); };
// tap the glass: a tick (click without dragging)
{
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
  renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return; down = null;
    const r = renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera); const hit = ray.intersectObject(PHONE.nodes.screen, true)[0];
    if (hit) { unlockAudio(); if (soundOn && typeof playSfx === 'function') playSfx('tap'); }
  });
}
$('hand').addEventListener('click', () => { setHand(!GLOVE.visible); $('hand').setAttribute('aria-pressed', String(GLOVE.visible)); });
$('spin').addEventListener('click', () => setSpin(!spinning));
$('sound').addEventListener('click', () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', String(soundOn)); if (soundOn) unlockAudio(); });
window.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'h') $('hand').click(); else if (k === 'l') { const L = Object.keys(LIGHTING); setLighting(L[(L.indexOf(lightingName) + 1) % L.length]); markLight(); } else if (k >= '1' && k <= String(PHONE.order.length)) playClip(PHONE.order[+k - 1]);
});
controls.addEventListener('start', () => { camTween = null; });
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize);

/* ------------------------------------------------------------------ export */

const MODELS = [PHONE];
function exportScenes() { const out = exportScenesFor(MODELS); sceneRefresh(); return out; }
async function exportGLB() {
  const was = looping;
  return exportGLBFor(MODELS, {
    before: () => { setLoop(false); PHONE.screen.setCell('map_a'); applyLed('normal'); },
    after: () => { sceneRefresh(); if (was) setLoop(true); },
  });
}
// preview.png: no UI, held like the reference, the map app on screen
function preview() {
  setLoop(false); setSpin(false);
  document.querySelectorAll('.plate, .bar, .hint').forEach((e) => { e.hidden = true; });
  setLighting('studio'); PLAY.state = null; setPose('ref'); setHand(true); hold('idle', 0.2); PLAY.cell = 'map_a'; sceneRefresh();
  goView('ref', true);
  // the ref view crops like the photo; the preview pulls back so the lug and the bracket fit
  { const d = camera.position.clone().sub(controls.target); controls.target.add(HOLD.localToWorld(V3(0, 0.012, 0)).sub(HOLD.localToWorld(V3(0, 0, 0)))); camera.position.copy(controls.target).add(d.multiplyScalar(1.32)); controls.update(); }
  composer.render(); const gl = renderer.getContext(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
}
function stats() {
  const mats = new Set(), meshes = []; PHONE.root.traverse((o) => { if (o.isMesh) { mats.add(o.material.name); meshes.push(o.name); } });
  return { timings: TIMINGS, tris: triCount(PHONE.root), materials: [...mats].sort(), meshes, box: boxOf(PHONE.root) };
}
window.__model = { id: 'tactical-phone', exportScenes, exportGLB, preview, timings: TIMINGS };

/* ------------------------------------------------------------------ go */

goView('ref', true);
$('loading').hidden = true;
const clock = new THREE.Clock();
let looping = false;
function setLoop(on) { looping = on; renderer.setAnimationLoop(on ? loop : null); }
function tick(dt) {
  sceneTick(dt);
  $('st-cell').textContent = SCREEN_CELLS[PHONE.screen.cell].replace('_', ' ');
  if (camTween) { camTween.t = Math.min(1, camTween.t + dt / 0.9); const e = ease(camTween.t); camera.position.lerpVectors(camTween.from, camTween.to, e); controls.target.lerpVectors(camTween.fromT, camTween.tt, e); if (camTween.t >= 1) camTween = null; }
}
function loop() { const dt = Math.min(clock.getDelta(), 1 / 30); tick(dt); controls.update(); composer.render(dt); }
playClip('idle');
document.querySelector('[data-app="map"]').setAttribute('aria-pressed', 'true');
markState(); setLighting('studio'); markLight();
tick(0);
setLoop(true);
window.__model.ready = true;
// debug contract (closeups.js / evalpage.js use m = window.__model.debug; DESIGN.md 10)
const baseSet = makeDebugSet({ model: PHONE, hold, setCell, setLed, setHand, setPose, refresh: sceneRefresh, clipOf, camera, controls });
window.__model.debug = {
  tick, stop: () => setLoop(false),
  renderOnce: () => { controls.update(); composer.render(); const gl = renderer.getContext(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4)); },
  set: (o) => { if (o.lighting) setLighting(o.lighting); if (o.state !== undefined) { PLAY.state = o.state; PLAY.time = o.stateT || 0; } else if (o.clip !== undefined) PLAY.state = null; return Object.assign(baseSet(o), { state: PLAY.state, lighting: lightingName }); },
  setLighting, SCREEN_STATES, setSpin, goView, viewFor, setPose, setHand, POSES, HOLD, GLOVE, camera, controls, scene, renderer, composer, bloom, ao, pivot, LIGHTS, backdrop,
