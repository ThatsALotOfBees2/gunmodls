<style>
  /* Layout: full-bleed bay with a test wall; field-manual plate top-left, control strip along the bottom. */
  :root {
    --bg: #e6e6ec;
    --bg-deep: #c9cad3;
    --fg: #16171d;
    --muted: #5b5e6b;
    --panel: rgba(240, 240, 246, 0.8);
    --line: rgba(22, 23, 29, 0.16);
    --accent: #6a3fe0;
    --accent-fg: #f7f3ff;
    --font-display: "Chakra Petch", "Arial Narrow", sans-serif;
    --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Chivo Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0c11; --bg-deep: #05060a; --fg: #e8e8f0; --muted: #8e92a6;
      --panel: rgba(13, 14, 20, 0.74); --line: rgba(232, 232, 240, 0.13);
      --accent: #8f63ff; --accent-fg: #0e0819; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0c11; --bg-deep: #05060a; --fg: #e8e8f0; --muted: #8e92a6;
    --panel: rgba(13, 14, 20, 0.74); --line: rgba(232, 232, 240, 0.13);
    --accent: #8f63ff; --accent-fg: #0e0819; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 38%, var(--bg) 0%, var(--bg) 35%, var(--bg-deep) 100%);
    background-color: var(--bg);
    color: var(--fg); font-family: var(--font-body); overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; outline: none; }
  .plate {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); left: max(16px, env(safe-area-inset-left, 0px));
    max-width: min(360px, calc(100vw - 32px)); display: grid; gap: 6px; pointer-events: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .plate h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5.2vw, 36px);
    line-height: 0.95; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .plate h1 span { color: var(--accent); }
  .specs {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 6px 0 0;
    font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .specs dt { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10.5px; padding-top: 1px; }
  .specs dd { margin: 0; }
  .state { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; font: 500 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
  .chip b { font-weight: 500; color: var(--accent); }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: center; pointer-events: none;
  }
  .controls {
    pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 14px; padding: 8px; max-width: 100%;
  }
  .group { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--line); }
  button {
    font: 500 13px/1 var(--font-body); color: var(--fg); background: transparent; border: 0;
    padding: 9px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center;
  }

  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-fg); font-weight: 600; padding: 10px 16px; min-width: 112px; justify-content: center; }
  kbd { font: 500 11px var(--font-mono); opacity: 0.75; border: 1px solid currentColor; border-radius: 4px; padding: 1px 4px; }
  .hint {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 20px);
    font: 11px var(--font-mono); letter-spacing: 0.06em; color: #9a9db0; text-align: right; pointer-events: none;
  }
  .label {
    font: 500 11px var(--font-mono); letter-spacing: 0.04em; color: #e8e8f0;
    background: rgba(13, 14, 20, 0.78); border: 1px solid rgba(232, 232, 240, 0.16); border-radius: 6px; padding: 4px 7px;

  }

<body>
<div id="stage" aria-label="Interactive 3D models of a wall-mounted security camera and a throwable sticky camera, with a live camera feed"></div>
<div id="feed" class="feed" aria-label="Camera feed"><div class="feed-tag"><span id="feed-dot"></span><span id="feed-name">Security cam</span></div></div>

<header class="plate">

      <button type="button" data-cam="sticky" aria-pressed="false" title="2">Sticky cam</button>

    <button id="deploy" class="primary" type="button" title="Throw the sticky cam, or stow it (D)">Throw <kbd>D</kbd></button>
    <button type="button" id="scanb" aria-pressed="true" title="Slow automatic sweep (A)">Auto-sweep</button>
    <div class="group" role="group" aria-label="View">
      <button type="button" data-view="34">¾</button>
      <button type="button" data-view="security">Security</button>
      <button type="button" data-view="sticky">Sticky</button>
    </div>
    <button type="button" id="sway" aria-pressed="true">Orbit</button>
    <button type="button" id="sound" aria-pressed="true" title="Sounds (S)">Sound</button>
  </div>
</nav>

<style>
  .feed { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 64px); width: min(34vw, 380px); aspect-ratio: 16 / 10;
    border: 1px solid rgba(167, 123, 255, 0.55); border-radius: 10px; overflow: hidden; cursor: grab; touch-action: none;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), inset 0 0 60px rgba(0, 0, 0, 0.75); background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px); }
  .feed-tag { position: absolute; left: 10px; top: 8px; display: flex; gap: 6px; align-items: center; font: 500 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: #e8e8f0; text-shadow: 0 1px 2px #000; }
  #feed-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff4d4d; box-shadow: 0 0 6px #ff4d4d; }

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.7/src/index.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices, toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';

// Metres, +Y up. Security camera: origin at the centre of its wall plate on the wall surface, wall normal +Z,
// it looks along +Z at rest. Sticky camera: origin at the centre of its base on the surface it sticks to,
// surface normal +Y, it looks along +Z at rest. Each has a lens node (fx_lens) that looks along its -Z... see below.

/* ------------------------------------------------------------------ helpers */

// Monotone cubic interpolation through [x, y] points (no overshoot).
function curve(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const constant = v => () => v;

// Loft a superellipse cross-section along X. top/bot/hw/n are functions of x.
// round: radius used to roll the edges at both ends; caps are flat.
function loft({ x0, x1, top, bot, hw, n = constant(2.6), cy = null, steps = 160, seg = 72, round = 0, roundStart = round, roundEnd = round, groove = null }) {
  const xs = [];
  // denser stations near the ends so the rolled edges stay smooth
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const e = 0.5 - 0.5 * Math.cos(Math.PI * u);
    xs.push(x0 + (x1 - x0) * (0.55 * u + 0.45 * e));
  }
  const pos = [], idx = [];
  const ring = (x) => {
    let T = top(x), B = bot(x), W = hw(x);
    const ds = x - x0, de = x1 - x;
    let inset = 0;
    if (roundStart > 0 && ds < roundStart) inset = Math.max(inset, roundStart - Math.sqrt(Math.max(0, roundStart * roundStart - (roundStart - ds) ** 2)));
    if (roundEnd > 0 && de < roundEnd) inset = Math.max(inset, roundEnd - Math.sqrt(Math.max(0, roundEnd * roundEnd - (roundEnd - de) ** 2)));
    let gB = 0, gW = 0;
    if (groove) { const g = groove(x); gB = g; gW = g; }
    T -= inset; B += inset + gB; W -= inset + gW;
    // a rounding radius larger than the section must not turn the ring inside out
    W = Math.max(0.002, W);
    const c = cy ? cy(x) : (T + B) / 2, ry = Math.max(0.001, (T - B) / 2);
    const e = 2 / n(x), out = [];
    for (let j = 0; j < seg; j++) {
      const t = (j / seg) * Math.PI * 2, co = Math.cos(t), si = Math.sin(t);
      const z = W * Math.sign(co) * Math.pow(Math.abs(co), e);
      const y = c + ry * Math.sign(si) * Math.pow(Math.abs(si), e);
      out.push([x, y, z]);
    }
    return out;
  };
  const rings = xs.map(ring);
  rings.forEach(r => r.forEach(p => pos.push(...p)));
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * seg + j, b = i * seg + (j + 1) % seg, c = (i + 1) * seg + j, d = (i + 1) * seg + (j + 1) % seg;
      idx.push(a, c, b, b, c, d);
    }
  }
  // flat caps with their own vertices
  const capAt = (r, flip) => {
    const base = pos.length / 3;
    const cx = r.reduce((s, p) => s + p[1], 0) / r.length;
    pos.push(r[0][0], cx, 0);
    r.forEach(p => pos.push(...p));
    for (let j = 0; j < seg; j++) {
      const a = base + 1 + j, b = base + 1 + (j + 1) % seg;
      flip ? idx.push(base, a, b) : idx.push(base, b, a);
    }
  };
  // caps face outward: -x at the start, +x at the end
  capAt(rings[0], true);
  capAt(rings[rings.length - 1], false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Polygon with per-corner radius: pts = [[x, y, r], ...]
function roundedShape(pts, shape = new THREE.Shape()) {
  const n = pts.length;
  const P = pts.map(p => new THREE.Vector2(p[0], p[1]));
  for (let i = 0; i < n; i++) {
    const prev = P[(i - 1 + n) % n], cur = P[i], next = P[(i + 1) % n], r = pts[i][2] || 0;
    const v1 = prev.clone().sub(cur), v2 = next.clone().sub(cur);
    const l1 = v1.length(), l2 = v2.length();
    const rr = Math.min(r, l1 / 2.05, l2 / 2.05);
    const a = cur.clone().add(v1.normalize().multiplyScalar(rr));
    const b = cur.clone().add(v2.normalize().multiplyScalar(rr));
    if (i === 0) shape.moveTo(a.x, a.y); else shape.lineTo(a.x, a.y);
    if (rr > 0) shape.quadraticCurveTo(cur.x, cur.y, b.x, b.y);
  }
  shape.closePath();
  return shape;
}
function roundedPath(pts) { return roundedShape(pts, new THREE.Path()); }

// Extrude a side-profile shape (in the XY plane) across Z, centred on zc.
function slab(shape, width, { bevel = 0.04, segs = 3, zc = 0, curveSegments = 24 } = {}) {
  const depth = Math.max(0.001, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.9, bevelSegments: segs, curveSegments,
  });
  g.translate(0, 0, zc - depth / 2);
  return g;
}

// Lathe around the X axis. pts = [[x, r], ...]
function latheX(pts, seg = 64) {
  const g = new THREE.LatheGeometry(pts.map(([x, r]) => new THREE.Vector2(r, x)), seg);
  g.rotateZ(-Math.PI / 2);
  g.scale(1, 1, 1);
  // after rotateZ(-90deg) the lathe axis (y) maps to +x
  return g;
}

function clean(g) {
  g = g.index ? g.toNonIndexed() : g;
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  return g;
}
function creased(g, angle = 34) { return toCreasedNormals(clean(g), THREE.MathUtils.degToRad(angle)); }

const evaluator = new Evaluator();
evaluator.attributes = ['position', 'normal'];
evaluator.useGroups = false;
// Cutters passed together must not overlap each other (they are merged into one brush).
function subtract(base, ...cutters) {
  let a = new Brush(clean(base)); a.updateMatrixWorld();
  const cut = new Brush(mergeGeometries(cutters.map(clean))); cut.updateMatrixWorld();
  const r = evaluator.evaluate(a, cut, SUBTRACTION);
  return r.geometry;
}
// For cutters that overlap, subtract them one after another.
function subtractEach(base, ...cutters) {
  let g = base;
  for (const c of cutters) g = subtract(g, c);
  return g;
}
function box(x0, x1, y0, y1, z0, z1) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return g;
}



// Screw head with its drive recess ("inlet"). Built along +y with the underside at y = 0.
// style: 'slot' (flat blade), 'phillips' (cross), 'hex' (socket). countersunk heads sit nearly flush.
function screwHead(r, { style = 'slot', h, countersunk = false, seg = 36 } = {}) {
  if (h === undefined) h = countersunk ? r * 0.5 : r * 0.6;
  const prof = countersunk
    ? [[0, 0], [r * 0.5, 0], [r, h - 0.006], [r, h], [0, h]]
    : [[0, 0], [r, 0], [r, h * 0.45], [r * 0.86, h * 0.82], [r * 0.55, h * 0.97], [0, h]];
  let g = new THREE.LatheGeometry(prof.map(([x, y]) => new THREE.Vector2(x, y)), seg);
  // the recess a driver goes into: deep enough to grip, open across the head for a blade
  const d = Math.min(h * 0.85, r * 0.62);
  if (style === 'slot') g = subtract(g, box(-r * 1.3, r * 1.3, h - d, h + 0.2, -r * 0.17, r * 0.17));
  else if (style === 'phillips') {
    g = subtractEach(g, box(-r * 0.68, r * 0.68, h - d, h + 0.2, -r * 0.13, r * 0.13), box(-r * 0.13, r * 0.13, h - d, h + 0.2, -r * 0.68, r * 0.68));
  } else if (style === 'hex') {
    g = subtract(g, new THREE.CylinderGeometry(r * 0.5, r * 0.5, d * 2, 6).translate(0, h, 0));
  }
  return creased(g, 35);
}
// Put a screw head at pos with its axis along normal; spin turns the recess about that axis.
function placeScrew(geo, pos, normal, spin = 0) {
  geo.applyMatrix4(new THREE.Matrix4().makeRotationY(spin));
  geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal.clone().normalize()));
  geo.translate(pos.x, pos.y, pos.z);
  return geo;
}


const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => ease(clamp01((t - a) / (b - a)));
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const NOISE = /* glsl */`
varying vec3 vObjPos;
uniform float uGrain, uColorVar, uRoughVar, uWood;
uniform vec3 uWoodDark;
float h3(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x), mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x), f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x), mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x), f.y), f.z);
}
float fbm3(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + 1.7; a *= 0.5; } return s; }
// fw = pixel footprint in noise cells at the first octave; octaves near or below a pixel fade to their mean
float fbmAA(vec3 p, float fw){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*mix(vnoise(p), 0.5, smoothstep(0.3, 1.0, fw)); p = p*2.03 + 1.7; a *= 0.5; fw *= 2.03; } return s; }
`;

// Physical material with object-space grain (colour mottling + roughness breakup); wood adds
// laminate figure running along the stock.
function surface(params, noise = {}) {
  const m = new THREE.MeshPhysicalMaterial(params);
  const u = {

}

  if (sticky.phase === 'flying') {
    sticky.t += dt; const k = clamp01(sticky.t / 0.6), from = V3(-0.2, 1.4, 3.4);
    stk.root.position.copy(from.clone().lerp(STICK_AT, k)); stk.root.position.y += Math.sin(Math.PI * k) * 0.5;
    stk.root.rotation.set((1 - k) * 9, -0.6, (1 - k) * 4); poseSticky(stk, 0);
    if (k >= 1) { sticky.phase = 'deploying'; sticky.t = 0; stk.root.rotation.set(0, -0.6, 0); SFX.land(); }
  } else if (sticky.phase === 'deploying') {
    sticky.t += dt; poseSticky(stk, clamp01(sticky.t / 0.6)); if (sticky.t >= 0.6) { sticky.phase = 'ready'; SFX.boot(); }
  } else if (sticky.phase === 'stowing') {
    sticky.t += dt; poseSticky(stk, 1 - clamp01(sticky.t / 0.5)); if (sticky.t >= 0.5) sticky.phase = 'stowed';
  } else poseSticky(stk, sticky.phase === 'ready' ? 1 : 0);
  stk.root.visible = sticky.phase !== 'stowed';   // still in the operator's hand
  aim(stk, state.sticky.pan, state.sticky.tilt);
  const feedOn = active === 'security' || sticky.phase === 'ready';
  feedEl.style.opacity = feedOn ? 1 : 0.35;
  $('feed-name').textContent = active === 'security' ? 'Security cam' : 'Sticky cam';
  $('feed-dot').style.opacity = feedOn && Math.sin(now * 5) > 0 ? 1 : 0.25;
  CM.rec.emissiveIntensity = Math.sin(now * 5) > 0 ? 2.2 : 0.3;
  const st = active === 'sticky' ? { stowed: 'In hand', flying: 'Thrown', deploying: 'Deploying', ready: 'Watching', stowing: 'Stowing' }[sticky.phase] : 'Watching';
  if ($('status').textContent !== st) $('status').textContent = st;
  const lab = sticky.phase === 'stowed' ? 'Throw ' : 'Stow ';
  if ($('deploy').firstChild.textContent !== lab) $('deploy').firstChild.textContent = lab;
}

/* ------------------------------------------------------------------ sound */

let actx = null, soundOn = true;
function audioInit() { if (actx) return; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
function unlockAudio() { audioInit(); if (actx && actx.state !== 'running') actx.resume().catch(() => { }); }
function tone({ f0, f1 = f0, dur, gain = 0.1, type = 'sine', delay = 0 }) {
  if (!soundOn || !actx || actx.state !== 'running') return;
  const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const SFX = {
  servo: () => tone({ f0: 1300, f1: 1600, dur: 0.12, gain: 0.03, type: 'sawtooth' }),
  land: () => { tone({ f0: 220, f1: 90, dur: 0.12, gain: 0.25, type: 'square' }); tone({ f0: 2600, dur: 0.04, gain: 0.08, delay: 0.02 }); },
  boot: () => { tone({ f0: 600, f1: 1800, dur: 0.25, gain: 0.06, type: 'triangle' }); tone({ f0: 2200, dur: 0.07, gain: 0.07, delay: 0.3 }); },
  throwS: () => tone({ f0: 500, f1: 1500, dur: 0.5, gain: 0.03, type: 'sawtooth' }),
};

/* ------------------------------------------------------------------ UI */

function viewFor(name) {
  const asp = camera.aspect, kk = asp < 1.1 ? 1.4 / Math.max(asp, 0.45) : 1;
  const T = { '34': [V3(1.7, 1.75, 3.1), V3(-0.1, 1.2, 0.5)], security: [V3(-0.2, 2.35, 0.75), V3(-0.6, 2.1, 0.12)], sticky: [V3(1.35, 0.32, 1.3), V3(1.0, 0.04, 0.9)] }[name];
  return { pos: T[1].clone().add(T[0].clone().sub(T[1]).multiplyScalar(kk)), target: T[1] };
}
let camTween = null;
function goView(name, instant = false) { const v = viewFor(name); swayT = 0; camTween = null; if (instant) { camera.position.copy(v.pos); controls.target.copy(v.target); controls.update(); return; } camTween = { from: camera.position.clone(), fromT: controls.target.clone(), to: v.pos, tt: v.target, t: 0 }; }
controls.minDistance = 0.12; controls.minAzimuthAngle = -1.3; controls.maxAzimuthAngle = 1.3;
function setActive(k) { active = k; document.querySelectorAll('[data-cam]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cam === k))); }
function toggleSticky() {
  autoStart = -1; setActive('sticky');
  if (sticky.phase === 'stowed') { sticky = { phase: 'flying', t: 0 }; SFX.throwS(); }
  else if (sticky.phase === 'ready') { sticky = { phase: 'stowing', t: 0 }; }
}
document.querySelectorAll('[data-cam]').forEach(b => b.addEventListener('click', () => setActive(b.dataset.cam)));
$('deploy').addEventListener('click', toggleSticky);
$('scanb').addEventListener('click', () => { autoSweep = !autoSweep; $('scanb').setAttribute('aria-pressed', String(autoSweep)); });
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => goView(b.dataset.view)));
$('sound').addEventListener('click', () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', String(soundOn)); if (soundOn) unlockAudio(); });
$('sway').addEventListener('click', () => { swayOn = !swayOn; $('sway').setAttribute('aria-pressed', String(swayOn)); });
window.addEventListener('pointerdown', unlockAudio, { capture: true });
controls.addEventListener('start', () => { if (swayOn) { swayOn = false; $('sway').setAttribute('aria-pressed', 'false'); } camTween = null; });
// aim by dragging the feed or with the arrow keys
let drag = null;
feedEl.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; feedEl.setPointerCapture(e.pointerId); autoSweep = false; $('scanb').setAttribute('aria-pressed', 'false'); e.stopPropagation(); });
feedEl.addEventListener('pointermove', (e) => { if (!drag) return; const s = state[active]; s.pan -= (e.clientX - drag.x) * 0.25; s.tilt -= (e.clientY - drag.y) * 0.25; const L = C(); s.pan = THREE.MathUtils.clamp(s.pan, L.panLim[0], L.panLim[1]); s.tilt = THREE.MathUtils.clamp(s.tilt, L.tiltLim[0], L.tiltLim[1]); drag = { x: e.clientX, y: e.clientY }; if (Math.random() < 0.15) SFX.servo(); });
feedEl.addEventListener('pointerup', () => { drag = null; });
window.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key; if (k === 'd' || k === 'D') { e.preventDefault(); if (!e.repeat) toggleSticky(); }
  if (k === '1') setActive('security'); if (k === '2') setActive('sticky'); if (k === 'a' || k === 'A') $('scanb').click(); if (k === 's' || k === 'S') $('sound').click();
  const s = state[active], L = C(), step = 4;
  if (k.startsWith('Arrow')) { e.preventDefault(); autoSweep = false; $('scanb').setAttribute('aria-pressed', 'false');
    if (k === 'ArrowLeft') s.pan += step; if (k === 'ArrowRight') s.pan -= step; if (k === 'ArrowUp') s.tilt += step; if (k === 'ArrowDown') s.tilt -= step;
    s.pan = THREE.MathUtils.clamp(s.pan, L.panLim[0], L.panLim[1]); s.tilt = THREE.MathUtils.clamp(s.tilt, L.tiltLim[0], L.tiltLim[1]); SFX.servo(); }
  unlockAudio();
});
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize);

/* ------------------------------------------------------------------ export */

function toBase64(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function exportScenes() {
  CM.led.emissiveIntensity = 2.6; CM.rec.emissiveIntensity = 2.2;
  const S1 = buildSecurity();
  const sweep = sampleClip('boot_sweep', 3.0, [[S1.pan, ['quaternion']], [S1.tilt, ['quaternion']]], (t) => aim(S1, 60 * Math.sin(t / 3 * Math.PI * 2), -20 - 10 * Math.sin(t / 3 * Math.PI * 4)));
  aim(S1, 0, 0); S1.root.updateMatrixWorld(true);
  const S2 = buildSticky();
  const dep = sampleClip('deploy', 0.6, [[S2.lid, ['position', 'quaternion']], [S2.mast, ['position']], [S2.pan, ['scale']]], (t) => poseSticky(S2, t / 0.6));
  poseSticky(S2, 1); aim(S2, 0, 0); S2.root.updateMatrixWorld(true);
  return [{ file: 'security-camera.glb', root: S1.root, animations: [sweep] }, { file: 'sticky-camera.glb', root: S2.root, animations: [dep] }];
}
async function exportGLB() {
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  const exporter = new GLTFExporter(), out = [], was = looping; setLoop(false);
  try { for (const s of exportScenes()) { const buf = await exporter.parseAsync(s.root, { binary: true, animations: s.animations }); out.push({ file: s.file, bytes: buf.byteLength, base64: toBase64(buf) }); } }
  finally { if (was) setLoop(true); }
  return out;
}
function preview() {
  setLoop(false);
  document.querySelectorAll('.plate, .bar, .hint').forEach(e => { e.hidden = true; });
  sticky = { phase: 'ready', t: 0 }; autoSweep = false; state.security.pan = 25; apply(0);
  swayOn = false; camera.position.set(-0.12, 2.12, 0.62); controls.target.set(-0.62, 2.08, 0.12); controls.update();
  composer.render(); renderFeed();
}
window.__model = { id: 'cameras', exportScenes, exportGLB, preview };

/* ------------------------------------------------------------------ go */

goView('34', true); apply(0);
$('loading').hidden = true;
let autoStart = 1.2;
const clock = new THREE.Clock();
let looping = false;
function setLoop(on) { looping = on; renderer.setAnimationLoop(on ? loop : null); }
function tick(dt) {
  if (autoStart > 0) { autoStart -= dt; if (autoStart <= 0) { sticky = { phase: 'flying', t: 0 }; } }
  apply(dt);
  if (camTween) { camTween.t = Math.min(1, camTween.t + dt / 0.9); const e = ease(camTween.t); camera.position.lerpVectors(camTween.from, camTween.to, e); controls.target.lerpVectors(camTween.fromT, camTween.tt, e); if (camTween.t >= 1) camTween = null; }
  else if (swayOn) { swayT += dt; const v = viewFor('34'), base = v.pos.clone().sub(v.target); const r = Math.hypot(base.x, base.z), a = Math.atan2(base.x, base.z) + 0.3 * Math.sin(swayT * 0.2); camera.position.set(v.target.x + Math.sin(a) * r, v.target.y + base.y, v.target.z + Math.cos(a) * r); controls.target.copy(v.target); }
}
function loop() { const dt = Math.min(clock.getDelta(), 1 / 30); tick(dt); controls.update(); composer.render(dt); renderFeed(); }
setLoop(true);
window.__model.ready = true;
window.__model.debug = {
  tick, stop: () => setLoop(false), renderOnce: () => { controls.update(); composer.render(); renderFeed(); },
  set: (cam, pan, tilt, phase) => { setActive(cam); autoSweep = false; state[cam].pan = pan; state[cam].tilt = tilt; if (phase) sticky = { phase, t: 0 }; apply(0); },
  goView, camera, controls, scene, renderer, setSway: (v) => { swayOn = v; }, setSpin: (v) => { swayOn = v; }, pivot: { rotation: {} },
};
</script>
</body>
