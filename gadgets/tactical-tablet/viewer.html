<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tactical Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Chivo+Mono:wght@400;500&family=Archivo:wght@400;500;600&display=swap">
<style>
  /* Layout: full-bleed stage; field-manual plate top-left, two-row control strip along the bottom. */
  :root {
    --bg: #e6e6ec;
    --bg-deep: #c9cad3;
    --fg: #16171d;
    --muted: #5b5e6b;
    --panel: rgba(240, 240, 246, 0.8);
    --line: rgba(22, 23, 29, 0.16);
    --accent: #6a3fe0;
    --accent-fg: #f7f3ff;
    --alarm: #b3121c;
    --font-display: "Chakra Petch", "Arial Narrow", sans-serif;
    --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Chivo Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0c11; --bg-deep: #05060a; --fg: #e8e8f0; --muted: #8e92a6;
      --panel: rgba(13, 14, 20, 0.74); --line: rgba(232, 232, 240, 0.13);
      --accent: #8f63ff; --accent-fg: #0e0819; --alarm: #e0343c; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0c11; --bg-deep: #05060a; --fg: #e8e8f0; --muted: #8e92a6;
    --panel: rgba(13, 14, 20, 0.74); --line: rgba(232, 232, 240, 0.13);
    --accent: #8f63ff; --accent-fg: #0e0819; --alarm: #e0343c; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 38%, var(--bg) 0%, var(--bg) 35%, var(--bg-deep) 100%);
    background-color: var(--bg);
    color: var(--fg); font-family: var(--font-body); overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; outline: none; }
  .plate {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); left: max(16px, env(safe-area-inset-left, 0px));
    max-width: min(360px, calc(100vw - 32px)); display: grid; gap: 6px; pointer-events: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .plate h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5.2vw, 36px);
    line-height: 0.95; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .plate h1 span { color: var(--accent); }
  .specs {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 6px 0 0;
    font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .specs dt { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10.5px; padding-top: 1px; }
  .specs dd { margin: 0; }
  .state { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; font: 500 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
  .chip b { font-weight: 500; color: var(--accent); }
  .chip.alarm b { color: var(--alarm); }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: center; pointer-events: none;
  }
  .controls {
    pointer-events: auto; display: grid; gap: 6px; justify-items: center; max-width: 100%;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 14px; padding: 8px;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; max-width: 100%; }
  .group { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--line); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .group::-webkit-scrollbar { display: none; }
  .controls { grid-template-columns: minmax(0, 1fr); }
  .row { min-width: 0; }
  .row > .group { min-width: 0; flex: 0 1 auto; }
  .tag { font: 500 10px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 0 2px 0 4px; }
  button {
    font: 500 13px/1 var(--font-body); color: var(--fg); background: transparent; border: 0;
    padding: 8px 11px; border-radius: 7px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; flex: none;
  }
  button:hover { background: var(--line); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  button.toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.hold { touch-action: none; user-select: none; -webkit-user-select: none; }
  button.hold[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  #act-disable.hold[aria-pressed="true"] { background: var(--alarm); color: #fff; }
  .hint {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 20px);
    font: 11px var(--font-mono); letter-spacing: 0.06em; color: #9a9db0; text-align: right; pointer-events: none;
  }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    font: 12px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: #8e92a6;
  }
  @media (max-width: 640px) {
    .hint { display: none; }
    .plate .specs, .plate .state { display: none; }
    .plate { padding: 10px 12px; }
    .specs { font-size: 11px; }
    .specs .wide { display: none; }
    button { padding: 7px 8px; font-size: 12px; }
    .tag { display: none; }
    /* chip rows wrap instead of scrolling sideways, so every clip and state button stays in view */
    .group { flex-wrap: wrap; justify-content: center; overflow-x: visible; }
    button { padding: 6px 7px; font-size: 11.5px; }
  }
</style>
<style>
  body { margin: 0; }
  [hidden] { display: none !important; }

<body>
<div id="stage" aria-label="Interactive 3D model of a rugged 8-inch tactical tablet"></div>

<header class="plate">
  <div class="eyebrow">Operator gadget</div>
  <h1>Tactical <span>Tablet</span></h1>
  <dl class="specs">
    <dt>Size</dt><dd>136 × 222 × 16.4 mm, TPU corner bumpers, about 0.6 kg</dd>
    <dt>Screen</dt><dd>8.0" 16:10, 107.7 × 172.3 mm, 20-cell atlas</dd>
    <dt>Hold</dt><dd>Left hand under the back strap</dd>
  </dl>
  <div class="state" aria-live="polite"><span class="chip">Clip <b id="st-clip">idle</b></span><span class="chip">Screen <b id="st-cell">map</b></span></div>
</header>
<div class="hint">Drag to orbit · Scroll to zoom<br>Right-drag to pan · Tap the glass</div>
<div id="loading">Waking the tablet…</div>

<nav class="bar" aria-label="Controls">
  <div class="controls">
    <div class="row">
      <div class="group" role="group" aria-label="Clip" id="clips"></div>
    </div>
    <div class="row">
      <div class="group" role="group" aria-label="Screen state" id="states">
        <button type="button" data-state="" title="Follow the clip">Auto</button><button type="button" data-state="off">Off</button><button type="button" data-state="boot">Boot</button><button type="button" data-state="lock">Lock</button><button type="button" data-state="home">Home</button><button type="button" data-state="map">Map</button><button type="button" data-state="drone">Drone</button><button type="button" data-state="scan">Scan</button><button type="button" data-state="lock_on">Lock-on</button><button type="button" data-state="ptt">Radio</button><button type="button" data-state="call">Call</button><button type="button" data-state="alert">Alert</button><button type="button" data-state="low_battery">Low battery</button><button type="button" data-state="shutdown">Shutdown</button>
      </div>
    </div>
    <div class="row">
      <div class="group" role="group" aria-label="Idle app" id="apps" title="The app idle shows">
        <button type="button" data-app="map">Map</button><button type="button" data-app="drone">Drone</button><button type="button" data-app="scan">Scan</button><button type="button" data-app="home">Home</button><button type="button" data-app="ptt">Radio</button>
      </div>
      <div class="group" role="group" aria-label="Lighting" id="lights">
        <button type="button" data-light="studio">Studio</button><button type="button" data-light="daylight">Daylight</button><button type="button" data-light="night">Night</button>
      </div>
      <div class="group" role="group" aria-label="View">
        <button type="button" data-view="ref" title="Held, like the reference photo">Held</button>
        <button type="button" data-view="34">¾</button>
        <button type="button" data-view="front">Front</button>
        <button type="button" data-view="side">Side</button>
        <button type="button" data-view="back">Back</button>
      </div>
      <button type="button" class="toggle" id="spin" aria-pressed="false" title="Orbit the camera slowly">Orbit</button>
      <button type="button" class="toggle" id="sound" aria-pressed="true" title="Sounds">Sound</button>
    </div>
  </div>
</nav>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.7/src/index.js",
    "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/build/index.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices, toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';

// Metres, +Y up the phone, the screen faces -Z (toward the holder), the holder's left +X (DESIGN.md 1).

/* ------------------------------------------------------------------ helpers */

// Monotone cubic interpolation through [x, y] points (no overshoot).
function curve(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const constant = v => () => v;

// Loft a superellipse cross-section along X. top/bot/hw/n are functions of x.
// round: radius used to roll the edges at both ends; caps are flat.
function loft({ x0, x1, top, bot, hw, n = constant(2.6), cy = null, steps = 160, seg = 72, round = 0, roundStart = round, roundEnd = round, groove = null }) {
  const xs = [];
  // denser stations near the ends so the rolled edges stay smooth
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const e = 0.5 - 0.5 * Math.cos(Math.PI * u);
    xs.push(x0 + (x1 - x0) * (0.55 * u + 0.45 * e));
  }
  const pos = [], idx = [];
  const ring = (x) => {
    let T = top(x), B = bot(x), W = hw(x);
    const ds = x - x0, de = x1 - x;
    let inset = 0;
    if (roundStart > 0 && ds < roundStart) inset = Math.max(inset, roundStart - Math.sqrt(Math.max(0, roundStart * roundStart - (roundStart - ds) ** 2)));
    if (roundEnd > 0 && de < roundEnd) inset = Math.max(inset, roundEnd - Math.sqrt(Math.max(0, roundEnd * roundEnd - (roundEnd - de) ** 2)));
    let gB = 0, gW = 0;
    if (groove) { const g = groove(x); gB = g; gW = g; }
    T -= inset; B += inset + gB; W -= inset + gW;
    // a rounding radius larger than the section must not turn the ring inside out
    W = Math.max(0.002, W);
    const c = cy ? cy(x) : (T + B) / 2, ry = Math.max(0.001, (T - B) / 2);
    const e = 2 / n(x), out = [];
    for (let j = 0; j < seg; j++) {
      const t = (j / seg) * Math.PI * 2, co = Math.cos(t), si = Math.sin(t);
      const z = W * Math.sign(co) * Math.pow(Math.abs(co), e);
      const y = c + ry * Math.sign(si) * Math.pow(Math.abs(si), e);
      out.push([x, y, z]);
    }
    return out;
  };
  const rings = xs.map(ring);
  rings.forEach(r => r.forEach(p => pos.push(...p)));
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * seg + j, b = i * seg + (j + 1) % seg, c = (i + 1) * seg + j, d = (i + 1) * seg + (j + 1) % seg;
      idx.push(a, c, b, b, c, d);
    }
  }
  // flat caps with their own vertices
  const capAt = (r, flip) => {
    const base = pos.length / 3;
    const cx = r.reduce((s, p) => s + p[1], 0) / r.length;
    pos.push(r[0][0], cx, 0);
    r.forEach(p => pos.push(...p));
    for (let j = 0; j < seg; j++) {
      const a = base + 1 + j, b = base + 1 + (j + 1) % seg;
      flip ? idx.push(base, a, b) : idx.push(base, b, a);
    }
  };
  // caps face outward: -x at the start, +x at the end
  capAt(rings[0], true);
  capAt(rings[rings.length - 1], false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Polygon with per-corner radius: pts = [[x, y, r], ...]
function roundedShape(pts, shape = new THREE.Shape()) {
  const n = pts.length;
  const P = pts.map(p => new THREE.Vector2(p[0], p[1]));
  for (let i = 0; i < n; i++) {
    const prev = P[(i - 1 + n) % n], cur = P[i], next = P[(i + 1) % n], r = pts[i][2] || 0;
    const v1 = prev.clone().sub(cur), v2 = next.clone().sub(cur);
    const l1 = v1.length(), l2 = v2.length();
    const rr = Math.min(r, l1 / 2.05, l2 / 2.05);
    const a = cur.clone().add(v1.normalize().multiplyScalar(rr));
    const b = cur.clone().add(v2.normalize().multiplyScalar(rr));
    if (i === 0) shape.moveTo(a.x, a.y); else shape.lineTo(a.x, a.y);
    if (rr > 0) shape.quadraticCurveTo(cur.x, cur.y, b.x, b.y);
  }
  shape.closePath();
  return shape;
}
function roundedPath(pts) { return roundedShape(pts, new THREE.Path()); }

// Extrude a side-profile shape (in the XY plane) across Z, centred on zc.
function slab(shape, width, { bevel = 0.04, segs = 3, zc = 0, curveSegments = 24 } = {}) {
  const depth = Math.max(0.001, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.9, bevelSegments: segs, curveSegments,
  });
  g.translate(0, 0, zc - depth / 2);
  return g;
}

// Lathe around the X axis. pts = [[x, r], ...]
function latheX(pts, seg = 64) {
  const g = new THREE.LatheGeometry(pts.map(([x, r]) => new THREE.Vector2(r, x)), seg);
  g.rotateZ(-Math.PI / 2);
  g.scale(1, 1, 1);
  // after rotateZ(-90deg) the lathe axis (y) maps to +x
  return g;
}

function clean(g) {
  g = g.index ? g.toNonIndexed() : g;
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  return g;
}
function creased(g, angle = 34) { return toCreasedNormals(clean(g), THREE.MathUtils.degToRad(angle)); }

const evaluator = new Evaluator();
evaluator.attributes = ['position', 'normal'];
evaluator.useGroups = false;
// Cutters passed together must not overlap each other (they are merged into one brush).
function subtract(base, ...cutters) {
  let a = new Brush(clean(base)); a.updateMatrixWorld();
  const cut = new Brush(mergeGeometries(cutters.map(clean))); cut.updateMatrixWorld();
  const r = evaluator.evaluate(a, cut, SUBTRACTION);
  return r.geometry;
}
// For cutters that overlap, subtract them one after another.
function subtractEach(base, ...cutters) {
  let g = base;
  for (const c of cutters) g = subtract(g, c);
  return g;
}
function box(x0, x1, y0, y1, z0, z1) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return g;
}



// Screw head with its drive recess ("inlet"). Built along +y with the underside at y = 0.
// style: 'slot' (flat blade), 'phillips' (cross), 'hex' (socket). countersunk heads sit nearly flush.
function screwHead(r, { style = 'slot', h, countersunk = false, seg = 36 } = {}) {
  if (h === undefined) h = countersunk ? r * 0.5 : r * 0.6;
  const prof = countersunk
    ? [[0, 0], [r * 0.5, 0], [r, h - 0.006], [r, h], [0, h]]
    : [[0, 0], [r, 0], [r, h * 0.45], [r * 0.86, h * 0.82], [r * 0.55, h * 0.97], [0, h]];
  let g = new THREE.LatheGeometry(prof.map(([x, y]) => new THREE.Vector2(x, y)), seg);
  // the recess a driver goes into: deep enough to grip, open across the head for a blade
  const d = Math.min(h * 0.85, r * 0.62);
  if (style === 'slot') g = subtract(g, box(-r * 1.3, r * 1.3, h - d, h + 0.2, -r * 0.17, r * 0.17));
  else if (style === 'phillips') {
    g = subtractEach(g, box(-r * 0.68, r * 0.68, h - d, h + 0.2, -r * 0.13, r * 0.13), box(-r * 0.13, r * 0.13, h - d, h + 0.2, -r * 0.68, r * 0.68));
  } else if (style === 'hex') {
    g = subtract(g, new THREE.CylinderGeometry(r * 0.5, r * 0.5, d * 2, 6).translate(0, h, 0));
  }
  return creased(g, 35);
}
// Put a screw head at pos with its axis along normal; spin turns the recess about that axis.
function placeScrew(geo, pos, normal, spin = 0) {
  geo.applyMatrix4(new THREE.Matrix4().makeRotationY(spin));
  geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal.clone().normalize()));
  geo.translate(pos.x, pos.y, pos.z);
  return geo;
}


const NOISE = /* glsl */`
varying vec3 vObjPos;
uniform float uGrain, uColorVar, uRoughVar, uWood;
uniform vec3 uWoodDark;
float h3(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x), mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x), f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x), mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x), f.y), f.z);
}
float fbm3(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + 1.7; a *= 0.5; } return s; }
// fw = pixel footprint in noise cells at the first octave; octaves near or below a pixel fade to their mean
float fbmAA(vec3 p, float fw){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*mix(vnoise(p), 0.5, smoothstep(0.3, 1.0, fw)); p = p*2.03 + 1.7; a *= 0.5; fw *= 2.03; } return s; }
`;

// Physical material with object-space grain (colour mottling + roughness breakup); wood adds
// laminate figure running along the stock.
function surface(params, noise = {}) {
  const m = new THREE.MeshPhysicalMaterial(params);
  const u = {

function boxOf(obj) { obj.updateWorldMatrix(true, true); return new THREE.Box3().setFromObject(obj); }
// a camera position framing a world box from direction dir (fov from the camera); returns { pos, target }
function frameBox(box, dir = V3(-0.5, 0.3, -1), pad = 1.25, cam = null) {
  const c = box.getCenter(V3(0, 0, 0)), r = Math.max(0.02, box.getSize(V3(0, 0, 0)).length() / 2) * pad;
  const fov = deg(cam ? cam.fov : 34), asp = cam ? Math.min(1, cam.aspect) : 1, d = r / Math.sin(Math.min(fov, fov * asp) / 2);
  return { pos: c.clone().add(dir.clone().normalize().multiplyScalar(d)), target: c };
}
// debug.set(opts) holds an exact state for a render (DESIGN.md 10). ctx (from parts/scene.js):
//   model, hold(clip, t), setCell(c), setLed(s), setHand(on), setPose(name), refresh(), clipOf(), camera, controls
function makeDebugSet(ctx) {
  return function set(o = {}) {
    const m = ctx.model;
    if (o.pose !== undefined) ctx.setPose(o.pose);
    if (o.hand !== undefined) ctx.setHand(o.hand);
    if (o.clip !== undefined) { ctx.hold(o.clip, o.t || 0); if (o.cell === undefined) ctx.setCell(null); if (o.led === undefined) ctx.setLed(null); }
    if (o.cell !== undefined) ctx.setCell(o.cell);
    if (o.led !== undefined) ctx.setLed(o.led);
    ctx.refresh();

      const target = o.focus === 'phone' ? m.root : m.nodes[o.focus] || null;

    }
    return ctx.clipOf();
  };
}

function thermal(x, w, h, rnd, phase, locked = false) {

    if (v > 0.6) t = 0.13 + 0.06 * (v - 0.6) + 0.02 * Math.sin(u * 20);                       // concrete floor, cold
    if (Math.abs(v - 0.6) < 0.004) t = 0.17;                                                   // skirting
    if (u > 0.06 && u < 0.3 && v > 0.08 && v < 0.5) t = 0.27 + 0.03 * v;                       // window, warmer glass reflection
    if ((Math.abs(u - 0.06) < 0.006 || Math.abs(u - 0.3) < 0.006 || Math.abs(u - 0.18) < 0.004) && v > 0.08 && v < 0.5) t = 0.34; // frame

    t = Math.max(t, hp);

    if (u > 0.47 && u < 0.86 && Math.abs(v - 0.47) < 0.003) t = 0.29;

// TPU overmould: fine mould stipple (VDI-30 like), a slow blotch, roughness 0.6-0.72 for the slight sheen of new TPU
function tpuMaps(N, seed, { tone = 0.115, rough = [0.6, 0.72], scuff = false } = {}) {
  const R = prng(seed), n2 = N * N, g = stretch(fbmT(N, 32, 3, R)), blot = stretch(fbmT(N, 2, 3, R)), st = stretch(fbmT(N, 110, 1, R)), H = new Float32Array(n2);

  if (scuff) for (let j = 0; j < 160; j++) addScratch(scr, N, R() * N, R() * N, (R() - 0.5) * 0.9, 6 + R() * 40, (R() - 0.5) * 0.01, 0.4 + R() * 0.6);
  for (let i = 0; i < n2; i++) H[i] = g[i] * 0.15 + st[i] * 0.3 - scr[i] * 0.3;
  for (let j = 0; j < 700; j++) addDimple(H, N, R() * N, R() * N, 0.8 + R(), 0.2);
  const map = rgbaCanvas(N, N, (i, o) => { const t = (0.88 + 0.2 * blot[i] + 0.08 * g[i]) * tone + 0.05 * scr[i]; o[0] = t; o[1] = t * 1.0; o[2] = t * 1.03; });
  const orm = rgbaCanvas(N, N, (i, o) => { o[0] = 1; o[1] = clampR(lerp(rough[0], rough[1], 0.5 + 0.5 * (g[i] - 0.5) + 0.3 * (blot[i] - 0.5)) + 0.15 * scr[i], 0, 1); o[2] = 0; });

// nylon webbing: a 2/2 twill (diagonal ribs) with a little fuzz
function webbingMaps(N, seed) {
  const R = prng(seed), fz = stretch(fbmT(N, 64, 2, R)), H = new Float32Array(N * N), p = N / 32;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const f = wrap01((x + y * 0.5) / p), w = wrap01(y / (p * 0.5)); H[y * N + x] = Math.pow(Math.sin(Math.PI * f), 0.7) * (0.75 + 0.25 * Math.sin(Math.PI * w)) + 0.1 * fz[y * N + x]; }
  const map = rgbaCanvas(N, N, (i, o) => { const t = 0.085 * (0.8 + 0.3 * H[i]); o[0] = t; o[1] = t; o[2] = t * 1.04; });
  const orm = rgbaCanvas(N, N, (i, o) => { o[0] = 1; o[1] = 0.86 + 0.08 * fz[i]; o[2] = 0; });
  return { map, normal: normalFrom(H, N, 3), orm };
}

const TORX_CACHE = new Map();
function torxScrew(r, pos, normal, spin = 0) {
  const key = r.toFixed(6);
  if (!TORX_CACHE.has(key)) {
    const h = r * 0.5, prof = [[0, 0], [r, 0], [r, h * 0.55], [r * 0.9, h * 0.92], [r * 0.7, h], [0, h]];
    let g = new THREE.LatheGeometry(prof.map(([x, y]) => new THREE.Vector2(x, y)), 20);
    const st = new THREE.Shape(), ro = r * 0.42, ri = r * 0.3, n = 36;
    for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI * 2, rr = ri + (ro - ri) * Math.pow(0.5 + 0.5 * Math.cos(6 * a), 0.7); const px = Math.cos(a) * rr, py = Math.sin(a) * rr; i ? st.lineTo(px, py) : st.moveTo(px, py); }
    const cut = new THREE.ExtrudeGeometry(st, { depth: h * 2, bevelEnabled: false }).rotateX(-Math.PI / 2).translate(0, h * 0.35, 0);
    g = subtract(g, cut);
    TORX_CACHE.set(key, creased(g, 35));
  }
  return placeScrew(TORX_CACHE.get(key).clone(), pos, normal, spin);
}

  const rr = (hx, hy, r) => rect(mm(-hx), mm(hx), mm(-hy), mm(hy), mm(r));

  /* mid-frame: aluminium band, the structural part; keys, ports and the SIM tray are machined into it */
  add(body, slabZ(rr(F.x, F.y, F.r), mm(F.z0), mm(F.z1), mm(0.6), 2, 12), M.alloy, 'body_frame', { wear: false });
  /* part lines: the dark seams where the front lip meets the frame (z -4.6) and the frame meets the back cover's gasket (z +2.6) */
  {
    const seam = (hx, hy, r, z0, z1, inset) => slabZ(ringShape(rr(hx, hy, r), [roundedPath([[-hx + inset, -hy + inset, r], [hx - inset, -hy + inset, r], [hx - inset, hy - inset, r], [-hx + inset, hy - inset, r]].map(([x, y, q]) => [mm(x), mm(y), mm(q)]))]), mm(z0), mm(z1), 0, 1, 12);
    add(body, mergeUV([seam(66.45, 109.45, 11.4, -4.95, -4.5, 1.2), seam(65.75, 108.75, 10.7, 2.35, 2.75, 1.2)]), M.crevice, 'body_part_lines', { cast: false, crease: 80 });
  }
  /* back cover: PC-GF10, screwed to the frame over a gasket; part line at z = +2.6 mm */
  add(body, slabZ(rr(B.x, B.y, B.r), mm(B.z0), mm(B.z1), mm(1.8), 3, 12), M.backCover, 'body_back');
  /* front lip: TPU ring round the glass (glass sits 1.2 mm below its top so the glass never lands first face-down) */
  {
    const outer = rr(L.x, L.y, L.r), hole = roundedPath([[-G.x - 0.3, -G.y - 0.3, G.r + 0.3], [G.x + 0.3, -G.y - 0.3, G.r + 0.3], [G.x + 0.3, G.y + 0.3, G.r + 0.3], [-G.x - 0.3, G.y + 0.3, G.r + 0.3]].map(([x, y, r]) => [mm(x), mm(y), mm(r)]));
    add(body, slabZ(ringShape(outer, [hole]), mm(L.z0), mm(L.z1), mm(0.9), 2, 12), M.tpu, 'body_front_lip', { wear: { k: 260, chip: 0.6, freq: 60, kIn: 400 } });
  }
  /* corner bumpers: four separate TPU-over-PC mouldings, each held by two Torx T6 screws from the back */
  {
    const parts = [], screws = [];
    for (const [sx, sy] of [[1, 1], [-1, 1], [-1, -1], [1, -1]]) {
      const pts = [[Bm.x - Bm.arm, Bm.y, 2], [Bm.x, Bm.y, Bm.r], [Bm.x, Bm.y - Bm.arm, 2], [Bm.x - Bm.t, Bm.y - Bm.arm, 1.5], [Bm.x - Bm.t, Bm.y - Bm.t, 5], [Bm.x - Bm.arm, Bm.y - Bm.t, 1.5]]
        .map(([x, y, r]) => [mm(sx * x), mm(sy * y), mm(r)]);
      let g = slabZ(roundedShape(pts), mm(-Bm.z), mm(Bm.z), mm(2.2), 3, 12);
      if (sx > 0 && sy < 0) g = subtract(g, cylZ(mm(1.5), mm(-20), mm(20), 20).translate(mm(63.6), mm(-106.6), 0));      // lanyard hole (holder's left, bottom)
      parts.push(g);
      for (const [x, y] of [[Bm.x - Bm.t / 2 - 0.1, Bm.y - 21], [Bm.x - 21, Bm.y - Bm.t / 2 - 0.1]]) screws.push(torxScrew(mm(1.3), V3(mm(sx * x), mm(sy * y), mm(Bm.z - 0.25)), V3(0, 0, 1), sx * sy + x * 0.1));
    }
    add(body, mergeUV(parts), M.tpu, 'body_bumpers', { wear: { k: 140, chip: 0.42, freq: 60, kIn: 300 } });
    add(body, mergeUV(screws), M.torx, 'body_bumper_screws', { cast: false });
    // TODO(detail): Torx-6 recess instead of hex, 0.3 mm counterbore, mould parting line round the bumper waist, scuffs
  }

  /* front: cover glass, black ink mask (ring round the active area), sensors and speaker slots in the mask */
  const zG = mm(G.z0);
  {
    // the two speaker slots are cut through the glass (24 x 2.4 mm, full radius ends)
    const slotCut = (y) => slabZ(rect(mm(-12), mm(12), mm(y - 1.2), mm(y + 1.2), mm(1.19)), mm(G.z0 - 1), mm(G.z1 + 1), 0, 1, 8);
    const glass = subtract(slabZ(rr(G.x, G.y, G.r), mm(G.z0), mm(G.z1), mm(0.3), 1, 12), slotCut(96.4), slotCut(-95.8));
    add(body, glass, M.screenGlass, 'screen_glass', { cast: false });
    const aw = A.w / 2, y0 = A.y - A.h / 2, y1 = A.y + A.h / 2;
    const win = roundedPath([[-aw, y0, 2], [aw, y0, 2], [aw, y1, 2], [-aw, y1, 2]].map(([x, y, r]) => [mm(x), mm(y), mm(r)]));
    add(body, slabZ(ringShape(rr(G.x - 0.1, G.y - 0.1, G.r), [win]), mm(G.z1), mm(G.z1 + 0.1), 0, 1, 12), M.mask, 'body_glass_mask', { cast: false });
    // top bezel: front camera (right of centre), speaker slot (centre), ALS / proximity window and the status LED (left)
    add(body, cylZ(mm(1.8), zG - mm(0.02), zG + mm(0.05), 24).translate(mm(24), mm(94.5), 0), M.mask, 'body_cam_front_ring', { cast: false });
    add(body, cylZ(mm(1.05), zG - mm(0.04), zG + mm(0.05), 20).translate(mm(24), mm(94.5), 0), M.lens, 'body_cam_front', { cast: false });
    // speaker slots cut through the glass: a perforated steel grille 0.4 mm down, a black acoustic mesh behind it
    const slot = (y) => [rbox(mm(-12), mm(12), mm(y - 1.2), mm(y + 1.2), zG + mm(0.35), zG + mm(0.4), mm(0.02), 1)];
    const back = (y) => rbox(mm(-12.2), mm(12.2), mm(y - 1.4), mm(y + 1.4), zG + mm(0.5), zG + mm(0.6), mm(0.02), 1);
    add(body, mergeUV([...slot(96.4), ...slot(-95.8)]), M.grille, 'body_speaker_grilles', { cast: false });
    add(body, mergeUV([back(96.4), back(-95.8)]), M.crevice, 'body_speaker_mesh', { cast: false });
    add(body, rbox(mm(-25), mm(-20.5), mm(93.8), mm(95.4), zG - mm(0.03), zG + mm(0.05), mm(0.02), 1), M.deco, 'body_als_window', { cast: false });
    // TODO(detail): speaker holes 0.8 mm at 1.4 mm pitch, oleophobic smudges, scratches
  }
  const ledStatus = reg(node('led_status', root, [mm(-30), mm(94.6), zG - mm(0.04)]));
  add(ledStatus, cylZ(mm(0.6), mm(-0.03), mm(0.03), 12), M.led, 'led_status_dot', { cast: false });

  /* screen: the atlas plane under the glass (UVs cover atlas cell 0: u 0..1/5, v 0..1/4, v = 0 at the top) */
  const screen = reg(node('screen', root, [0, mm(A.y), mm(G.z1 + 0.05)]));
  {
    const g = new THREE.PlaneGeometry(mm(A.w), mm(A.h), 1, 1); g.rotateY(Math.PI);
    const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / SCREEN_GRID[0], (1 - uv.getY(i)) / SCREEN_GRID[1]);
    add(screen, g, K.SCREEN.material, 'screen_display', { uv: 'keep', cast: false });
  }

  /* keys: rubber caps over tact switches, 0.3 mm gap to the frame cut-out, 0.9-1.4 mm proud of the frame, below the bumpers */
  const zk0 = -3.0, zk1 = 1.0;
  const key = (name, axis, at, a0, a1, out, mat = M.keys) => {
    const n = reg(node(name, root, axis === 'x' ? [mm(at), mm((a0 + a1) / 2), mm((zk0 + zk1) / 2)] : [mm((a0 + a1) / 2), mm(at), mm((zk0 + zk1) / 2)]));
    const h = (a1 - a0) / 2, dz = (zk1 - zk0) / 2, s = Math.sign(out);
    const g = axis === 'x' ? rbox(mm(Math.min(-s * 0.8, out)), mm(Math.max(-s * 0.8, out)), mm(-h), mm(h), mm(-dz), mm(dz), mm(0.9), 2)
      : rbox(mm(-h), mm(h), mm(Math.min(-s * 0.8, out)), mm(Math.max(-s * 0.8, out)), mm(-dz), mm(dz), mm(0.9), 2);
    add(n, g, mat, name + '_cap');
    // the 0.3 mm gap round the cap: a dark pocket in the frame, just proud of the frame face, hidden under the cap
    const gp = 0.35, d0 = -s * 0.15, d1 = s * 0.05;
    add(body, axis === 'x' ? rbox(mm(at + Math.min(d0, d1)), mm(at + Math.max(d0, d1)), mm(a0 - gp), mm(a1 + gp), mm(zk0 - gp), mm(zk1 + gp), mm(0.04), 1)
      : rbox(mm(a0 - gp), mm(a1 + gp), mm(at + Math.min(d0, d1)), mm(at + Math.max(d0, d1)), mm(zk0 - gp), mm(zk1 + gp), mm(0.04), 1), M.crevice, name + '_gap', { cast: false });
    return n;
  };
  key('btn_power', 'x', -F.x, 56, 70, -1.0);                  // holder's right (-X), top
  key('btn_vol_up', 'x', -F.x, 40, 52, -0.9);
  key('btn_vol_down', 'x', -F.x, 26, 38, -0.9);
  const ptt = key('btn_ptt', 'x', F.x, 8, 44, 1.4, M.ptt);                // holder's left (+X): push-to-talk, under the thumb
  // three 0.4 mm ribs across the PTT face, so a gloved thumb finds it without looking
  add(ptt, mergeUV([-9, 0, 9].map((y) => rbox(mm(1.2), mm(1.8), mm(y - 0.7), mm(y + 0.7), mm(-1.5), mm(1.5), mm(0.3), 1))), M.ptt, 'btn_ptt_ribs');
  // the power key carries one raised dot (tells it from volume by touch)
  add(N.btn_power, new THREE.SphereGeometry(mm(0.9), 12, 6, 0, Math.PI * 2, 0, Math.PI / 2).rotateZ(Math.PI / 2).scale(0.5, 1, 1).translate(mm(-0.95), 0, 0), M.keys, 'btn_power_dot');
  key('btn_action', 'y', F.y, -32, -18, 0.9);                 // top edge: programmable key (the game's scan key)
  // TODO(detail): PTT ribs (3 x 0.4 mm), power key texture dot, 0.3 mm cut-out gaps as crevice rings

  /* SIM / microSD tray on the -X side with its eject pin hole; mics on the top and bottom edges */
  add(body, rbox(mm(-F.x - 0.15), mm(-F.x + 0.6), mm(-52), mm(-26), mm(-2.8), mm(0.8), mm(0.5), 1), M.alloy, 'body_sim_tray', { wear: false });
  add(body, mergeUV([cylX(mm(0.5), mm(-F.x - 0.2), mm(-F.x + 0.3), 12).translate(0, mm(-22), mm(-1)),
    cylY(mm(0.5), mm(F.y - 0.3), mm(F.y + 0.2), 12).translate(mm(14), 0, mm(-1)), cylY(mm(0.5), mm(-F.y - 0.2), mm(-F.y + 0.3), 12).translate(mm(-22), 0, mm(-1))]), M.crevice, 'body_holes', { cast: false });

  /* USB-C flap: tethered TPU plug on the bottom edge, hinge at its back edge, pull tab at +X */
  const flap = reg(node('flap_usb', root, [0, mm(-F.y), mm(1.6)]));
  // cover: 18 x 5.2 mm TPU lid, a seal plug that sits in the port mouth, a pull tab with three grip ridges at +X
  add(flap, mergeUV([rbox(mm(-9), mm(9), mm(-0.5), mm(0.4), mm(-5.2), 0, mm(0.4), 1), rbox(mm(9), mm(13.5), mm(-0.9), mm(0.2), mm(-4.4), mm(-0.8), mm(0.5), 1)]), M.tpu, 'flap_usb_cover', { wear: false });
  add(flap, rbox(mm(-4.6), mm(4.6), mm(0.3), mm(2.6), mm(-4.2), mm(-1.0), mm(0.6), 1), M.tpu, 'flap_usb_plug', { wear: false });
  add(flap, mergeUV([10.4, 11.6, 12.8].map((x) => rbox(mm(x - 0.25), mm(x + 0.25), mm(-1.15), mm(-0.8), mm(-4.0), mm(-1.2), mm(0.1), 1))), M.tpu, 'flap_usb_ridges', { wear: false });
  // the USB-C mouth in the frame behind the flap: a 9.2 x 3.4 mm stadium opening with the receptacle tongue inside
  add(body, rbox(mm(-4.7), mm(4.7), mm(-F.y - 0.06), mm(-F.y + 0.02), mm(-2.7), mm(0.7), mm(1.65), 1), M.crevice, 'body_usb_mouth', { cast: false });
  add(body, rbox(mm(-3.3), mm(3.3), mm(-F.y - 0.09), mm(-F.y - 0.07), mm(-1.35), mm(-0.65), mm(0.005), 1), M.pogo, 'body_usb_tongue', { cast: false });
  // TODO(detail): the USB-C mouth and seal land behind the flap (seen only when open)

  /* back: camera island, grip pads, strap bridges, pogo connector, back-cover screws */
  const zB = mm(B.z1);
  {
    add(body, rbox(mm(-25), mm(25), mm(84), mm(102), zB - mm(0.6), zB + mm(0.7), mm(1.2), 2), M.alloy, 'body_cam_trim', { wear: false });
    add(body, rbox(mm(-23.6), mm(23.6), mm(85.4), mm(100.6), zB + mm(0.4), zB + mm(0.95), mm(0.4), 1), M.deco, 'body_cam_deco');
    add(body, rbox(mm(-18), mm(-10), mm(89), mm(97), zB + mm(0.9), zB + mm(1.0), mm(0.05), 1), M.thermal, 'body_thermal_window', { cast: false });
    add(body, cylZ(mm(3.6), zB + mm(0.9), zB + mm(1.0), 28).translate(0, mm(93), 0), M.lens, 'body_cam_lens', { cast: false });
    add(body, new THREE.TorusGeometry(mm(4.1), mm(0.35), 8, 28).translate(0, mm(93), zB + mm(0.98)), M.alloy, 'body_cam_ring', { wear: false });
    // lens stack seen through the cover glass: a black baffle ring, the front element's bright coating ring and the iris
    add(body, mergeUV([new THREE.RingGeometry(mm(2.3), mm(3.5), 28).translate(0, mm(93), zB + mm(1.005)), new THREE.RingGeometry(mm(0.5), mm(0.9), 20).translate(0, mm(93), zB + mm(1.006))]), M.mask, 'body_cam_baffle', { cast: false, uv: 'box' });
    add(body, new THREE.RingGeometry(mm(1.6), mm(2.3), 28).translate(0, mm(93), zB + mm(1.005)), M.thermal, 'body_cam_coating', { cast: false, uv: 'box' });
    // thermal window bezel and the flash's chamfered surround
    add(body, slabZ(ringShape(rect(mm(-18.8), mm(-9.2), mm(88.2), mm(97.8), mm(1.2)), [roundedPath([[-18, 89, 0.6], [-10, 89, 0.6], [-10, 97, 0.6], [-18, 97, 0.6]].map(([a, b, c]) => [mm(a), mm(b), mm(c)]))]), zB + mm(0.9), zB + mm(1.15), mm(0.1), 1, 6), M.alloy, 'body_thermal_bezel', { wear: false });
    add(body, rbox(mm(11), mm(17), mm(91.2), mm(94.8), zB + mm(0.9), zB + mm(1.0), mm(0.05), 1), M.flash, 'body_flash', { cast: false });
  }
  add(body, mergeUV([-1, 1].map((s) => rbox(mm(s > 0 ? 38 : -58), mm(s > 0 ? 58 : -38), mm(-72), mm(70), zB - mm(0.4), zB + mm(0.6), mm(0.8), 2))), M.gripPad, 'body_grip_pads');
  {
    const bridges = [-1, 1].map((s) => subtract(rbox(mm(s * 60 - 4), mm(s * 60 + 4), mm(-40), mm(-4), zB - mm(0.4), zB + mm(3.2), mm(1.4), 2),
      new THREE.BoxGeometry(mm(20), mm(28), mm(1.6)).translate(mm(s * 60), mm(-22), zB + mm(1.1))));
    add(body, mergeUV(bridges), M.tpu, 'body_strap_bridges');
  }
  add(body, rbox(mm(-10), mm(10), mm(-103), mm(-97), zB - mm(0.3), zB + mm(0.05), mm(0.5), 1), M.backCover, 'body_pogo_well');
  add(body, mergeUV([-6, -2, 2, 6].map((x) => cylZ(mm(1.0), zB - mm(0.1), zB + mm(0.02), 16).translate(mm(x), mm(-100), 0))), M.pogo, 'body_pogo_pads', { cast: false });
  add(body, mergeUV([[-50, 78], [50, 78], [-50, -86], [50, -86], [-24, -101], [24, -101]].map(([x, y]) => torxScrew(mm(1.2), V3(mm(x), mm(y), zB - mm(0.2)), V3(0, 0, 1), x * 0.3 + y))), M.torx, 'body_back_screws', { cast: false });
  // TODO(detail): grip texture (fine diamond knurl) on the pads, gasket part line, regulatory recess left blank (no text)

  /* hand strap: elastic webbing between the two bridges, resting about 5 mm off the back */
  const strap = reg(node('hand_strap', root, [0, mm(-22), 0]));
  {
    const s = new THREE.Shape(), n = 24, P = [];
    for (let i = 0; i <= n; i++) { const t = i / n, x = -62 + 124 * t, z = B.z1 + 1.1 + 5 * Math.pow(Math.sin(Math.PI * t), 0.6) * (Math.abs(x) < 56 ? 1 : 0.2); P.push([x, z]); }
    P.forEach(([x, z], i) => (i ? s.lineTo(mm(x), mm(-z)) : s.moveTo(mm(x), mm(-z))));
    for (let i = n; i >= 0; i--) s.lineTo(mm(P[i][0]), mm(-(P[i][1] + 1.6)));
    s.closePath();
    add(strap, slabY(s, mm(-13), mm(13), 0, 1, 2), M.webbing, 'hand_strap_band');
  }

  /* locators (no mesh) */
  const LOC = {
    grip_left_hand: [mm(10), mm(-22), mm(B.z1 + 7)],
    fx_touch: [mm(22), mm(-30), zG - mm(0.4)],
    fx_scan: [mm(-14), mm(93), zB + mm(1.1)],
    cam_rear: [0, mm(93), zB + mm(1.1)],
    cam_thermal: [mm(-14), mm(93), zB + mm(1.1)],
    cam_front: [mm(24), mm(94.5), zG - mm(0.1)],
    fx_flash: [mm(14), mm(93), zB + mm(1.1)],
    fx_ptt: [mm(F.x + 1.5), mm(26), mm(-1)],
  };
  for (const [n, p] of Object.entries(LOC)) reg(node(n, root, p));

  /* ------------------------------------------------------------------ clips (DESIGN.md 8) */
  const ART = ['btn_power', 'btn_vol_up', 'btn_vol_down', 'btn_ptt', 'btn_action', 'flap_usb', 'led_status'];
  const REST = {}; for (const n of ART) REST[n] = { p: N[n].position.clone(), r: N[n].rotation.clone() };
  const KEYS = [['btn_power', ['position']], ['btn_vol_up', ['position']], ['btn_vol_down', ['position']], ['btn_ptt', ['position']], ['btn_action', ['position']],
    ['flap_usb', ['quaternion']], ['led_status', ['scale']]];
  const STEP = ['led_status'];
  // key travel (m) along the key's axis, into the frame
  const PRESS = { btn_power: ['x', 0.0006], btn_vol_up: ['x', 0.0005], btn_vol_down: ['x', 0.0005], btn_ptt: ['x', -0.0008], btn_action: ['y', -0.0005] };
  const press = (t, a, b, k = 0.04) => (t < a || t > b + k) ? 0 : Math.min(seg(t, a, a + k), 1 - seg(t, b, b + k));
  const on = (t, list) => list.some(([a, b]) => t >= a && t < b);
  function rest() { for (const n of ART) { N[n].position.copy(REST[n].p); N[n].rotation.copy(REST[n].r); N[n].scale.setScalar(1); } }
  const CLIPS = {
    idle: { len: 2.0, loop: true, note: 'status LED double-blinks at 1.55 s', f: (t) => ({ led: !on(t, [[1.55, 1.65], [1.75, 1.85]]) }) },
    wake: { len: 0.6, note: 'power key press 0.05-0.25 s; LED on at 0.25 s (screen: off -> boot -> lock)', f: (t) => ({ btn_power: press(t, 0.05, 0.25), led: t >= 0.25 }) },
    unlock: { len: 0.7, note: 'LED blinks once at 0.5 s (screen: lock -> home; the swipe is character-side)', f: (t) => ({ led: !on(t, [[0.5, 0.6]]) }) },
    ptt: { len: 1.6, note: 'PTT key pressed at 0.05 s and held to 1.4 s (screen: ptt_idle -> ptt_talk -> ptt_idle); loop the 0.3-1.3 s span to hold longer', f: (t) => ({ btn_ptt: press(t, 0.05, 1.4) }) },
    scan: { len: 1.2, note: 'top key press 0.05-0.25 s (screen: app_open -> scan_a/b -> lock_on at 1.0 s)', f: (t) => ({ btn_action: press(t, 0.05, 0.25), led: !on(t, [[1.0, 1.1]]) }) },
    alert: { len: 1.0, loop: true, note: 'LED blinks 4 Hz (game tints it red)', f: (t) => ({ led: Math.floor(t * 8) % 2 === 0 }) },
    power_off: { len: 1.2, note: 'power key held 0.05-0.9 s; LED off at 0.95 s (screen: power_menu -> shutdown -> off)', f: (t) => ({ btn_power: press(t, 0.05, 0.9), led: t < 0.95 }) },
    flap_open: { len: 0.45, note: 'USB-C flap swings open 120 deg about its back-edge hinge (play backwards to close)', f: (t) => ({ flap: seg(t, 0, 0.4) }) },
  };
  const ORDER = ['idle', 'wake', 'unlock', 'ptt', 'scan', 'alert', 'power_off', 'flap_open'];
  function pose(clip, t) {
    rest();
    const C = CLIPS[clip]; if (!C) return;
    const tt = C.loop ? wrap(t, C.len) : clampR(t, 0, C.len), s = C.f(tt);
    for (const [n, [ax, d]] of Object.entries(PRESS)) N[n].position[ax] = REST[n].p[ax] + d * (s[n] || 0);
    N.flap_usb.rotation.x = -deg(120) * (s.flap || 0);
    if (s.led === false) hide(N.led_status);
  }
  const clips = {}; for (const n of ORDER) clips[n] = { len: CLIPS[n].len, loop: !!CLIPS[n].loop, keys: KEYS, step: STEP, note: CLIPS[n].note };

  root.userData = {
    units: 'metres', up: '+Y (long axis, portrait)', forward: '+Z (rear cameras; the screen faces -Z, toward the holder)', left: "+X (holder's left: PTT key)",
    origin: 'centre of the tablet volume; grip_left_hand is the palm under the hand strap', envelope_m: TB.env.map(mm),
    rest: 'keys out, flap closed, LED shown, strap at rest',
    nodes: 'btn_* press into the frame (power/volume +X 0.5-0.6 mm, PTT -X 0.8 mm, btn_action -Y 0.5 mm); flap_usb hinges about X at its back edge (open = -120 deg about X, swinging out of the bottom edge); led_status hidden by scale (STEP)',
  };
  return {
    id: 'tablet', file: 'tactical-tablet.glb', source: 'gadgets/tactical-tablet/viewer.html', root, nodes: N, clips, order: ORDER, pose, rest, dims: TB,
    screen: K.SCREEN,

function concreteTexture(seamsX, seamsY, tone) {
  const c = canvas(1024, 1024), x = c.getContext('2d');
  x.fillStyle = tone; x.fillRect(0, 0, 1024, 1024);
  let s = 1234567;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 60; i++) {
    const gx = rnd() * 1024, gy = rnd() * 1024, g = x.createRadialGradient(gx, gy, 0, gx, gy, 80 + rnd() * 240);
    const v = rnd() < 0.5 ? 0 : 255; g.addColorStop(0, `rgba(${v},${v},${v},${0.035 + rnd() * 0.04})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, 1024, 1024);
  }
  for (let i = 0; i < 26000; i++) { const v = rnd() < 0.5 ? 20 : 220; x.fillStyle = `rgba(${v},${v},${v},${0.05 + rnd() * 0.08})`; x.fillRect(rnd() * 1024, rnd() * 1024, 1 + rnd() * 2, 1 + rnd() * 2); }
  x.lineWidth = 3;
  for (let i = 0; i <= seamsX; i++) { const p = (i / seamsX) * 1024; x.strokeStyle = 'rgba(0,0,0,0.5)'; x.beginPath(); x.moveTo(p, 0); x.lineTo(p, 1024); x.stroke(); x.strokeStyle = 'rgba(255,255,255,0.08)'; x.beginPath(); x.moveTo(p + 3, 0); x.lineTo(p + 3, 1024); x.stroke(); }
  for (let i = 0; i <= seamsY; i++) { const p = (i / seamsY) * 1024; x.strokeStyle = 'rgba(0,0,0,0.5)'; x.beginPath(); x.moveTo(0, p); x.lineTo(1024, p); x.stroke(); x.strokeStyle = 'rgba(255,255,255,0.08)'; x.beginPath(); x.moveTo(0, p + 3); x.lineTo(1024, p + 3); x.stroke(); }
  if (seamsX) for (let i = 0; i < seamsX; i++) for (let j = 0; j < seamsY; j++) for (const [u, v] of [[0.25, 0.3], [0.75, 0.3], [0.25, 0.7], [0.75, 0.7]]) {
    const cx = ((i + u) / seamsX) * 1024, cy = ((j + v) / seamsY) * 1024;
    x.fillStyle = 'rgba(0,0,0,0.55)'; x.beginPath(); x.arc(cx, cy, 6, 0, Math.PI * 2); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.07)'; x.beginPath(); x.arc(cx + 1.5, cy + 2, 6, 0, Math.PI); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}

{
