<style>
  /* Layout: full-bleed bay with a test wall; field-manual plate top-left, control strip along the bottom. */
  :root {
    --bg: #e6e6ec;
    --bg-deep: #c9cad3;
    --fg: #16171d;
    --muted: #5b5e6b;
    --panel: rgba(240, 240, 246, 0.8);
    --line: rgba(22, 23, 29, 0.16);
    --accent: #6a3fe0;
    --accent-fg: #f7f3ff;
    --font-display: "Chakra Petch", "Arial Narrow", sans-serif;
    --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Chivo Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0c11; --bg-deep: #05060a; --fg: #e8e8f0; --muted: #8e92a6;
      --panel: rgba(13, 14, 20, 0.74); --line: rgba(232, 232, 240, 0.13);
      --accent: #8f63ff; --accent-fg: #0e0819; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0c11; --bg-deep: #05060a; --fg: #e8e8f0; --muted: #8e92a6;
    --panel: rgba(13, 14, 20, 0.74); --line: rgba(232, 232, 240, 0.13);
    --accent: #8f63ff; --accent-fg: #0e0819; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 38%, var(--bg) 0%, var(--bg) 35%, var(--bg-deep) 100%);
    background-color: var(--bg);
    color: var(--fg); font-family: var(--font-body); overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; outline: none; }
  .plate {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); left: max(16px, env(safe-area-inset-left, 0px));
    max-width: min(360px, calc(100vw - 32px)); display: grid; gap: 6px; pointer-events: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .plate h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5.2vw, 36px);
    line-height: 0.95; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .plate h1 span { color: var(--accent); }
  .specs {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 6px 0 0;
    font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .specs dt { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10.5px; padding-top: 1px; }
  .specs dd { margin: 0; }
  .state { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; font: 500 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
  .chip b { font-weight: 500; color: var(--accent); }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: center; pointer-events: none;
  }
  .controls {
    pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 14px; padding: 8px; max-width: 100%;
  }
  .group { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--line); }
  button {
    font: 500 13px/1 var(--font-body); color: var(--fg); background: transparent; border: 0;
    padding: 9px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center;
  }
  button:hover { background: var(--line); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-fg); font-weight: 600; padding: 10px 16px; min-width: 112px; justify-content: center; }
  kbd { font: 500 11px var(--font-mono); opacity: 0.75; border: 1px solid currentColor; border-radius: 4px; padding: 1px 4px; }
  .hint {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 20px);
    font: 11px var(--font-mono); letter-spacing: 0.06em; color: #9a9db0; text-align: right; pointer-events: none;
  }
  .label {
    font: 500 11px var(--font-mono); letter-spacing: 0.04em; color: #e8e8f0;
    background: rgba(13, 14, 20, 0.78); border: 1px solid rgba(232, 232, 240, 0.16); border-radius: 6px; padding: 4px 7px;
    white-space: nowrap; transform: translateY(-14px); pointer-events: none;
  }
  .label::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 12px; background: #e8e8f0; opacity: 0.5; }

    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    font: 12px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: #8e92a6;
  }

    .hint { display: none; }

    button.primary { min-width: 96px; }
  }

<body>
<div id="stage" aria-label="Interactive 3D model of a four-wheeled scout drone you can throw and drive around a room"></div>
<div id="feed" class="feed" aria-label="Drone camera feed"><div class="feed-tag"><span id="feed-dot"></span><span id="feed-name">Nose cam</span></div></div>

<header class="plate">
  <div class="eyebrow">Recon gadget</div>
  <h1>Scout <span>Drone</span></h1>
  <dl class="specs">
    <dt>Drive</dt><dd>Four wheels on swing arms, skid steer</dd>
    <dt>Hop</dt><dd>Belly thumper, about 25 cm up</dd>
    <dt>Eye</dt><dd>Wide nose camera behind sliding shutters</dd>
  </dl>
  <div class="state" aria-live="polite"><span class="chip">Status <b id="status">In hand</b></span></div>
</header>

<div class="hint">WASD or arrows to drive · Space to hop · drag to orbit</div>
<div id="loading">Charging the drone…</div>

<nav class="bar" aria-label="Model controls">
  <div class="controls">
    <button id="throw" class="primary" type="button" title="Throw the drone, or pick it up (T)">Throw <kbd>T</kbd></button>
    <button type="button" id="patrol" aria-pressed="true" title="Drive a loop on its own (P)">Patrol</button>
    <button type="button" id="hop" title="Hop (Space)">Hop</button>
    <div class="group" role="group" aria-label="View">
      <button type="button" data-view="follow">Follow</button>
      <button type="button" data-view="close">Close</button>
      <button type="button" data-view="room">Room</button>
    </div>
    <button type="button" id="sound" aria-pressed="true" title="Sounds">Sound</button>
  </div>
</nav>

<style>

    border: 1px solid rgba(167, 123, 255, 0.55); border-radius: 10px; overflow: hidden; 
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), inset 0 0 60px rgba(0, 0, 0, 0.75); background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px); }
  .feed-tag { position: absolute; left: 10px; top: 8px; display: flex; gap: 6px; align-items: center; font: 500 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: #e8e8f0; text-shadow: 0 1px 2px #000; }
  #feed-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff4d4d; box-shadow: 0 0 6px #ff4d4d; }

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices, toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';

// Metres, +Y up, the drone drives toward +Z. Origin on the ground under the middle of the drone.
// +X is the drone's left. Four swing arms carry the wheels: the steeper the arms, the higher the body rides.

/* ------------------------------------------------------------------ helpers */

// Monotone cubic interpolation through [x, y] points (no overshoot).
function curve(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const constant = v => () => v;

// Loft a superellipse cross-section along X. top/bot/hw/n are functions of x.
// round: radius used to roll the edges at both ends; caps are flat.
function loft({ x0, x1, top, bot, hw, n = constant(2.6), cy = null, steps = 160, seg = 72, round = 0, roundStart = round, roundEnd = round, groove = null }) {
  const xs = [];
  // denser stations near the ends so the rolled edges stay smooth
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const e = 0.5 - 0.5 * Math.cos(Math.PI * u);
    xs.push(x0 + (x1 - x0) * (0.55 * u + 0.45 * e));
  }
  const pos = [], idx = [];
  const ring = (x) => {
    let T = top(x), B = bot(x), W = hw(x);
    const ds = x - x0, de = x1 - x;
    let inset = 0;
    if (roundStart > 0 && ds < roundStart) inset = Math.max(inset, roundStart - Math.sqrt(Math.max(0, roundStart * roundStart - (roundStart - ds) ** 2)));
    if (roundEnd > 0 && de < roundEnd) inset = Math.max(inset, roundEnd - Math.sqrt(Math.max(0, roundEnd * roundEnd - (roundEnd - de) ** 2)));
    let gB = 0, gW = 0;
    if (groove) { const g = groove(x); gB = g; gW = g; }
    T -= inset; B += inset + gB; W -= inset + gW;
    // a rounding radius larger than the section must not turn the ring inside out
    W = Math.max(0.002, W);
    const c = cy ? cy(x) : (T + B) / 2, ry = Math.max(0.001, (T - B) / 2);
    const e = 2 / n(x), out = [];
    for (let j = 0; j < seg; j++) {
      const t = (j / seg) * Math.PI * 2, co = Math.cos(t), si = Math.sin(t);
      const z = W * Math.sign(co) * Math.pow(Math.abs(co), e);
      const y = c + ry * Math.sign(si) * Math.pow(Math.abs(si), e);
      out.push([x, y, z]);
    }
    return out;
  };
  const rings = xs.map(ring);
  rings.forEach(r => r.forEach(p => pos.push(...p)));
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * seg + j, b = i * seg + (j + 1) % seg, c = (i + 1) * seg + j, d = (i + 1) * seg + (j + 1) % seg;
      idx.push(a, c, b, b, c, d);
    }
  }
  // flat caps with their own vertices
  const capAt = (r, flip) => {
    const base = pos.length / 3;
    const cx = r.reduce((s, p) => s + p[1], 0) / r.length;
    pos.push(r[0][0], cx, 0);
    r.forEach(p => pos.push(...p));
    for (let j = 0; j < seg; j++) {
      const a = base + 1 + j, b = base + 1 + (j + 1) % seg;
      flip ? idx.push(base, a, b) : idx.push(base, b, a);
    }
  };
  // caps face outward: -x at the start, +x at the end
  capAt(rings[0], true);
  capAt(rings[rings.length - 1], false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Polygon with per-corner radius: pts = [[x, y, r], ...]
function roundedShape(pts, shape = new THREE.Shape()) {
  const n = pts.length;
  const P = pts.map(p => new THREE.Vector2(p[0], p[1]));
  for (let i = 0; i < n; i++) {
    const prev = P[(i - 1 + n) % n], cur = P[i], next = P[(i + 1) % n], r = pts[i][2] || 0;
    const v1 = prev.clone().sub(cur), v2 = next.clone().sub(cur);
    const l1 = v1.length(), l2 = v2.length();
    const rr = Math.min(r, l1 / 2.05, l2 / 2.05);
    const a = cur.clone().add(v1.normalize().multiplyScalar(rr));
    const b = cur.clone().add(v2.normalize().multiplyScalar(rr));
    if (i === 0) shape.moveTo(a.x, a.y); else shape.lineTo(a.x, a.y);
    if (rr > 0) shape.quadraticCurveTo(cur.x, cur.y, b.x, b.y);
  }
  shape.closePath();
  return shape;
}
function roundedPath(pts) { return roundedShape(pts, new THREE.Path()); }

// Extrude a side-profile shape (in the XY plane) across Z, centred on zc.
function slab(shape, width, { bevel = 0.04, segs = 3, zc = 0, curveSegments = 24 } = {}) {
  const depth = Math.max(0.001, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.9, bevelSegments: segs, curveSegments,
  });
  g.translate(0, 0, zc - depth / 2);
  return g;
}

// Lathe around the X axis. pts = [[x, r], ...]
function latheX(pts, seg = 64) {
  const g = new THREE.LatheGeometry(pts.map(([x, r]) => new THREE.Vector2(r, x)), seg);
  g.rotateZ(-Math.PI / 2);
  g.scale(1, 1, 1);
  // after rotateZ(-90deg) the lathe axis (y) maps to +x
  return g;
}

function clean(g) {
  g = g.index ? g.toNonIndexed() : g;
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  return g;
}
function creased(g, angle = 34) { return toCreasedNormals(clean(g), THREE.MathUtils.degToRad(angle)); }

const evaluator = new Evaluator();
evaluator.attributes = ['position', 'normal'];
evaluator.useGroups = false;
// Cutters passed together must not overlap each other (they are merged into one brush).
function subtract(base, ...cutters) {
  let a = new Brush(clean(base)); a.updateMatrixWorld();
  const cut = new Brush(mergeGeometries(cutters.map(clean))); cut.updateMatrixWorld();
  const r = evaluator.evaluate(a, cut, SUBTRACTION);
  return r.geometry;
}
// For cutters that overlap, subtract them one after another.
function subtractEach(base, ...cutters) {
  let g = base;
  for (const c of cutters) g = subtract(g, c);
  return g;
}
function box(x0, x1, y0, y1, z0, z1) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return g;
}



// Screw head with its drive recess ("inlet"). Built along +y with the underside at y = 0.
// style: 'slot' (flat blade), 'phillips' (cross), 'hex' (socket). countersunk heads sit nearly flush.
function screwHead(r, { style = 'slot', h, countersunk = false, seg = 36 } = {}) {
  if (h === undefined) h = countersunk ? r * 0.5 : r * 0.6;
  const prof = countersunk
    ? [[0, 0], [r * 0.5, 0], [r, h - 0.006], [r, h], [0, h]]
    : [[0, 0], [r, 0], [r, h * 0.45], [r * 0.86, h * 0.82], [r * 0.55, h * 0.97], [0, h]];
  let g = new THREE.LatheGeometry(prof.map(([x, y]) => new THREE.Vector2(x, y)), seg);
  // the recess a driver goes into: deep enough to grip, open across the head for a blade
  const d = Math.min(h * 0.85, r * 0.62);
  if (style === 'slot') g = subtract(g, box(-r * 1.3, r * 1.3, h - d, h + 0.2, -r * 0.17, r * 0.17));
  else if (style === 'phillips') {
    g = subtractEach(g, box(-r * 0.68, r * 0.68, h - d, h + 0.2, -r * 0.13, r * 0.13), box(-r * 0.13, r * 0.13, h - d, h + 0.2, -r * 0.68, r * 0.68));
  } else if (style === 'hex') {
    g = subtract(g, new THREE.CylinderGeometry(r * 0.5, r * 0.5, d * 2, 6).translate(0, h, 0));
  }
  return creased(g, 35);
}
// Put a screw head at pos with its axis along normal; spin turns the recess about that axis.
function placeScrew(geo, pos, normal, spin = 0) {
  geo.applyMatrix4(new THREE.Matrix4().makeRotationY(spin));
  geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal.clone().normalize()));
  geo.translate(pos.x, pos.y, pos.z);
  return geo;
}


const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => ease(clamp01((t - a) / (b - a)));
const springK = (u, k = 5, w = 7) => u <= 0 ? 0 : u >= 1 ? 1 : 1 - Math.exp(-k * u) * Math.cos(w * u);
const deg = THREE.MathUtils.degToRad;
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const NOISE = /* glsl */`
varying vec3 vObjPos;
uniform float uGrain, uColorVar, uRoughVar, uWood;
uniform vec3 uWoodDark;
float h3(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x), mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x), f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x), mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x), f.y), f.z);
}
float fbm3(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + 1.7; a *= 0.5; } return s; }
// fw = pixel footprint in noise cells at the first octave; octaves near or below a pixel fade to their mean
float fbmAA(vec3 p, float fw){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*mix(vnoise(p), 0.5, smoothstep(0.3, 1.0, fw)); p = p*2.03 + 1.7; a *= 0.5; fw *= 2.03; } return s; }
`;

// Physical material with object-space grain (colour mottling + roughness breakup); wood adds
// laminate figure running along the stock.
function surface(params, noise = {}) {
  const m = new THREE.MeshPhysicalMaterial(params);
  const u = {
    uGrain: { value: noise.grain ?? 6 },
    uColorVar: { value: noise.colorVar ?? 0.06 },
    uRoughVar: { value: noise.roughVar ?? 0.08 },
    uWood: { value: noise.wood ? 1 : 0 },

const CM = {
  alloy: surface({ color: '#2a2c33', metalness: 0.7, roughness: 0.4 }, { grain: 260, colorVar: 0.035, roughVar: 0.05 }),
  shell: surface({ color: '#1d1e24', metalness: 0.15, roughness: 0.55 }, { grain: 200, colorVar: 0.04, roughVar: 0.06 }),
  steel: surface({ color: '#34363d', metalness: 0.85, roughness: 0.33 }, { grain: 320, colorVar: 0.03, roughVar: 0.04 }),
  dark: surface({ color: '#111216', metalness: 0.45, roughness: 0.62 }, { grain: 300, colorVar: 0.03, roughVar: 0.05 }),
  bolt: surface({ color: '#45474f', metalness: 0.85, roughness: 0.32 }, { grain: 400, colorVar: 0.03, roughVar: 0.04 }),

const CM_NAMES = { alloy: 'frame_alloy', shell: 'shell_composite', steel: 'joint_steel', dark: 'black_steel', bolt: 'fasteners', rubber: 'tyre_rubber', led: 'led_purple', rec: 'rec_light', lens: 'lens_glass' };
for (const [k, v] of Object.entries(CM_NAMES)) CM[k].name = v;
const mesh = (geo, mat, name, { cast = true, receive = true } = {}) => { const m = new THREE.Mesh(geo, mat); m.name = name; m.castShadow = cast; m.receiveShadow = receive; return m; };
const node = (name, parent) => { const g = new THREE.Group(); g.name = name; if (parent) parent.add(g); return g; };
const hexScrew = (r, pos, normal, spin = 0.3) => placeScrew(screwHead(r, { style: 'hex', h: r * 0.55, seg: 18 }), pos, normal, spin);
const rect = (x0, x1, y0, y1, r) => roundedShape([[x0, y0, r], [x1, y0, r], [x1, y1, r], [x0, y1, r]]);
// plates: in the XY plane (thick along Z), the YZ plane (thick along X) and the XZ plane (thick along Y)
const plateXY = (shape, z0, z1, b) => slab(shape, z1 - z0, { bevel: b, segs: 1, zc: (z0 + z1) / 2 });
const plateYZ = (z0, z1, y0, y1, r, x0, x1, b) => slab(rect(z0, z1, y0, y1, r), x1 - x0, { bevel: b, segs: 1, zc: -(x0 + x1) / 2 }).rotateY(-Math.PI / 2);
const plateXZ = (x0, x1, z0, z1, r, y0, y1, b) => slab(rect(x0, x1, -z1, -z0, r), y1 - y0, { bevel: b, segs: 1, zc: (y0 + y1) / 2 }).rotateX(-Math.PI / 2);
function cylZ(r0, r1, z0, z1, seg = 28) { const g = new THREE.CylinderGeometry(r1, r0, z1 - z0, seg); g.rotateX(Math.PI / 2); g.translate(0, 0, (z0 + z1) / 2); return g; }
function cylX(r, x0, x1, seg = 24) { return new THREE.CylinderGeometry(r, r, x1 - x0, seg).rotateZ(-Math.PI / 2).translate((x0 + x1) / 2, 0, 0); }

const merge = (list) => mergeGeometries(list.map(clean));

/* ------------------------------------------------------------------ the drone */

const B = 0.0063;                                   // the hull's bevel grows its outline by this much
const R = 0.043, L = 0.07, PX = 0.074, PZ = 0.06, WX = 0.098;   // wheel radius, arm length, arm pivots, wheel centre out from the middle
const TOP = 0.034 + B, BOT = -0.028 - B, BELLY = BOT - 0.006;   // body space (y = 0 on the arm pivots)
const A_RIDE = 40, A_STOW = THREE.MathUtils.radToDeg(Math.asin((-BELLY - R) / L));   // arm angle below horizontal
const bodyY = (a) => R + L * Math.sin(deg(a));
const WHEELS = [['fl', 1, 1], ['fr', -1, 1], ['rl', 1, -1], ['rr', -1, -1]];   // name, side (+1 = left, +X), end (+1 = front)

// a lens looking along +Z: barrel, glass, IR ring, and the view point node
function lensAssembly(parent, Rl, prefix) {
  const g = node(prefix + '_lens', parent);
  g.add(mesh(cylZ(Rl * 0.62, Rl * 0.55, 0, Rl * 0.55), CM.dark, prefix + '_lens_barrel'));
  const glass = new THREE.SphereGeometry(Rl * 0.42, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2); glass.rotateX(Math.PI / 2); glass.scale(1, 1, 0.45); glass.translate(0, 0, Rl * 0.55);
  g.add(mesh(glass, CM.lens, prefix + '_lens_glass', { cast: false }));
  const ir = []; for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; ir.push(new THREE.SphereGeometry(Rl * 0.045, 8, 6).translate(Math.cos(a) * Rl * 0.53, Math.sin(a) * Rl * 0.53, Rl * 0.55)); }
  g.add(mesh(merge(ir), CM.led, prefix + '_ir_ring', { cast: false }));
  const fx = node('fx_lens_' + prefix, g); fx.position.set(0, 0, Rl * 0.6);
  fx.userData = { note: 'view point: a camera here looking along this node\'s +Z sees what the drone sees' };
  return fx;
}

function wheelGeos() {
  const tire = latheX([[-0.015, 0.0295], [-0.0158, 0.034], [-0.0148, 0.0386], [-0.0118, 0.0405], [0.0118, 0.0405], [0.0148, 0.0386], [0.0158, 0.034], [0.015, 0.0295]], 48);
  const lugs = [];
  for (let k = 0; k < 16; k++) {
    const phi = k / 16 * Math.PI * 2;
    for (const s of [-1, 1]) lugs.push(box(-0.0064, 0.0064, -0.002, 0.0022, -0.0026, 0.0026).rotateY(s * 0.45).translate(s * 0.0062, 0.0405, 0).rotateX(phi + (s > 0 ? 0.12 : 0)));
  }
  const rim = latheX([[-0.0136, 0.0298], [-0.0136, 0.0222], [0.0136, 0.0222], [0.0136, 0.0298]], 40);
  const spokes = []; for (let k = 0; k < 5; k++) spokes.push(box(0.0055, 0.0115, 0.0075, 0.0228, -0.0028, 0.0028).rotateX(k / 5 * Math.PI * 2));
  return {
    tire: merge([tire, ...lugs]), rim: merge([rim, ...spokes]), disc: cylX(0.0224, -0.006, 0.002, 40),
    hub: merge([cylX(0.0095, -0.016, 0.0125, 28), cylX(0.0062, -0.03, -0.012, 20)]),
    nut: hexScrew(0.0052, V3(0.0125, 0, 0), V3(1, 0, 0), 0.2),
    led: new THREE.TorusGeometry(0.0262, 0.0011, 8, 56).rotateY(Math.PI / 2).translate(0.0138, 0, 0),
  };
}
function armGeos() {
  const prof = [[-0.011, -0.0115, 0.011], [L + 0.009, -0.0085, 0.0085], [L + 0.009, 0.0085, 0.0085], [-0.011, 0.0115, 0.011]];
  let link = slab(roundedShape(prof), 0.0065, { bevel: 0.0015, segs: 2, zc: -0.00325 }).rotateY(-Math.PI / 2);
  link = subtract(link, slab(roundedShape([[0.016, -0.0042, 0.004], [L - 0.016, -0.0032, 0.003], [L - 0.016, 0.0032, 0.003], [0.016, 0.0042, 0.004]]), 0.03, { bevel: 0 }).rotateY(-Math.PI / 2).translate(0.003, 0, 0));
  const joint = merge([cylX(0.0105, -0.001, 0.0082, 28), cylX(0.0082, -0.0005, 0.0082, 24).translate(0, 0, L)]);
  const screws = merge([hexScrew(0.0042, V3(0.0082, 0, 0), V3(1, 0, 0)), hexScrew(0.0034, V3(0.0082, 0, L), V3(1, 0, 0), 0.7)]);
  return { link, joint, screws };
}

function buildDrone() {
  const root = node('scout_drone');
  root.userData = {
    units: 'metres', up: '+Y', forward: '+Z', left: '+X', origin: 'on the ground under the middle of the drone',
    wheel_radius_m: R, arm_length_m: L, arm_pivots_m: [PX, 0, PZ], arm_angle_ride_deg: A_RIDE, arm_angle_stowed_deg: +A_STOW.toFixed(2),
    note: 'body height = wheel radius + arm length * sin(arm angle); front arms turn +angle about X, rear arms -angle',
    source: 'gadgets/scout-drone/viewer.html',
  };
  const body = node('body', root); body.position.y = bodyY(A_RIDE);

  // hull: side profile extruded across the drone, with the nose camera well
  const prof = [[-0.112, -0.014, 0.008], [-0.098, -0.028, 0.006], [0.094, -0.028, 0.006], [0.118, -0.01, 0.008], [0.106, 0.016, 0.01], [0.07, 0.034, 0.012], [-0.08, 0.034, 0.012], [-0.112, 0.014, 0.008]];
  let hull = slab(roundedShape(prof), 0.118, { bevel: 0.007, segs: 2 }).rotateY(-Math.PI / 2);
  hull = subtract(hull, cylZ(0.0175, 0.0175, 0.09, 0.16, 36).translate(0, 0.003, 0));
  body.add(mesh(creased(hull, 30), CM.shell, 'hull'));
  // top deck with vents
  let deck = plateXZ(-0.046, 0.046, -0.072, 0.06, 0.008, TOP - 0.001, TOP + 0.003, 0.0012);
  const vents = []; for (let k = 0; k < 5; k++) vents.push(box(-0.028, 0.028, TOP - 0.01, TOP + 0.01, 0.018 + k * 0.0072, 0.0215 + k * 0.0072));
  deck = subtract(deck, ...vents);
  body.add(mesh(creased(deck, 30), CM.alloy, 'deck'));
  // side skirts, pivot bosses
  const skirt = plateYZ(-0.036, 0.036, -0.02, 0.022, 0.006, 0.0585, 0.0625, 0.001);
  body.add(mesh(creased(merge([skirt, mirror(skirt, 'x')]), 30), CM.alloy, 'side_skirts'));
  const boss = cylX(0.0125, 0.05, 0.074, 28);
  body.add(mesh(merge([boss.clone().translate(0, 0, PZ), boss.clone().translate(0, 0, -PZ), mirror(boss.clone().translate(0, 0, PZ), 'x'), mirror(boss.clone().translate(0, 0, -PZ), 'x')]), CM.steel, 'arm_bosses'));
  // screws: deck corners and skirts
  const sc = [];
  for (const x of [-0.04, 0.04]) for (const z of [0.053, -0.066]) sc.push(hexScrew(0.0032, V3(x, TOP + 0.003, z), V3(0, 1, 0), x * 40 + z * 20));
  for (const s of [-1, 1]) for (const y of [-0.014, 0.016]) for (const z of [-0.03, 0.03]) sc.push(hexScrew(0.003, V3(s * 0.0625, y, z), V3(s, 0, 0), y * 90 + z * 30));
  body.add(mesh(merge(sc), CM.bolt, 'screws'));

  const leds = [];
  leds.push(box(-0.034, 0.034, -0.0008, 0.0008, -0.0026, 0.0026).rotateX(deg(26.6)).translate(0, 0.0306, 0.0908));
  for (const x of [-0.03, 0.03]) leds.push(box(-0.011, 0.011, -0.0008, 0.0008, -0.0024, 0.0024).rotateX(deg(-32)).translate(x, 0.0294, -0.0993));
  for (const s of [-1, 1]) leds.push(box(-0.0007, 0.0007, -0.0012, 0.0012, -0.026, 0.026).translate(s * 0.0641, 0.0005, 0));

  ant.add(mesh(new THREE.CylinderGeometry(0.0009, 0.0013, 0.1, 8).translate(0, 0.07, 0), CM.dark, 'antenna_whip'));

  const thump = node('thumper', body); thump.position.y = BOT;
  const plate = new THREE.CylinderGeometry(0.028, 0.03, 0.006, 6).translate(0, -0.003, 0);
  const psc = []; for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2 + Math.PI / 6; psc.push(hexScrew(0.0026, V3(Math.cos(a) * 0.019, -0.006, Math.sin(a) * 0.019), V3(0, -1, 0), a)); }

    arm.add(mesh(creased(fix(AG.link), 30), CM.alloy, `arm_${n}_link`));
    arm.add(mesh(fix(AG.joint), CM.steel, `arm_${n}_joint`));

    w.add(mesh(creased(wf(WG.rim), 30), CM.alloy, `wheel_${n}_rim`));
    w.add(mesh(wf(WG.disc), CM.dark, `wheel_${n}_disc`));
    w.add(mesh(wf(WG.hub), CM.steel, `wheel_${n}_hub`));
    w.add(mesh(wf(WG.nut), CM.bolt, `wheel_${n}_nut`));

// one pose of every moving part
const P = (o = {}) => ({ arms: [A_RIDE, A_RIDE, A_RIDE, A_RIDE], dy: 0, pitch: 0, roll: 0, spin: [0, 0, 0, 0], ant: -0.2, thump: 0, open: 1, ...o });
function pose(D, p) {
  const h = p.arms.map(bodyY);
  const front = (h[0] + h[1]) / 2, rear = (h[2] + h[3]) / 2, left = (h[0] + h[2]) / 2, right = (h[1] + h[3]) / 2;
  D.body.position.set(0, (front + rear) / 2 + p.dy, 0);
  D.body.rotation.set(Math.atan2(rear - front, 2 * PZ) + p.pitch, 0, Math.atan2(left - right, 2 * PX) + p.roll);
  WHEELS.forEach(([, , e], i) => { D.arms[i].rotation.x = e * deg(p.arms[i]); D.wheels[i].rotation.x = p.spin[i]; });
  D.ant.rotation.x = p.ant;
  D.thump.position.y = BOT - 0.045 * p.thump;
  D.shutL.position.x = 0.021 * p.open; D.shutR.position.x = -0.021 * p.open;
}

// the clips, as functions of time
const T = { deploy: 1.2, drive: 0.6, turn: 0.6, hop: 0.9, shutdown: 0.9 };
const HOP = { launch: 0.14, land: 0.6 };
const zWheel = (a) => L * Math.cos(deg(a));
function deployP(t) {
  const s = springK(clamp01((t - 0.2) / 0.9)), a = lerp(A_STOW, A_RIDE, s);
  const spin = WHEELS.map(([, , e]) => e * (zWheel(a) - zWheel(A_STOW)) / R);   // the wheels roll in as the arms swing down
  return P({ arms: [a, a, a, a], spin, open: seg(t, 0, 0.25), ant: lerp(Math.PI / 2, -0.2, springK(clamp01((t - 0.45) / 0.75), 5, 9)) });
}
const STOWED = () => P({ arms: [A_STOW, A_STOW, A_STOW, A_STOW], open: 0, ant: Math.PI / 2 });
function driveP(t, v = 1) {
  const u = t / T.drive, a = WHEELS.map((w, i) => A_RIDE + 1.6 * Math.sin(2 * Math.PI * (u + i * 0.27)));
  const sp = u * 4 * Math.PI;
  return P({ arms: a, spin: [sp, sp, sp, sp], dy: 0.0012 * Math.sin(4 * Math.PI * u), ant: -0.34 + 0.05 * Math.sin(2 * Math.PI * u) });
}
function turnP(dir) { return (t) => { const sp = t / T.turn * 2 * Math.PI * dir; return P({ spin: [-sp, sp, -sp, sp], ant: -0.2 + 0.03 * Math.sin(2 * Math.PI * t / T.turn) }); }; }
function hopArm(t) {
  if (t < 0.12) return lerp(A_RIDE, 20, seg(t, 0, 0.12));
  if (t < 0.17) return lerp(20, 50, seg(t, 0.12, 0.17));
  if (t < HOP.land) return lerp(50, 58, seg(t, 0.17, 0.4));
  if (t < 0.68) return lerp(58, 24, seg(t, HOP.land, 0.68));
  return lerp(24, A_RIDE, springK(clamp01((t - 0.68) / 0.22), 5, 9));
}
function hopP(t) {
  const a = hopArm(t), air = seg(t, 0.15, 0.22) * (1 - seg(t, HOP.land - 0.04, HOP.land));
  return P({ arms: [a, a, a, a], dy: air * (bodyY(A_RIDE) - bodyY(a)), thump: t < 0.12 ? 0 : t < 0.15 ? clamp01((t - 0.12) / 0.03) : 1 - seg(t, 0.2, 0.42),
    pitch: -0.05 * Math.sin(Math.PI * clamp01((t - 0.15) / 0.45)), ant: -0.2 + 0.5 * Math.sin(Math.PI * clamp01((t - 0.12) / 0.3)) * (1 - seg(t, 0.4, 0.6)) - 0.25 * Math.sin(Math.PI * clamp01((t - 0.6) / 0.3)) });
}
function shutdownP(t) {
  const a = lerp(A_RIDE, 6, Math.pow(clamp01((t - 0.1) / 0.55), 2));
  return P({ arms: [a, a, a, a], open: 1 - seg(t, 0, 0.3), ant: lerp(-0.2, 1.25, seg(t, 0.25, 0.9)) });
}

function sampleClip(name, len, list, fn) {
  const fps = 30, n = Math.round(len * fps), data = list.map(() => ({})), times = [];
  for (let i = 0; i <= n; i++) { const t = Math.min(len, i / fps); times.push(t); fn(t); list.forEach(([o, props], j) => { o.updateMatrix(); for (const p of props) (data[j][p] = data[j][p] || []).push(...o[p].toArray()); }); }
  const tracks = []; list.forEach(([o, props], j) => { for (const p of props) tracks.push(new (p === 'quaternion' ? THREE.QuaternionKeyframeTrack : THREE.VectorKeyframeTrack)(`${o.name}.${p}`, times, data[j][p])); });
  return new THREE.AnimationClip(name, len, tracks);
}

  motor.src.playbackRate.setTargetAtTime(0.75 + 0.75 * run, t, 0.05);
  motor.g.gain.setTargetAtTime(soundOn && run > 0.02 ? 0.12 + 0.4 * run : 0, t, 0.06);
}
const SFX = {
  throwS: () => play('throw', 0.6), land: () => play('land', 0.8), deploy: () => play('deploy'), hop: () => play('hop'), shutdown: () => play('shutdown'),
};

/* ------------------------------------------------------------------ UI */

const OFF = { follow: V3(0.95, 0.62, 1.3), close: V3(0.36, 0.2, 0.46) };
let view = 'follow', camTween = null;
function droneTarget() { return V3(dr.pos.x, 0.08 + dr.y * 0.5, dr.pos.z); }
function viewFor(name) {
  const asp = camera.aspect, kk = asp < 1.1 ? 1.35 / Math.max(asp, 0.45) : 1;
  if (name === 'room') return { pos: V3(2.4, 2.3, 4.9).sub(V3(0, 0.1, 1.5)).multiplyScalar(kk).add(V3(0, 0.1, 1.5)), target: V3(0, 0.1, 1.5) };
  const tg = dr.phase === 'hand' ? V3(0.1, 0.08, 1.0) : droneTarget();
  return { pos: tg.clone().add(OFF[name].clone().multiplyScalar(kk)), target: tg };
}
function goView(name, instant = false) {
  view = name; const v = viewFor(name); camTween = null;
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  if (instant) { camera.position.copy(v.pos); controls.target.copy(v.target); controls.update(); return; }
  camTween = { from: camera.position.clone(), fromT: controls.target.clone(), to: v.pos, tt: v.target, t: 0 };
}
controls.minDistance = 0.15;
function setPatrol(on) { patrol = on; $('patrol').setAttribute('aria-pressed', String(on)); }
function throwOrPick() {
  autoStart = -1;
  if (dr.phase === 'hand') { dr.phase = 'flying'; dr.t = 0; dr.yaw = -Math.PI / 2; dr.v = dr.w = 0; dr.hopT = -1; dr.air = false; SFX.throwS(); }
  else if (dr.phase === 'ready') { dr.phase = 'shutdown'; dr.t = 0; dr.v = dr.w = 0; SFX.shutdown(); }
}
$('throw').addEventListener('click', throwOrPick);
$('patrol').addEventListener('click', () => setPatrol(!patrol));
$('hop').addEventListener('click', hop);
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => goView(b.dataset.view)));
$('sound').addEventListener('click', () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', String(soundOn)); if (soundOn) unlockAudio(); });
window.addEventListener('pointerdown', unlockAudio, { capture: true });
controls.addEventListener('start', () => { camTween = null; });
const DRIVE_KEYS = ['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'];
window.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(); unlockAudio();
  if (DRIVE_KEYS.includes(k)) { e.preventDefault(); keys.add(k); return; }
  if (e.repeat) return;
  if (k === ' ') { e.preventDefault(); hop(); }
  if (k === 't') throwOrPick(); if (k === 'p') setPatrol(!patrol);
});
window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize);
function statusText() {
  if (dr.phase !== 'ready') return { hand: 'In hand', flying: 'Thrown', deploying: 'Standing up', shutdown: 'Powering down' }[dr.phase];
  if (dr.hopT >= 0) return 'Hopping';
  if (Math.abs(dr.v) > 0.05 || Math.abs(dr.w) > 0.1) return patrol ? 'Patrolling' : 'Driving';
  return 'Idle';
}

/* ------------------------------------------------------------------ export */

function toBase64(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function exportScenes() {
  CM.led.emissiveIntensity = 2.6; CM.rec.emissiveIntensity = 2.2;
  const E = buildDrone(), Q = 'quaternion', PO = 'position';
  const arms = E.arms.map(a => [a, [Q]]), wheels = E.wheels.map(w => [w, [Q]]), body = [E.body, [PO, Q]];
  const shut = [[E.shutL, [PO]], [E.shutR, [PO]]], ant = [E.ant, [Q]];
  const clips = [
    sampleClip('deploy', T.deploy, [body, ...arms, ...wheels, ant, ...shut], (t) => pose(E, deployP(t))),
    sampleClip('drive', T.drive, [body, ...arms, ...wheels, ant], (t) => pose(E, driveP(t))),
    sampleClip('turn_left', T.turn, [...wheels, ant], (t) => pose(E, turnP(1)(t))),
    sampleClip('turn_right', T.turn, [...wheels, ant], (t) => pose(E, turnP(-1)(t))),
    sampleClip('hop', T.hop, [body, ...arms, ant, [E.thump, [PO]]], (t) => pose(E, hopP(t))),
    sampleClip('shutdown', T.shutdown, [body, ...arms, ant, ...shut], (t) => pose(E, shutdownP(t))),
  ];
  pose(E, P()); E.root.updateMatrixWorld(true);
  E.root.userData.clips = { deploy: 'thrown and landed on its belly: arms swing down, it stands up, shutters open, antenna flips up', drive: 'loop, wheels 2 turns forward (0.9 m/s at 1x)', turn_left: 'loop, skid turn on the spot', turn_right: 'loop', hop: `thumper fires at ${HOP.launch} s (take off), touch down at ${HOP.land} s, arms soak it up`, shutdown: 'destroyed or picked up: sags onto its belly, shutters close, antenna droops' };
  return [{ file: 'scout-drone.glb', root: E.root, animations: clips }];
}
async function exportGLB() {
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  const exporter = new GLTFExporter(), out = [], was = looping; setLoop(false);
  try { for (const s of exportScenes()) { const buf = await exporter.parseAsync(s.root, { binary: true, animations: s.animations }); out.push({ file: s.file, bytes: buf.byteLength, base64: toBase64(buf) }); } }
  finally { if (was) setLoop(true); }
  return out;
}
function preview() {
  setLoop(false);
  document.querySelectorAll('.plate, .bar, .hint').forEach(e => { e.hidden = true; });
  autoStart = -1; dr.phase = 'ready'; dr.pos.set(-0.3, 0, 1.6); dr.yaw = 0.55; dr.v = dr.w = 0; patrol = false;
  step(0);
  camera.position.set(0.32, 0.3, 1.8); controls.target.set(-0.3, 0.1, 1.6); controls.update();
  composer.render(); renderFeed();
}
window.__model = { id: 'scout-drone', exportScenes, exportGLB, preview };

/* ------------------------------------------------------------------ go */

goView('follow', true);
$('loading').hidden = true;
let autoStart = 0.8;
const clock = new THREE.Clock();
let looping = false;
function setLoop(on) { looping = on; renderer.setAnimationLoop(on ? loop : null); }
function tick(dt) {
  if (autoStart > 0) { autoStart -= dt; if (autoStart <= 0) throwOrPick(); }
  const before = droneTarget();
  step(dt);
  const st = statusText(); if ($('status').textContent !== st) $('status').textContent = st;
  const lab = dr.phase === 'hand' ? 'Throw ' : 'Pick up ';
  if ($('throw').firstChild.textContent !== lab) $('throw').firstChild.textContent = lab;
  CM.rec.emissiveIntensity = Math.sin(now * 5) > 0 ? 2.2 : 0.3;
  CM.led.emissiveIntensity = dr.phase === 'shutdown' ? Math.max(0, 2.6 * (1 - dr.t / 0.6)) : dr.phase === 'deploying' ? 2.6 * seg(dr.t, 0, 0.3) : 2.6;
  if (camTween) { camTween.t = Math.min(1, camTween.t + dt / 0.9); const e = ease(camTween.t); camera.position.lerpVectors(camTween.from, camTween.to, e); controls.target.lerpVectors(camTween.fromT, camTween.tt, e); if (camTween.t >= 1) camTween = null; }
  else if (view !== 'room' && dr.phase !== 'hand') {
    const want = droneTarget(), d = want.sub(controls.target).multiplyScalar(1 - Math.exp(-dt * 5));
    controls.target.add(d); camera.position.add(d);
  }
  motorTick();
}
function loop() { const dt = Math.min(clock.getDelta(), 1 / 30); tick(dt); controls.update(); composer.render(dt); renderFeed(); }
setLoop(true);
window.__model.ready = true;
window.__model.debug = {
  tick, stop: () => setLoop(false), renderOnce: () => { controls.update(); composer.render(); renderFeed(); },
  // set(clip, t): show one clip's pose at time t (drone parked at x, z facing yaw)
  set: (clip, t, x = -0.3, z = 1.6, yaw = 0.55) => {
    autoStart = -1; dr.phase = 'ready'; dr.pos.set(x, 0, z); dr.yaw = yaw; patrol = false;
    const fn = { stowed: STOWED, deploy: deployP, drive: driveP, turn_left: turnP(1), hop: hopP, shutdown: shutdownP, ride: () => P() }[clip];
    pose(D, fn(t)); D.root.visible = true; D.root.position.set(x, clip === 'hop' && t > HOP.launch && t < HOP.land ? HOP_V * (t - HOP.launch) - G / 2 * (t - HOP.launch) ** 2 : 0, z); D.root.rotation.set(0, yaw, 0);
  },
  drone: D, dr, goView, camera, controls, scene, renderer, setSway: () => { }, setSpin: () => { }, pivot: { rotation: {} },
};
</script>
