<style>
  /* Layout: full-bleed bay with a test wall; field-manual plate top-left, control strip along the bottom. */
  :root {
    --bg: #e6e6ec;
    --bg-deep: #c9cad3;
    --fg: #16171d;
    --muted: #5b5e6b;
    --panel: rgba(240, 240, 246, 0.8);

    --accent: #6a3fe0;
    --accent-fg: #f7f3ff;

    --font-mono: "Chivo Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0c11; --bg-deep: #05060a; --fg: #e8e8f0; --muted: #8e92a6;
      --panel: rgba(13, 14, 20, 0.74); --line: rgba(232, 232, 240, 0.13);
      --accent: #8f63ff; --accent-fg: #0e0819; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0c11; --bg-deep: #05060a; --fg: #e8e8f0; --muted: #8e92a6;
    --panel: rgba(13, 14, 20, 0.74); --line: rgba(232, 232, 240, 0.13);

  html, body { height: 100%; }

    background-color: var(--bg);

  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; outline: none; }
  .plate {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); left: max(16px, env(safe-area-inset-left, 0px));
    max-width: min(360px, calc(100vw - 32px)); display: grid; gap: 6px; pointer-events: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;

  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
  .chip b { font-weight: 500; color: var(--accent); }
  .bar {

    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);

<div id="stage" aria-label="Interactive 3D model of the breach spider cutting and blowing a doorway into a concrete test wall"></div>

<header class="plate">
  <div class="eyebrow">Automated wall breacher</div>
  <h1>Breach <span>Spider</span></h1>
  <dl class="specs">

    <dt>Cut</dt><dd>Thermal lance, 2.0 m wide × 1.8 m</dd>

    <dt>Sequence</dt><dd id="s-seq">Throw, cut, centre, arm, blow</dd>
  </dl>
  <div class="state" aria-live="polite"><span class="chip">Status <b id="status">Ready</b></span></div>

    <button type="button" id="pause" aria-pressed="false" title="Pause or resume (P)">Pause</button>
    <button type="button" id="slow" aria-pressed="false" title="Quarter speed (L)">Slow-mo</button>
    <div class="group" role="group" aria-label="View">
      <button type="button" data-view="34">¾</button>
      <button type="button" data-view="front">Front</button>
      <button type="button" data-view="close">Close</button>
      <button type="button" data-view="back" title="The other side of the wall, where the panel lands">Far side</button>
    </div>
    <button type="button" id="sway" aria-pressed="true">Orbit</button>
    <button type="button" id="sound" aria-pressed="true" title="Sounds (S)">Sound</button>
  </div>
</nav>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.7/src/index.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices, toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';

// Metres. +Y up; the wall surface is the plane z = 0 and the attacker side is +z.
// The spider's own origin (the "spider" node) is the bottom-left corner of the cut, on the wall surface;
// the cut runs up HOLE_H, across HOLE_W (+x) and back down: an upside-down U, open at the floor.

/* ------------------------------------------------------------------ helpers */

// Monotone cubic interpolation through [x, y] points (no overshoot).
function curve(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const constant = v => () => v;

// Loft a superellipse cross-section along X. top/bot/hw/n are functions of x.
// round: radius used to roll the edges at both ends; caps are flat.
function loft({ x0, x1, top, bot, hw, n = constant(2.6), cy = null, steps = 160, seg = 72, round = 0, roundStart = round, roundEnd = round, groove = null }) {
  const xs = [];
  // denser stations near the ends so the rolled edges stay smooth
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const e = 0.5 - 0.5 * Math.cos(Math.PI * u);
    xs.push(x0 + (x1 - x0) * (0.55 * u + 0.45 * e));
  }
  const pos = [], idx = [];
  const ring = (x) => {
    let T = top(x), B = bot(x), W = hw(x);
    const ds = x - x0, de = x1 - x;
    let inset = 0;
    if (roundStart > 0 && ds < roundStart) inset = Math.max(inset, roundStart - Math.sqrt(Math.max(0, roundStart * roundStart - (roundStart - ds) ** 2)));
    if (roundEnd > 0 && de < roundEnd) inset = Math.max(inset, roundEnd - Math.sqrt(Math.max(0, roundEnd * roundEnd - (roundEnd - de) ** 2)));
    let gB = 0, gW = 0;
    if (groove) { const g = groove(x); gB = g; gW = g; }
    T -= inset; B += inset + gB; W -= inset + gW;
    // a rounding radius larger than the section must not turn the ring inside out
    W = Math.max(0.002, W);
    const c = cy ? cy(x) : (T + B) / 2, ry = Math.max(0.001, (T - B) / 2);
    const e = 2 / n(x), out = [];
    for (let j = 0; j < seg; j++) {
      const t = (j / seg) * Math.PI * 2, co = Math.cos(t), si = Math.sin(t);
      const z = W * Math.sign(co) * Math.pow(Math.abs(co), e);
      const y = c + ry * Math.sign(si) * Math.pow(Math.abs(si), e);
      out.push([x, y, z]);
    }
    return out;
  };
  const rings = xs.map(ring);
  rings.forEach(r => r.forEach(p => pos.push(...p)));
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * seg + j, b = i * seg + (j + 1) % seg, c = (i + 1) * seg + j, d = (i + 1) * seg + (j + 1) % seg;
      idx.push(a, c, b, b, c, d);
    }
  }
  // flat caps with their own vertices
  const capAt = (r, flip) => {
    const base = pos.length / 3;
    const cx = r.reduce((s, p) => s + p[1], 0) / r.length;
    pos.push(r[0][0], cx, 0);
    r.forEach(p => pos.push(...p));
    for (let j = 0; j < seg; j++) {
      const a = base + 1 + j, b = base + 1 + (j + 1) % seg;
      flip ? idx.push(base, a, b) : idx.push(base, b, a);
    }
  };
  // caps face outward: -x at the start, +x at the end
  capAt(rings[0], true);
  capAt(rings[rings.length - 1], false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Polygon with per-corner radius: pts = [[x, y, r], ...]
function roundedShape(pts, shape = new THREE.Shape()) {
  const n = pts.length;
  const P = pts.map(p => new THREE.Vector2(p[0], p[1]));
  for (let i = 0; i < n; i++) {
    const prev = P[(i - 1 + n) % n], cur = P[i], next = P[(i + 1) % n], r = pts[i][2] || 0;
    const v1 = prev.clone().sub(cur), v2 = next.clone().sub(cur);
    const l1 = v1.length(), l2 = v2.length();
    const rr = Math.min(r, l1 / 2.05, l2 / 2.05);
    const a = cur.clone().add(v1.normalize().multiplyScalar(rr));
    const b = cur.clone().add(v2.normalize().multiplyScalar(rr));
    if (i === 0) shape.moveTo(a.x, a.y); else shape.lineTo(a.x, a.y);
    if (rr > 0) shape.quadraticCurveTo(cur.x, cur.y, b.x, b.y);
  }
  shape.closePath();
  return shape;
}
function roundedPath(pts) { return roundedShape(pts, new THREE.Path()); }

// Extrude a side-profile shape (in the XY plane) across Z, centred on zc.
function slab(shape, width, { bevel = 0.04, segs = 3, zc = 0, curveSegments = 24 } = {}) {
  const depth = Math.max(0.001, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.9, bevelSegments: segs, curveSegments,
  });
  g.translate(0, 0, zc - depth / 2);
  return g;
}

// Lathe around the X axis. pts = [[x, r], ...]
function latheX(pts, seg = 64) {
  const g = new THREE.LatheGeometry(pts.map(([x, r]) => new THREE.Vector2(r, x)), seg);
  g.rotateZ(-Math.PI / 2);
  g.scale(1, 1, 1);
  // after rotateZ(-90deg) the lathe axis (y) maps to +x
  return g;
}

function clean(g) {
  g = g.index ? g.toNonIndexed() : g;
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  return g;
}
function creased(g, angle = 34) { return toCreasedNormals(clean(g), THREE.MathUtils.degToRad(angle)); }

const evaluator = new Evaluator();
evaluator.attributes = ['position', 'normal'];
evaluator.useGroups = false;
// Cutters passed together must not overlap each other (they are merged into one brush).
function subtract(base, ...cutters) {
  let a = new Brush(clean(base)); a.updateMatrixWorld();
  const cut = new Brush(mergeGeometries(cutters.map(clean))); cut.updateMatrixWorld();
  const r = evaluator.evaluate(a, cut, SUBTRACTION);
  return r.geometry;
}
// For cutters that overlap, subtract them one after another.
function subtractEach(base, ...cutters) {
  let g = base;
  for (const c of cutters) g = subtract(g, c);
  return g;
}
function box(x0, x1, y0, y1, z0, z1) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return g;
}



// Screw head with its drive recess ("inlet"). Built along +y with the underside at y = 0.
// style: 'slot' (flat blade), 'phillips' (cross), 'hex' (socket). countersunk heads sit nearly flush.
function screwHead(r, { style = 'slot', h, countersunk = false, seg = 36 } = {}) {
  if (h === undefined) h = countersunk ? r * 0.5 : r * 0.6;
  const prof = countersunk
    ? [[0, 0], [r * 0.5, 0], [r, h - 0.006], [r, h], [0, h]]
    : [[0, 0], [r, 0], [r, h * 0.45], [r * 0.86, h * 0.82], [r * 0.55, h * 0.97], [0, h]];
  let g = new THREE.LatheGeometry(prof.map(([x, y]) => new THREE.Vector2(x, y)), seg);
  // the recess a driver goes into: deep enough to grip, open across the head for a blade
  const d = Math.min(h * 0.85, r * 0.62);
  if (style === 'slot') g = subtract(g, box(-r * 1.3, r * 1.3, h - d, h + 0.2, -r * 0.17, r * 0.17));
  else if (style === 'phillips') {
    g = subtractEach(g, box(-r * 0.68, r * 0.68, h - d, h + 0.2, -r * 0.13, r * 0.13), box(-r * 0.13, r * 0.13, h - d, h + 0.2, -r * 0.68, r * 0.68));
  } else if (style === 'hex') {
    g = subtract(g, new THREE.CylinderGeometry(r * 0.5, r * 0.5, d * 2, 6).translate(0, h, 0));
  }
  return creased(g, 35);
}
// Put a screw head at pos with its axis along normal; spin turns the recess about that axis.
function placeScrew(geo, pos, normal, spin = 0) {
  geo.applyMatrix4(new THREE.Matrix4().makeRotationY(spin));
  geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal.clone().normalize()));
  geo.translate(pos.x, pos.y, pos.z);
  return geo;
}


const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const smooth = (t) => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => ease(clamp01((t - a) / (b - a)));
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ------------------------------------------------------------------ materials */

const NOISE = /* glsl */`
varying vec3 vObjPos;
uniform float uGrain, uColorVar, uRoughVar, uWood;
uniform vec3 uWoodDark;
float h3(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x), mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x), f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x), mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x), f.y), f.z);
}
float fbm3(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + 1.7; a *= 0.5; } return s; }
// fw = pixel footprint in noise cells at the first octave; octaves near or below a pixel fade to their mean
float fbmAA(vec3 p, float fw){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*mix(vnoise(p), 0.5, smoothstep(0.3, 1.0, fw)); p = p*2.03 + 1.7; a *= 0.5; fw *= 2.03; } return s; }
`;

// Physical material with object-space grain (colour mottling + roughness breakup); wood adds
// laminate figure running along the stock.
function surface(params, noise = {}) {
  const m = new THREE.MeshPhysicalMaterial(params);
  const u = {
    uGrain: { value: noise.grain ?? 6 },
    uColorVar: { value: noise.colorVar ?? 0.06 },
    uRoughVar: { value: noise.roughVar ?? 0.08 },
    uWood: { value: noise.wood ? 1 : 0 },
    uWoodDark: { value: new THREE.Color(noise.woodDark ?? '#3a1a0c') },
  };
  m.userData.u = u;
  m.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, u);
    s.vertexShader = 'varying vec3 vObjPos;\n' + s.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vObjPos = position;');
    s.fragmentShader = NOISE + s.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        float n1 = fbmAA(vObjPos * uGrain, length(fwidth(vObjPos * uGrain)));
        if (uWood > 0.5) {
          float warp = fbm3(vObjPos * vec3(0.08, 0.7, 0.7));

let actx = null, soundOn = true, mixSrc = null;
const sfx = {};
function audioInit() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC();
  for (const [k, uri] of Object.entries(SOUND_DATA)) {
    const bin = atob(uri.split(',')[1]), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    actx.decodeAudioData(buf.buffer).then(b => { sfx[k] = b; }).catch(() => { });
  }
}
function unlockAudio() { audioInit(); if (actx && actx.state !== 'running' && !paused) actx.resume().catch(() => { }); }
function stopMix() { if (mixSrc) { try { mixSrc.stop(); } catch (e) { } mixSrc = null; } }
function playMix(name, offset) {
  stopMix();
  if (!soundOn || !actx || actx.state !== 'running' || !sfx[name]) return;
  const src = actx.createBufferSource(), g = actx.createGain();
  src.buffer = sfx[name]; src.playbackRate.value = slow ? 0.25 : 1; g.gain.value = 0.95; src.connect(g).connect(actx.destination);
  src.start(actx.currentTime, Math.max(0, Math.min(offset, src.buffer.duration - 0.01))); mixSrc = src;
}

function playOne(name) {
  if (!soundOn || !actx || actx.state !== 'running' || !sfx[name]) return;
  const src = actx.createBufferSource(), g = actx.createGain(); src.buffer = sfx[name]; src.playbackRate.value = slow ? 0.25 : 1; g.gain.value = 0.8;
  src.connect(g).connect(actx.destination); src.start();
}

/* ------------------------------------------------------------------ views and UI */

const controls2 = controls;
function viewFor(name) {
  const asp = camera.aspect, kk = asp < 1.1 ? 1.35 / Math.max(asp, 0.45) : 1;
  const T = { '34': [V3(2.9, 1.7, 4.3), V3(0, 1.0, 0)], front: [V3(0, 1.1, 5.2), V3(0, 1.0, 0)], close: [V3(HOLE_X0 - 0.6, 0.7, 1.5), V3(HOLE_X0 + 0.05, 0.5, 0)], back: [V3(-1.6, 1.7, -4.2), V3(0, 0.9, -0.6)] }[name];
  const pos = T[1].clone().add(T[0].clone().sub(T[1]).multiplyScalar(kk));
  return { pos, target: T[1] };
}
let camTween = null;
function goView(name, instant = false) {
  const v = viewFor(name), back = name === 'back';
  swayT = 0; camTween = null;
  if (back !== (side === 'back')) instant = true;
  side = back ? 'back' : 'front';
  controls.minAzimuthAngle = back ? Math.PI - 1.4 : -1.4; controls.maxAzimuthAngle = back ? -(Math.PI - 1.4) : 1.4;
  if (back && swayOn) { swayOn = false; $('sway').setAttribute('aria-pressed', 'false'); }
  if (instant) { camera.position.copy(v.pos); controls.target.copy(v.target); controls.update(); return; }
  camTween = { from: camera.position.clone(), fromT: controls.target.clone(), to: v.pos, tt: v.target, t: 0 };
}
function setPaused(v) { paused = v; $('pause').setAttribute('aria-pressed', String(v)); $('pause').textContent = v ? 'Resume' : 'Pause'; if (actx) (v ? actx.suspend() : actx.resume()).catch(() => { }); }
function go() {
  autoStart = -1;
  if (paused) setPaused(false);
  if (running) return;
  if (tau > 0) { tau = 0; stopMix(); apply(); return; }   // reset the wall and the spider
  running = true; tau = 1e-4; playThrow = true;
}
let playThrow = false;
$('go').addEventListener('click', go);
$('pause').addEventListener('click', () => setPaused(!paused));
$('slow').addEventListener('click', () => { slow = !slow; $('slow').setAttribute('aria-pressed', String(slow)); if (mixSrc) mixSrc.playbackRate.value = slow ? 0.25 : 1; });
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => goView(b.dataset.view)));
$('sound').addEventListener('click', () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', String(soundOn)); if (soundOn) unlockAudio(); else stopMix(); });
$('sway').addEventListener('click', () => { swayOn = !swayOn; $('sway').setAttribute('aria-pressed', String(swayOn)); if (swayOn && side === 'back') goView('34'); });
window.addEventListener('pointerdown', unlockAudio, { capture: true });
controls.addEventListener('start', () => { if (swayOn) { swayOn = false; $('sway').setAttribute('aria-pressed', 'false'); } camTween = null; });
window.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'b' || k === ' ') e.preventDefault();
  if (e.repeat) return;
  unlockAudio();
  if (k === 'b' || k === ' ') go();
  if (k === 'p') setPaused(!paused);
  if (k === 's') $('sound').click();
  if (k === 'l') $('slow').click();
});
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize);

/* ------------------------------------------------------------------ export */

function toBase64(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
// Sample the spider (and its fx nodes) into clips. The test wall, fragments and particles are viewer-only.
function sampleClip(N, fx, name, phase, len) {
  const fps = 30, n = Math.round(len * fps), list = [[N.body, ['position', 'quaternion']], [N.turret, ['quaternion']], [fx.beamNode, ['position', 'quaternion', 'scale']], [fx.hit, ['position']]];
  for (const L of N.legs) list.push([L.coxa, ['quaternion']], [L.femur, ['quaternion']], [L.tibia, ['quaternion']]);
  for (const c of fx.cutSegs) list.push([c.node, ['scale']]);
  const data = list.map(() => ({})), times = [];
  for (let i = 0; i <= n; i++) {
    const t = Math.min(len, i / fps); times.push(t);
    pose(N, phase, t); poseFx(N, fx);
    list.forEach(([o, props], j) => { for (const p of props) (data[j][p] = data[j][p] || []).push(...o[p].toArray()); });
  }
  const tracks = [];
  list.forEach(([o, props], j) => { for (const p of props) tracks.push(new (p === 'quaternion' ? THREE.QuaternionKeyframeTrack : THREE.VectorKeyframeTrack)(`${o.name}.${p}`, times, data[j][p])); });
  return new THREE.AnimationClip(name, len, tracks);
}
function exportScenes() {
  const N = buildSpider(), fx = buildFx(N.root);
  MAT.led.emissiveIntensity = 2.6; MAT.charge.emissiveIntensity = 0.25;
  const deploy = sampleClip(N, fx, 'deploy', 'deploy', T_DEPLOY);
  const breach = sampleClip(N, fx, 'breach', 'breach', T_BREACH);
  pose(N, 'breach', 0); poseFx(N, fx);   // rest pose: standing at the start, lance off
  N.root.updateMatrixWorld(true);
  return [{ file: 'breach-spider.glb', root: N.root, animations: [deploy, breach] }];
}
async function exportGLB() {
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  const exporter = new GLTFExporter(), out = [];
  for (const s of exportScenes()) {
    const buf = await exporter.parseAsync(s.root, { binary: true, animations: s.animations });
    out.push({ file: s.file, bytes: buf.byteLength, base64: toBase64(buf) });
  }
  apply();
  return out;
}
// timeline of events for the sound track and the fx package (times from the start of 'deploy')
function cues() {
  const ev = [{ t: 0, e: 'land' }, { t: 0.05, e: 'unfold_start' }, { t: T_DEPLOY, e: 'unfold_end' }];
  const B = T_DEPLOY, steps = [];
  for (const L of LEGS) {
    const ph = L.group * 0.5;
    for (let k = 0; k < 400; k++) {
      const dk = (k - ph) * STRIDE - G0, dTouch = dk + SWING * STRIDE;
      if (dk < 0) continue; if (dTouch > PLAN.D + 1e-6) break;
      steps.push({ t: +(B + dToT(dTouch)).toFixed(3), e: 'step', leg: L.id });
    }
  }
  steps.sort((a, b) => a.t - b.t); ev.push(...steps);
  for (const s of PLAN.segs) {
    ev.push({ t: +(B + s.t0).toFixed(3), e: 'seg_' + s.kind, laser: s.laser, dur: +s.dur.toFixed(3) });
  }
  const arm = PLAN.segs.find(s => s.kind === 'arm');
  for (let k = 0, t = 0; t < arm.dur; k++) { ev.push({ t: +(B + arm.t0 + t).toFixed(3), e: 'beep' }); t += Math.max(0.07, 0.32 * Math.pow(0.78, k)); }
  ev.push({ t: +(B + T_BREACH).toFixed(3), e: 'detonate' });
  ev.sort((a, b) => a.t - b.t);
  const on = PLAN.segs.filter(s => s.laser);
  return { deploy_s: T_DEPLOY, breach_s: +T_BREACH.toFixed(3), laser_on: +(B + on[0].t0).toFixed(3), laser_off: +(B + on[on.length - 1].t1).toFixed(3), detonate: +(B + T_BREACH).toFixed(3), events: ev };
}
function preview() {
  setLoop(false);
  document.querySelectorAll('.plate, .bar, .hint').forEach(e => { e.hidden = true; });
  tau = TAU_BR + 1.25; apply();
  swayOn = false; goView('34', true);
  camera.position.set(HOLE_X0 + 1.05, 1.0, 1.35); controls.target.set(HOLE_X0 + 0.08, 0.62, 0); controls.update();

window.__model = { id: 'breach-spider', exportScenes, exportGLB, preview, cues };

/* ------------------------------------------------------------------ go */

goView('34', true);
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
tau = reduce ? TAU_BR + 2.6 : 0; apply();
$('loading').hidden = true;
let autoStart = reduce ? -1 : 1.0;
const clock = new THREE.Clock();
let looping = false;
function setLoop(on) { looping = on; renderer.setAnimationLoop(on ? loop : null); }
function tick(dt) {

    tau += dt * (slow ? 0.25 : 1);

    if (tau >= TAU_END) { tau = TAU_END; running = false; }

  }

    if (camTween.t >= 1) camTween = null;
  } else if (swayOn) {
    swayT += dt; const v = viewFor('34'), base = v.pos.clone().sub(v.target);
    const r = Math.hypot(base.x, base.z), a = Math.atan2(base.x, base.z) + 0.35 * Math.sin(swayT * 0.2);
    camera.position.set(v.target.x + Math.sin(a) * r, v.target.y + base.y, v.target.z + Math.cos(a) * r); controls.target.copy(v.target);
  }

  const b = tau - TAU_DET; if (b > 0 && b < 0.5) { const s = 0.02 * Math.exp(-b / 0.12); camera.position.x += (Math.random() - 0.5) * s; camera.position.y += (Math.random() - 0.5) * s; }
}
function loop() { const dt = Math.min(clock.getDelta(), 1 / 30); tick(dt); controls.update(); composer.render(dt); }
setLoop(true);
window.__model.ready = true;
window.__model.debug = {
  tick, stop: () => setLoop(false), renderOnce: () => { controls.update(); composer.render(); },
  setTau: (v) => { tau = v; running = false; apply(); }, T: { TAU_DEP, TAU_BR, TAU_DET, TAU_END, T_BREACH }, apply, go, goView,
  camera, controls, scene, renderer, MAT, spider, PLAN, setSway: (v) => { swayOn = v; }, setSpin: (v) => { swayOn = v; }, pivot: { rotation: {} },
};
