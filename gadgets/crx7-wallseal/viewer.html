<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices, toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';

// Everything is in metres. +Y up, the wall surface is the plane z = 0 and the unit faces +Z.
// Origin: bottom centre of the reinforced area, on the wall surface.

/* ------------------------------------------------------------------ helpers */

// Monotone cubic interpolation through [x, y] points (no overshoot).
function curve(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const constant = v => () => v;

// Loft a superellipse cross-section along X. top/bot/hw/n are functions of x.
// round: radius used to roll the edges at both ends; caps are flat.
function loft({ x0, x1, top, bot, hw, n = constant(2.6), cy = null, steps = 160, seg = 72, round = 0, roundStart = round, roundEnd = round, groove = null }) {
  const xs = [];
  // denser stations near the ends so the rolled edges stay smooth
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const e = 0.5 - 0.5 * Math.cos(Math.PI * u);
    xs.push(x0 + (x1 - x0) * (0.55 * u + 0.45 * e));
  }
  const pos = [], idx = [];
  const ring = (x) => {
    let T = top(x), B = bot(x), W = hw(x);
    const ds = x - x0, de = x1 - x;
    let inset = 0;
    if (roundStart > 0 && ds < roundStart) inset = Math.max(inset, roundStart - Math.sqrt(Math.max(0, roundStart * roundStart - (roundStart - ds) ** 2)));
    if (roundEnd > 0 && de < roundEnd) inset = Math.max(inset, roundEnd - Math.sqrt(Math.max(0, roundEnd * roundEnd - (roundEnd - de) ** 2)));
    let gB = 0, gW = 0;
    if (groove) { const g = groove(x); gB = g; gW = g; }
    T -= inset; B += inset + gB; W -= inset + gW;
    // a rounding radius larger than the section must not turn the ring inside out
    W = Math.max(0.002, W);
    const c = cy ? cy(x) : (T + B) / 2, ry = Math.max(0.001, (T - B) / 2);
    const e = 2 / n(x), out = [];
    for (let j = 0; j < seg; j++) {
      const t = (j / seg) * Math.PI * 2, co = Math.cos(t), si = Math.sin(t);
      const z = W * Math.sign(co) * Math.pow(Math.abs(co), e);
      const y = c + ry * Math.sign(si) * Math.pow(Math.abs(si), e);
      out.push([x, y, z]);
    }
    return out;
  };
  const rings = xs.map(ring);
  rings.forEach(r => r.forEach(p => pos.push(...p)));
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * seg + j, b = i * seg + (j + 1) % seg, c = (i + 1) * seg + j, d = (i + 1) * seg + (j + 1) % seg;
      idx.push(a, c, b, b, c, d);
    }
  }
  // flat caps with their own vertices
  const capAt = (r, flip) => {
    const base = pos.length / 3;
    const cx = r.reduce((s, p) => s + p[1], 0) / r.length;
    pos.push(r[0][0], cx, 0);
    r.forEach(p => pos.push(...p));
    for (let j = 0; j < seg; j++) {
      const a = base + 1 + j, b = base + 1 + (j + 1) % seg;
      flip ? idx.push(base, a, b) : idx.push(base, b, a);
    }
  };
  // caps face outward: -x at the start, +x at the end
  capAt(rings[0], true);
  capAt(rings[rings.length - 1], false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Polygon with per-corner radius: pts = [[x, y, r], ...]
function roundedShape(pts, shape = new THREE.Shape()) {
  const n = pts.length;
  const P = pts.map(p => new THREE.Vector2(p[0], p[1]));
  for (let i = 0; i < n; i++) {
    const prev = P[(i - 1 + n) % n], cur = P[i], next = P[(i + 1) % n], r = pts[i][2] || 0;
    const v1 = prev.clone().sub(cur), v2 = next.clone().sub(cur);
    const l1 = v1.length(), l2 = v2.length();
    const rr = Math.min(r, l1 / 2.05, l2 / 2.05);
    const a = cur.clone().add(v1.normalize().multiplyScalar(rr));
    const b = cur.clone().add(v2.normalize().multiplyScalar(rr));
    if (i === 0) shape.moveTo(a.x, a.y); else shape.lineTo(a.x, a.y);
    if (rr > 0) shape.quadraticCurveTo(cur.x, cur.y, b.x, b.y);
  }
  shape.closePath();
  return shape;
}
function roundedPath(pts) { return roundedShape(pts, new THREE.Path()); }

// Extrude a side-profile shape (in the XY plane) across Z, centred on zc.
function slab(shape, width, { bevel = 0.04, segs = 3, zc = 0, curveSegments = 24 } = {}) {
  const depth = Math.max(0.001, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.9, bevelSegments: segs, curveSegments,
  });
  g.translate(0, 0, zc - depth / 2);
  return g;
}

// Lathe around the X axis. pts = [[x, r], ...]
function latheX(pts, seg = 64) {
  const g = new THREE.LatheGeometry(pts.map(([x, r]) => new THREE.Vector2(r, x)), seg);
  g.rotateZ(-Math.PI / 2);
  g.scale(1, 1, 1);
  // after rotateZ(-90deg) the lathe axis (y) maps to +x
  return g;
}

function clean(g) {
  g = g.index ? g.toNonIndexed() : g;
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  return g;
}
function creased(g, angle = 34) { return toCreasedNormals(clean(g), THREE.MathUtils.degToRad(angle)); }

const evaluator = new Evaluator();
evaluator.attributes = ['position', 'normal'];
evaluator.useGroups = false;
// Cutters passed together must not overlap each other (they are merged into one brush).
function subtract(base, ...cutters) {
  let a = new Brush(clean(base)); a.updateMatrixWorld();
  const cut = new Brush(mergeGeometries(cutters.map(clean))); cut.updateMatrixWorld();
  const r = evaluator.evaluate(a, cut, SUBTRACTION);
  return r.geometry;
}
// For cutters that overlap, subtract them one after another.
function subtractEach(base, ...cutters) {
  let g = base;
  for (const c of cutters) g = subtract(g, c);
  return g;
}
function box(x0, x1, y0, y1, z0, z1) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return g;
}



// Screw head with its drive recess ("inlet"). Built along +y with the underside at y = 0.
// style: 'slot' (flat blade), 'phillips' (cross), 'hex' (socket). countersunk heads sit nearly flush.
function screwHead(r, { style = 'slot', h, countersunk = false, seg = 36 } = {}) {
  if (h === undefined) h = countersunk ? r * 0.5 : r * 0.6;
  const prof = countersunk
    ? [[0, 0], [r * 0.5, 0], [r, h - 0.006], [r, h], [0, h]]
    : [[0, 0], [r, 0], [r, h * 0.45], [r * 0.86, h * 0.82], [r * 0.55, h * 0.97], [0, h]];
  let g = new THREE.LatheGeometry(prof.map(([x, y]) => new THREE.Vector2(x, y)), seg);
  // the recess a driver goes into: deep enough to grip, open across the head for a blade
  const d = Math.min(h * 0.85, r * 0.62);
  if (style === 'slot') g = subtract(g, box(-r * 1.3, r * 1.3, h - d, h + 0.2, -r * 0.17, r * 0.17));
  else if (style === 'phillips') {
    g = subtractEach(g, box(-r * 0.68, r * 0.68, h - d, h + 0.2, -r * 0.13, r * 0.13), box(-r * 0.13, r * 0.13, h - d, h + 0.2, -r * 0.68, r * 0.68));
  } else if (style === 'hex') {
    g = subtract(g, new THREE.CylinderGeometry(r * 0.5, r * 0.5, d * 2, 6).translate(0, h, 0));
  }
  return creased(g, 35);
}
// Put a screw head at pos with its axis along normal; spin turns the recess about that axis.
function placeScrew(geo, pos, normal, spin = 0) {
  geo.applyMatrix4(new THREE.Matrix4().makeRotationY(spin));
  geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal.clone().normalize()));
  geo.translate(pos.x, pos.y, pos.z);
  return geo;
}


// Extrude a section drawn in (x, z) along +Y between y0 and y1.
function extrudeY(pts, y0, y1, bevel = 0) {
  const depth = Math.max(0.001, y1 - y0 - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(roundedShape(pts), { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.9, bevelSegments: 1, curveSegments: 3 });
  g.rotateX(Math.PI / 2);                 // shape y -> world z, extrusion -> world -y
  g.translate(0, y1 - bevel, 0);
  return g;
}
// Extrude a section drawn in (z, y) along +X between x0 and x1.
function extrudeX(pts, x0, x1, bevel = 0) {
  const depth = Math.max(0.001, x1 - x0 - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(roundedShape(pts.map(([z, y, r]) => [-z, y, r])), { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.9, bevelSegments: 1, curveSegments: 3 });
  g.rotateY(Math.PI / 2);                 // local z -> world x, local x (= -z) -> world z
  g.translate(x0 + bevel, 0, 0);
  return g;
}
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => ease(clamp01((t - a) / (b - a)));

/* ------------------------------------------------------------------ materials */

const NOISE = /* glsl */`
varying vec3 vObjPos;
uniform float uGrain, uColorVar, uRoughVar, uWood;
uniform vec3 uWoodDark;
float h3(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x), mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x), f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x), mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x), f.y), f.z);
}
float fbm3(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + 1.7; a *= 0.5; } return s; }
// fw = pixel footprint in noise cells at the first octave; octaves near or below a pixel fade to their mean
float fbmAA(vec3 p, float fw){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*mix(vnoise(p), 0.5, smoothstep(0.3, 1.0, fw)); p = p*2.03 + 1.7; a *= 0.5; fw *= 2.03; } return s; }
`;

// Physical material with object-space grain (colour mottling + roughness breakup); wood adds
// laminate figure running along the stock.
function surface(params, noise = {}) {
  const m = new THREE.MeshPhysicalMaterial(params);
  const u = {
    uGrain: { value: noise.grain ?? 6 },
    uColorVar: { value: noise.colorVar ?? 0.06 },
    uRoughVar: { value: noise.roughVar ?? 0.08 },
    uWood: { value: noise.wood ? 1 : 0 },
    uWoodDark: { value: new THREE.Color(noise.woodDark ?? '#3a1a0c') },
  };
  m.userData.u = u;
  m.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, u);
    s.vertexShader = 'varying vec3 vObjPos;\n' + s.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vObjPos = position;');
    s.fragmentShader = NOISE + s.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        float n1 = fbmAA(vObjPos * uGrain, length(fwidth(vObjPos * uGrain)));
        if (uWood > 0.5) {
          float warp = fbm3(vObjPos * vec3(0.08, 0.7, 0.7));
          float lines = fbm3(vec3(vObjPos.x * 0.12, vObjPos.y * 11.0 + warp * 4.0, vObjPos.z * 11.0));
          float bands = 0.5 + 0.5 * sin((vObjPos.y * 1.6 + vObjPos.z * 0.6 + warp * 5.0 + lines * 1.6) * 6.2831);
          float t = smoothstep(0.35, 1.0, bands * 0.45 + lines * 0.6);
          diffuseColor.rgb = mix(diffuseColor.rgb, uWoodDark, t * 0.6);
        }
        diffuseColor.rgb *= 1.0 + uColorVar * (n1 - 0.5) * 2.0;`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = clamp(roughnessFactor + uRoughVar * (fbmAA(vObjPos * uGrain * 3.7 + 7.1, length(fwidth(vObjPos * uGrain * 3.7))) - 0.5) * 2.0, 0.04, 1.0);`);
  };
  m.customProgramCacheKey = () => 'grain-wood-v2';
  return m;
}



// Crystalix mark: a diamond with a lightning stroke through it, drawn in a unit box centred on (cx, cy).
function drawMark(ctx, cx, cy, s, color, glow) {
  ctx.save();

  ctx.beginPath(); ctx.moveTo(-0.12, -0.92); ctx.lineTo(-0.92, 0); ctx.lineTo(-0.12, 0.92); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.12, -0.92); ctx.lineTo(0.92, 0); ctx.lineTo(0.12, 0.92); ctx.stroke();
  ctx.lineWidth = 0.1;
  ctx.beginPath(); ctx.moveTo(0.18, -0.62); ctx.lineTo(-0.3, 0.06); ctx.lineTo(0.3, -0.06); ctx.lineTo(-0.18, 0.62); ctx.stroke();
  ctx.restore();
}

// touch-screen arming: the operator traces a pattern, then the screen confirms
const PATTERN = [0, 4, 8, 5, 2];
function drawTouch(p) {
  const c = screenCanvas.getContext('2d'), w = c.canvas.width, h = c.canvas.height;
  c.fillStyle = '#06040c'; c.fillRect(0, 0, w, h);
  c.strokeStyle = 'rgba(150,110,255,0.55)'; c.lineWidth = 2; c.strokeRect(10, 10, w - 20, h - 20);
  const done = p > 0.82, col = done ? '#c6ffd9' : '#a77bff';
  c.textAlign = 'center'; c.fillStyle = done ? '#c6ffd9' : '#b48cff'; c.font = '500 15px "Chivo Mono", monospace';
  c.fillText(done ? 'CONFIRMED' : 'ARM SEQUENCE', w / 2, 44);
  const gx = (i) => w / 2 + ((i % 3) - 1) * 62, gy = (i) => 152 + (Math.floor(i / 3) - 1) * 62;
  const q = clamp01(p / 0.8) * (PATTERN.length - 1);
  c.save(); c.strokeStyle = col; c.lineWidth = 6; c.lineCap = 'round'; c.lineJoin = 'round'; c.shadowColor = col; c.shadowBlur = 12;
  c.beginPath(); c.moveTo(gx(PATTERN[0]), gy(PATTERN[0]));
  for (let k = 1; k < PATTERN.length; k++) {
    const f = clamp01(q - (k - 1)); if (f <= 0) break;
    const a = PATTERN[k - 1], b = PATTERN[k];
    c.lineTo(lerp(gx(a), gx(b), f), lerp(gy(a), gy(b), f));
  }
  c.stroke(); c.restore();
  for (let i = 0; i < 9; i++) {
    const j = PATTERN.indexOf(i), hit = j >= 0 && j <= q + 1e-6;
    c.fillStyle = hit ? (done ? '#c6ffd9' : '#e2d6ff') : 'rgba(150,110,255,0.35)';
    c.beginPath(); c.arc(gx(i), gy(i), hit ? 11 : 8, 0, Math.PI * 2); c.fill();
  }
  if (!done) {
    const k = Math.min(PATTERN.length - 2, Math.floor(q)), f = q - k;
    const x = lerp(gx(PATTERN[k]), gx(PATTERN[k + 1]), f), y = lerp(gy(PATTERN[k]), gy(PATTERN[k + 1]), f);
    c.strokeStyle = 'rgba(226,214,255,0.85)'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 17 + 5 * Math.sin(p * 40), 0, Math.PI * 2); c.stroke();
  }
  c.font = '600 24px "Chakra Petch", "Arial Narrow", sans-serif'; c.fillStyle = '#d9c8ff'; c.fillText('CRX-7', w / 2, h - 44);
  screenTex.needsUpdate = true;
}

// One armor panel, built around its own centre with the back face at z = 0.
function panelParts(pw, ph) {
  const c = 0.018, m = 0.05;
  const base = slab(roundedShape([[-pw / 2, -ph / 2, c], [pw / 2, -ph / 2, c], [pw / 2, ph / 2, c], [-pw / 2, ph / 2, c]]), PT, { bevel: 0.005, segs: 1, zc: PT / 2, curveSegments: 2 });
  const face = slab(roundedShape([[-pw / 2 + m, -ph / 2 + m, 0.035], [pw / 2 - m, -ph / 2 + m, 0.008], [pw / 2 - m, ph / 2 - m, 0.035], [-pw / 2 + m, ph / 2 - m, 0.008]]), 0.014, { bevel: 0.004, segs: 1, zc: PT + 0.003, curveSegments: 2 });
  // shallow cross groove splits the face into four plates
  const grooves = [box(-pw, pw, -0.004, 0.004, PT + 0.006, PT + 0.03), box(-0.004, 0.004, -ph, ph, PT + 0.006, PT + 0.03)];
  const faceCut = subtract(face, ...grooves.slice(0, 1));
  const face2 = subtract(faceCut, grooves[1]);
  const k = 0.026, bolts = [];
  for (const [x, y] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) bolts.push(hexScrew(0.0105, V3(x * (pw / 2 - k), y * (ph / 2 - k), PT - 0.001), V3(0, 0, 1), 0.2 + x * 0.3 + y * 0.5));
  return {
    plate: creased(base, 30),
    face: creased(face2, 30),
    bolts: mergeGeometries(bolts.map(clean)),

}

// A vertical telescoping column: a sleeve fixed to the core and `n` nested stages per side.
// Returns the column group (origin at the core centre height) and the animated stages.
function buildColumn(name, parent, { w, d, sleeveH, topY, botY, clamps, side }) {
  const col = node(name, parent);
  const sleeve = mergeGeometries([
    extrudeY([[-w / 2, 0.006, 0], [w / 2, 0.006, 0], [w / 2, d, 0.012], [-w / 2, d, 0.012]], -sleeveH / 2, sleeveH / 2, 0.004),
    // end collars
    ...[-1, 1].map(s => extrudeY([[-w / 2 - 0.007, 0.004, 0], [w / 2 + 0.007, 0.004, 0], [w / 2 + 0.007, d + 0.005, 0.01], [-w / 2 - 0.007, d + 0.005, 0.01]], s * sleeveH / 2 - (s > 0 ? 0.045 : 0), s * sleeveH / 2 + (s < 0 ? 0.045 : 0), 0.003)),
  ].map(clean));
  col.add(mesh(creased(sleeve, 30), MAT.frame, name + '_sleeve'));
  const cb = [];
  for (const s of [-1, 1]) for (const sx of [-1, 1]) cb.push(hexScrew(0.008, V3(sx * w * 0.27, s * (sleeveH / 2 - 0.0225), d + 0.005), V3(0, 0, 1), 0.4));
  col.add(mesh(mergeGeometries(cb.map(clean)), MAT.bolt, name + '_sleeve_bolts'));
  col.add(mesh(ledBar(0.012, sleeveH - 0.14, 0.003, 0, 0, d), MAT.led, name + '_sleeve_led', { cast: false }));
  const stages = [];
  for (const [dir, endY] of [[1, topY], [-1, botY]]) {
    const span = Math.abs(endY) - sleeveH / 2;
    const n = Math.max(1, Math.ceil(span / (sleeveH - 0.06)));
    const step = span / n, ov = 0.05, L = step + ov;
    for (let i = 1; i <= n; i++) {
      const wi = w - 0.012 * i, di = d - 0.008 * i;
      const st = node(`${name}_${dir > 0 ? 'upper' : 'lower'}_${i}`, col);
      const g = extrudeY([[-wi / 2, 0.012, 0], [wi / 2, 0.012, 0], [wi / 2, di, 0.01], [-wi / 2, di, 0.01]], -L / 2, L / 2, 0.003);
      st.add(mesh(creased(g, 30), MAT.frame, st.name + '_tube'));
      // rack teeth along the front: the drive pinion in the core walks these
      const teeth = [];
      for (let y = -L / 2 + 0.04; y < L / 2 - 0.03; y += 0.05) teeth.push(box(-wi * 0.32, -wi * 0.12, y, y + 0.02, di, di + 0.004), box(wi * 0.12, wi * 0.32, y, y + 0.02, di, di + 0.004));
      st.add(mesh(mergeGeometries(teeth.map(clean)), MAT.dark, st.name + '_rack'));
      st.add(mesh(ledBar(0.008, L - 0.1, 0.003, 0, 0, di), MAT.led, st.name + '_led', { cast: false }));
      const deployed = dir * (sleeveH / 2 + (i - 0.5) * step);
      stages.push({ node: st, deployed, stowed: 0, i, n, dir });
      // the outermost stage carries the locking clamp
      if (i === n && clamps) {
        const end = dir * L / 2;
        const cl = node(`${name}_clamp_${dir > 0 ? 'top' : 'bottom'}`, st);
        const bw = wi + 0.05, bh = 0.09;
        const bracket = slab(roundedShape([[-bw / 2, -bh / 2, 0.012], [bw / 2, -bh / 2, 0.012], [bw / 2, bh / 2, 0.012], [-bw / 2, bh / 2, 0.012]]), di + 0.006, { bevel: 0.006, segs: 1, zc: (di + 0.006) / 2 + 0.003 });
        bracket.translate(0, end - dir * bh / 2, 0);
        cl.add(mesh(creased(bracket, 30), MAT.dark, cl.name + '_bracket'));
        const bb = [-1, 1].map(sx => hexScrew(0.0085, V3(sx * bw * 0.3, end - dir * bh / 2, di + 0.009), V3(0, 0, 1), 0.7 + sx));
        cl.add(mesh(mergeGeometries(bb.map(clean)), MAT.bolt, cl.name + '_bolts'));
        // jaw: hinged on the bracket's outer face; folded along the rail, it swings out 90 degrees into the wall frame
        const jaw = node(`${name}_jaw_${dir > 0 ? 'top' : 'bottom'}`, cl);
        jaw.position.set(side * (bw / 2 - 0.006), end - dir * bh / 2, 0);
        const jp = [[0, -0.02, 0.004], [0.13, -0.02, 0.006], [0.155, -0.002, 0.004], [0.155, 0.032, 0.004], [0.125, 0.032, 0.004], [0.125, 0.012, 0.002], [0, 0.02, 0.004]];
        const jg = slab(roundedShape(jp.map(([x, y, r]) => [side * x, dir * y, r])), 0.05, { bevel: 0.005, segs: 1, zc: di * 0.5 });
        jaw.add(mesh(creased(jg, 30), MAT.dark, jaw.name + '_hook'));
        const pivot = new THREE.CylinderGeometry(0.017, 0.017, 0.066, 18); pivot.rotateX(Math.PI / 2); pivot.translate(0, 0, di * 0.5);
        jaw.add(mesh(pivot, MAT.bolt, jaw.name + '_pin'));
        jaw.add(mesh(ledBar(0.05, 0.006, 0.003, side * 0.07, dir * 0.0, di * 0.5 + 0.025), MAT.led, jaw.name + '_led', { cast: false }));
        stages[stages.length - 1].jaw = { node: jaw, folded: -side * dir * Math.PI / 2 };
      }
    }
  }
  return { col, stages };
}

// X-shaped star anchor plate for the far face of the wall; the face shows toward -z.
function starParts() {
  const P = [], R = 0.125, rIn = 0.034, tipHW = 0.015;
  for (let k = 0; k < 4; k++) {
    const a = Math.PI / 4 + k * Math.PI / 2, ux = Math.cos(a), uy = Math.sin(a), vx = -uy, vy = ux, b = a + Math.PI / 4;
    P.push([R * ux - tipHW * vx, R * uy - tipHW * vy, 0.004], [R * ux + tipHW * vx, R * uy + tipHW * vy, 0.004], [rIn * Math.cos(b), rIn * Math.sin(b), 0.012]);
  }
  const plate = slab(roundedShape(P), 0.014, { bevel: 0.004, segs: 1, zc: -0.007, curveSegments: 3 });
  const boss = new THREE.CylinderGeometry(0.045, 0.05, 0.01, 32); boss.rotateX(Math.PI / 2); boss.translate(0, 0, -0.019);
  const nut = new THREE.CylinderGeometry(0.03, 0.03, 0.022, 6); nut.rotateX(Math.PI / 2); nut.translate(0, 0, -0.035);
  const tip = placeScrew(screwHead(0.014, { style: 'hex', h: 0.012, seg: 20 }), V3(0, 0, -0.046), V3(0, 0, -1), 0.3);
  return { plate: creased(mergeGeometries([plate, boss].map(clean)), 30), nut: creased(mergeGeometries([nut, tip].map(clean)), 30) };
}

function buildModel(key) {
  const P = SIZES[key], { H, W, rows, cols } = P;

  const sleeveH = coreH - 0.1;

  /* core unit: housing, control panel, lever, handles */
  const core = node('core', root); core.position.set(0, coreY, 0);

    const cw = coreW, ch = coreH;
    const housing = slab(roundedShape([[-cw / 2, -ch / 2, 0.05], [cw / 2, -ch / 2, 0.05], [cw / 2, ch / 2, 0.05], [-cw / 2, ch / 2, 0.05]]), 0.22, { bevel: 0.014, segs: 2, zc: 0.12 });
    // vents along the bottom of the face

    core.add(mesh(creased(subtract(housing, ...vents), 30), MAT.housing, 'core_housing'));
    // raised bezel carrying the screen and controls
    const bz = slab(roundedShape([[-cw / 2 + 0.06, -ch / 2 + 0.085, 0.03], [cw / 2 - 0.06, -ch / 2 + 0.085, 0.03], [cw / 2 - 0.06, ch / 2 - 0.05, 0.03], [-cw / 2 + 0.06, ch / 2 - 0.05, 0.03]]), 0.014, { bevel: 0.004, segs: 1, zc: 0.236 });
    const screenHole = box(-0.105, 0.105, ch / 2 - 0.33, ch / 2 - 0.08, 0.235, 0.26);
    core.add(mesh(creased(subtract(bz, screenHole), 30), MAT.plate, 'core_bezel'));
    // screen recessed in the bezel
    const sw = 0.2, sh = 0.24, sy = ch / 2 - 0.205;
    const scr = new THREE.PlaneGeometry(sw, sh); scr.translate(0, sy, 0.236);
    core.add(mesh(scr, MAT.screen, 'control_screen', { cast: false }));
    const frame = [box(-0.11, 0.11, sy + sh / 2, sy + sh / 2 + 0.008, 0.228, 0.247), box(-0.11, 0.11, sy - sh / 2 - 0.008, sy - sh / 2, 0.228, 0.247),
      box(-0.11, -0.1, sy - sh / 2, sy + sh / 2, 0.228, 0.247), box(0.1, 0.11, sy - sh / 2, sy + sh / 2, 0.228, 0.247)];
    core.add(mesh(mergeGeometries(frame.map(clean)), MAT.dark, 'control_screen_frame'));
    // control strip under the touch screen: confirm button with a lit ring and four status pips
    const ly = -ch / 2 + 0.16;
    const slot = slab(roundedShape([[-0.13, ly - 0.06, 0.02], [0.13, ly - 0.06, 0.02], [0.13, ly + 0.06, 0.02], [-0.13, ly + 0.06, 0.02]]), 0.01, { bevel: 0.003, segs: 1, zc: 0.246 });

  swayT = 0;

  side = back ? 'back' : 'front';
  controls.minAzimuthAngle = back ? Math.PI - 1.35 : -1.35; controls.maxAzimuthAngle = back ? -(Math.PI - 1.35) : 1.35;
  if (back && swayOn) { swayOn = false; $('sway').setAttribute('aria-pressed', 'false'); }
  if (instant) { camera.position.copy(v.pos); controls.target.copy(v.target); controls.update(); return; }
  camTween = { from: camera.position.clone(), fromT: controls.target.clone(), to: v.pos, tt: v.target, t: 0 };
}

/* ------------------------------------------------------------------ UI */

$('deploy').addEventListener('click', toggleDeploy);
document.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => { if (b.dataset.size === sizeKey) return; const locked = tau >= TAU_END - 1e-3; setModel(b.dataset.size); tau = locked ? TAU_END : T0; dir = 0; apply(); goView('34'); try { localStorage.setItem('crx7-size', sizeKey); } catch (e) { } }));
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => goView(b.dataset.view)));
$('labels').addEventListener('click', () => { const on = $('labels').getAttribute('aria-pressed') !== 'true'; $('labels').setAttribute('aria-pressed', String(on)); if (on && tau < TAU_END - 1e-3 && dir <= 0) toggleDeploy(); apply(); });
$('sway').addEventListener('click', () => { swayOn = !swayOn; $('sway').setAttribute('aria-pressed', String(swayOn)); if (swayOn && side === 'back') goView('34'); });
controls.addEventListener('start', () => { if (swayOn) { swayOn = false; $('sway').setAttribute('aria-pressed', 'false'); } camTween = null; });
window.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if (e.key === 'd' || e.key === 'D' || e.key === ' ') { e.preventDefault(); toggleDeploy(); }
  const i = ['1', '2', '3', '4'].indexOf(e.key); if (i >= 0) document.querySelectorAll('[data-size]')[i].click();
});
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ------------------------------------------------------------------ export */

function toBase64(buf) {
  const bytes = new Uint8Array(buf); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
// Used by tools/export-glb.js: one .glb per size, rest pose locked (deployed), plus a 'deploy' clip
// that runs from the stowed unit to the locked wall. Metres, +Y up, facing +Z, wall surface at z = 0.
function exportScenes() {
  drawScreen('LOCKED');
  const out = [];
  for (const key of Object.keys(SIZES)) {
    const N = buildModel(key);
    const clip = deployClip(N);
    N.root.updateMatrixWorld(true);
    out.push({ file: `crx7-wallseal-${key}.glb`, root: N.root, animations: [clip] });
  }
  return out;
}
async function exportGLB() {
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  const exporter = new GLTFExporter(), out = [];
  for (const s of exportScenes()) {
    const buf = await exporter.parseAsync(s.root, { binary: true, animations: s.animations });
    out.push({ file: s.file, bytes: buf.byteLength, base64: toBase64(buf) });
  }
  drawScreen(screenState);
  return out;
}
function preview() {
  renderer.setAnimationLoop(null);
  document.querySelectorAll('.plate, .bar, .hint').forEach(e => { e.hidden = true; });
  if (sizeKey !== 'standard') setModel('standard');
  tau = TAU_END; dir = 0; apply();
  swayOn = false; goView('34', true);
  composer.render();
}
window.__model = { id: 'crx7-wallseal', exportScenes, exportGLB, preview };

/* ------------------------------------------------------------------ go */

let start = 'standard';
try { const s = localStorage.getItem('crx7-size'); if (s && SIZES[s]) start = s; } catch (e) { }
setModel(start);
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
tau = reduce ? TAU_END : 0; apply();
goView('34', true);
$('loading').hidden = true;
let autoStart = reduce ? -1 : 0.9;

const clock = new THREE.Clock();
function tick(dt) {
  if (autoStart > 0) { autoStart -= dt; if (autoStart <= 0) dir = 1; }
  if (dir !== 0) {
    tau += dir * dt * (dir < 0 ? 1.6 : 1);
    if (dir < 0 && tau <= T0) { tau = T0; dir = 0; }
    if (dir > 0 && tau >= TAU_END) { tau = TAU_END; dir = 0; }
    apply();
  }
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt / 0.9);
    const e = ease(camTween.t);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.tt, e);
    if (camTween.t >= 1) camTween = null;
  } else if (swayOn) {
    swayT += dt;
    const v = viewFor('34'), base = v.pos.clone().sub(v.target);
    const r = Math.hypot(base.x, base.z), a = 0.52 * Math.cos(swayT * 0.22);
    camera.position.set(v.target.x + Math.sin(a) * r, v.target.y + base.y, v.target.z + Math.cos(a) * r);
    controls.target.copy(v.target);
  }
}
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  tick(dt);
  controls.update();
  composer.render(dt);
  labelRenderer.render(scene, camera);
});
window.__model.ready = true;
window.__model.debug = {
  tick, stop: () => renderer.setAnimationLoop(null),
  renderOnce: () => { controls.update(); composer.render(); labelRenderer.render(scene, camera); },
  setT: (v) => { tau = T0 + v; dir = 0; apply(); }, setTau: (v) => { tau = v; dir = 0; apply(); }, setModel, goView, camera, controls, scene, renderer, MAT, get model() { return model; },
  setSway: (v) => { swayOn = v; }, setSpin: (v) => { swayOn = v; }, pivot: { rotation: {} }, toggleDeploy,
};
</script>
</body>
