<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices, toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { TessellateModifier } from 'three/addons/modifiers/TessellateModifier.js';
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';

// Metres, +Y up, N1CK faces +Z, his left is +X. Origin on the plinth top between his feet.

/* ------------------------------------------------------------------ helpers */

// Monotone cubic interpolation through [x, y] points (no overshoot).
function curve(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const constant = v => () => v;

// Loft a superellipse cross-section along X. top/bot/hw/n are functions of x.
// round: radius used to roll the edges at both ends; caps are flat.
function loft({ x0, x1, top, bot, hw, n = constant(2.6), cy = null, steps = 160, seg = 72, round = 0, roundStart = round, roundEnd = round, groove = null }) {
  const xs = [];
  // denser stations near the ends so the rolled edges stay smooth
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const e = 0.5 - 0.5 * Math.cos(Math.PI * u);
    xs.push(x0 + (x1 - x0) * (0.55 * u + 0.45 * e));
  }
  const pos = [], idx = [];
  const ring = (x) => {
    let T = top(x), B = bot(x), W = hw(x);
    const ds = x - x0, de = x1 - x;
    let inset = 0;
    if (roundStart > 0 && ds < roundStart) inset = Math.max(inset, roundStart - Math.sqrt(Math.max(0, roundStart * roundStart - (roundStart - ds) ** 2)));
    if (roundEnd > 0 && de < roundEnd) inset = Math.max(inset, roundEnd - Math.sqrt(Math.max(0, roundEnd * roundEnd - (roundEnd - de) ** 2)));
    let gB = 0, gW = 0;
    if (groove) { const g = groove(x); gB = g; gW = g; }
    T -= inset; B += inset + gB; W -= inset + gW;
    // a rounding radius larger than the section must not turn the ring inside out
    W = Math.max(0.002, W);
    const c = cy ? cy(x) : (T + B) / 2, ry = Math.max(0.001, (T - B) / 2);
    const e = 2 / n(x), out = [];
    for (let j = 0; j < seg; j++) {
      const t = (j / seg) * Math.PI * 2, co = Math.cos(t), si = Math.sin(t);
      const z = W * Math.sign(co) * Math.pow(Math.abs(co), e);
      const y = c + ry * Math.sign(si) * Math.pow(Math.abs(si), e);
      out.push([x, y, z]);
    }
    return out;
  };
  const rings = xs.map(ring);
  rings.forEach(r => r.forEach(p => pos.push(...p)));
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * seg + j, b = i * seg + (j + 1) % seg, c = (i + 1) * seg + j, d = (i + 1) * seg + (j + 1) % seg;
      idx.push(a, c, b, b, c, d);
    }
  }
  // flat caps with their own vertices
  const capAt = (r, flip) => {
    const base = pos.length / 3;
    const cx = r.reduce((s, p) => s + p[1], 0) / r.length;
    pos.push(r[0][0], cx, 0);
    r.forEach(p => pos.push(...p));
    for (let j = 0; j < seg; j++) {
      const a = base + 1 + j, b = base + 1 + (j + 1) % seg;
      flip ? idx.push(base, a, b) : idx.push(base, b, a);
    }
  };
  // caps face outward: -x at the start, +x at the end
  capAt(rings[0], true);
  capAt(rings[rings.length - 1], false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Polygon with per-corner radius: pts = [[x, y, r], ...]
function roundedShape(pts, shape = new THREE.Shape()) {
  const n = pts.length;
  const P = pts.map(p => new THREE.Vector2(p[0], p[1]));
  for (let i = 0; i < n; i++) {
    const prev = P[(i - 1 + n) % n], cur = P[i], next = P[(i + 1) % n], r = pts[i][2] || 0;
    const v1 = prev.clone().sub(cur), v2 = next.clone().sub(cur);
    const l1 = v1.length(), l2 = v2.length();
    const rr = Math.min(r, l1 / 2.05, l2 / 2.05);
    const a = cur.clone().add(v1.normalize().multiplyScalar(rr));
    const b = cur.clone().add(v2.normalize().multiplyScalar(rr));
    if (i === 0) shape.moveTo(a.x, a.y); else shape.lineTo(a.x, a.y);
    if (rr > 0) shape.quadraticCurveTo(cur.x, cur.y, b.x, b.y);
  }
  shape.closePath();
  return shape;
}
function roundedPath(pts) { return roundedShape(pts, new THREE.Path()); }

// Extrude a side-profile shape (in the XY plane) across Z, centred on zc.
function slab(shape, width, { bevel = 0.04, segs = 3, zc = 0, curveSegments = 24 } = {}) {
  const depth = Math.max(0.001, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.9, bevelSegments: segs, curveSegments,
  });
  g.translate(0, 0, zc - depth / 2);
  return g;
}

// Lathe around the X axis. pts = [[x, r], ...]
function latheX(pts, seg = 64) {
  const g = new THREE.LatheGeometry(pts.map(([x, r]) => new THREE.Vector2(r, x)), seg);
  g.rotateZ(-Math.PI / 2);
  g.scale(1, 1, 1);
  // after rotateZ(-90deg) the lathe axis (y) maps to +x
  return g;
}

function clean(g) {
  g = g.index ? g.toNonIndexed() : g;
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  return g;
}
function creased(g, angle = 34) { return toCreasedNormals(clean(g), THREE.MathUtils.degToRad(angle)); }

const evaluator = new Evaluator();
evaluator.attributes = ['position', 'normal'];
evaluator.useGroups = false;
// Cutters passed together must not overlap each other (they are merged into one brush).
function subtract(base, ...cutters) {
  let a = new Brush(clean(base)); a.updateMatrixWorld();
  const cut = new Brush(mergeGeometries(cutters.map(clean))); cut.updateMatrixWorld();
  const r = evaluator.evaluate(a, cut, SUBTRACTION);
  return r.geometry;
}
// For cutters that overlap, subtract them one after another.
function subtractEach(base, ...cutters) {
  let g = base;
  for (const c of cutters) g = subtract(g, c);
  return g;
}
function box(x0, x1, y0, y1, z0, z1) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return g;
}



// Screw head with its drive recess ("inlet"). Built along +y with the underside at y = 0.
// style: 'slot' (flat blade), 'phillips' (cross), 'hex' (socket). countersunk heads sit nearly flush.
function screwHead(r, { style = 'slot', h, countersunk = false, seg = 36 } = {}) {
  if (h === undefined) h = countersunk ? r * 0.5 : r * 0.6;
  const prof = countersunk
    ? [[0, 0], [r * 0.5, 0], [r, h - 0.006], [r, h], [0, h]]
    : [[0, 0], [r, 0], [r, h * 0.45], [r * 0.86, h * 0.82], [r * 0.55, h * 0.97], [0, h]];
  let g = new THREE.LatheGeometry(prof.map(([x, y]) => new THREE.Vector2(x, y)), seg);
  // the recess a driver goes into: deep enough to grip, open across the head for a blade
  const d = Math.min(h * 0.85, r * 0.62);
  if (style === 'slot') g = subtract(g, box(-r * 1.3, r * 1.3, h - d, h + 0.2, -r * 0.17, r * 0.17));
  else if (style === 'phillips') {
    g = subtractEach(g, box(-r * 0.68, r * 0.68, h - d, h + 0.2, -r * 0.13, r * 0.13), box(-r * 0.13, r * 0.13, h - d, h + 0.2, -r * 0.68, r * 0.68));
  } else if (style === 'hex') {
    g = subtract(g, new THREE.CylinderGeometry(r * 0.5, r * 0.5, d * 2, 6).translate(0, h, 0));
  }
  return creased(g, 35);
}
// Put a screw head at pos with its axis along normal; spin turns the recess about that axis.
function placeScrew(geo, pos, normal, spin = 0) {
  geo.applyMatrix4(new THREE.Matrix4().makeRotationY(spin));
  geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal.clone().normalize()));
  geo.translate(pos.x, pos.y, pos.z);
  return geo;
}


/* ================================================================== N1CK core */
// Proportions, rig, materials and procedural textures, detail helpers, blockouts and the part loader.
// Metres, +Y up, N1CK faces +Z and his left is +X. Rest pose: T-pose with every bone at identity
// rotation, so at rest a bone's local axes are the world axes and local = world - joint position.
// See SPEC.md for the contract the part files build against.

const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const deg = THREE.MathUtils.degToRad;
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const clampR = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const sstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ------------------------------------------------------------------ proportions */

const HEIGHT = 1.85;
// joint centres in the rest T-pose, world metres; right-side joints mirror x
const JOINT_L = {
  hips: [0, 1.0, 0], spine: [0, 1.09, -0.005], chest: [0, 1.215, -0.01], upper_chest: [0, 1.345, -0.012],
  neck: [0, 1.555, -0.02], head: [0, 1.64, -0.01],
  shoulder_l: [0.03, 1.47, -0.015], upper_arm_l: [0.185, 1.47, -0.025], lower_arm_l: [0.485, 1.47, -0.025], hand_l: [0.75, 1.47, -0.025],
  upper_leg_l: [0.092, 0.955, 0], lower_leg_l: [0.092, 0.515, 0.006], foot_l: [0.092, 0.09, -0.012], toes_l: [0.092, 0.026, 0.15],
};
// fingers of the left hand: knuckle offset from the wrist, segment lengths (proximal, middle, distal),
// width (across the hand) and thickness (back to palm). The thumb runs along dir; the others along +X.
const FINGER = {
  thumb: { base: [0.024, -0.012, 0.022], dir: [0.62, -0.3, 0.72], len: [0.046, 0.033, 0.028], w: 0.022, t: 0.019 },
  index: { base: [0.094, 0.003, 0.028], len: [0.043, 0.026, 0.021], w: 0.019, t: 0.017 },
  middle: { base: [0.098, 0.004, 0.008], len: [0.047, 0.03, 0.022], w: 0.0195, t: 0.0175 },
  ring: { base: [0.094, 0.002, -0.012], len: [0.044, 0.028, 0.02], w: 0.018, t: 0.0165 },
  pinky: { base: [0.086, -0.002, -0.031], len: [0.034, 0.021, 0.018], w: 0.016, t: 0.015 },

// Build everything: materials, rig, parts. Returns { rig, K, timings }.
function buildN1CK() {

    const spk = [ringL(0.004, 0.006), ringL(0.0088, 0.0108), ringL(0.0136, 0.0156), ringL(0.0184, 0.0205, 0.1024), K.latheX([[FL, 0.0034], [0.1022, 0.0034], [0.1028, 0.0024], [0.103, 0]], 20)];
    for (let k = 0; k < 4; k++) spk.push(K.box(FL, 0.1022, -0.0007, 0.0007, 0.0045, 0.0186).rotateX(k * Math.PI / 2 + Math.PI / 4));
    const speaker = grow(K.merge(spk)).translate(0, E.y, E.z);
    // mic: perforated dome in a clamp ring
    const domeP = [[0, 0.1046], [0.0038, 0.1045], [0.0078, 0.1041], [0.0118, 0.1034], [0.0148, 0.1024], [0.0165, 0.1012]];
    const domeX = (r) => { for (let i = 1; i < domeP.length; i++) if (r <= domeP[i][0]) { const t = (r - domeP[i - 1][0]) / (domeP[i][0] - domeP[i - 1][0]); return K.lerp(domeP[i - 1][1], domeP[i][1], t); } return domeP[domeP.length - 1][1]; };
    // mic: a short stub antenna rises from the housing rim, up and back
    const ant = K.merge([K.latheY([[0, 0.0016], [0.0015, 0.0016], [0.0018, 0.0012], [0.0085, 0.0011], [0.0088, 0.0016], [0.0098, 0.0017], [0.0106, 0.001], [0.0108, 0]], 10)]);
    K.orient(ant, V3(0, 1, 0), V3(-0.25, 1, -0.45)); ant.translate(0.1012 + DX - FL, 0.0262, -0.008);
    const mic = grow(K.merge([K.latheX([[FL, 0.0165], ...domeP.slice().reverse().map(([r, x]) => [x, r])], 32), ringL(0.0163, 0.0205, 0.1027)])).translate(0, E.y, E.z);
    const micAnt = ant.translate(FL, E.y, E.z);
    const dots = [];
    for (let j = -6; j <= 6; j++) for (let i = -6; i <= 6; i++) {
      const y = j * 0.0026 * 0.866, z = (i + (j & 1) * 0.5) * 0.0026, r = Math.hypot(y, z); if (r > 0.0128) continue;
      const x = domeX(r), dx = (domeX(r + 1e-4) - x) / 1e-4, n = V3(1, -dx * y / Math.max(r, 1e-6), -dx * z / Math.max(r, 1e-6)).normalize();
      dots.push(K.orient(new THREE.CircleGeometry(0.00072, 6), V3(0, 0, 1), n).translate(x + n.x * 0.0004, y + n.y * 0.0004, z + n.z * 0.0004));
    }
    const micDots = grow(K.merge(dots)).translate(0, E.y, E.z);
    for (const s of [1, -1]) {
      const side = (g) => s > 0 ? g : K.mirrorX(g), sfx = s > 0 ? 'l' : 'r';
      add('head', side(plateG.clone()), M.iron, `ear_plate_${sfx}`, { wear: { k: 150, chip: 0.5 } });
      add('head', side(housing.clone()), M.gunmetal, `ear_${sfx}`);
      add('head', side(well.clone()), M.inner, `ear_${sfx}_well`, { cast: false });
      if (s > 0) add('head', speaker, M.gunmetal, 'ear_l_speaker_grille', { cast: false });
      else { add('head', K.mirrorX(K.merge([mic, micAnt])), M.gunmetal, 'ear_r_mic', { cast: false }); add('head', K.mirrorX(micDots), M.inner, 'ear_r_mic_holes', { cast: false }); }
      // audio lead: from behind the ear plate back along the side into the rear of the housing, two clips
      const lead = []; for (const [y, z] of [[1.711, -0.041], [1.703, -0.058], [1.688, -0.073], [1.672, -0.085], [1.655, -0.088]]) lead.push(V3(shellSec(z).a + 0.0031, y, z));
      lead.push(V3(0.081, 1.628, -0.08), V3(0.062, 1.609, -0.066), V3(0.045, 1.6055, -0.055));
      add('head', side(K.cable(lead, 0.0027, { seg: 7 })), M.cable, `ear_${sfx}_lead`, { cast: false });
      // the socket boss on the underside plate that takes the lead
      const le = lead[lead.length - 1], sk = K.orient(K.latheY([[-0.004, 0], [-0.004, 0.0052], [0.0, 0.0056], [0.0045, 0.0048], [0.0045, 0]], 14), V3(0, 1, 0), lead[lead.length - 2].clone().sub(le).normalize()).translate(le.x, le.y, le.z);
      add('head', side(sk), M.gunmetal, `ear_${sfx}_lead_socket`, { cast: false });
      add('head', side(K.orient(K.latheY([[-0.0025, 0.0044], [0.0005, 0.0046], [0.0012, 0.004], [0.0065, 0.0036], [0.0065, 0]], 12), V3(0, 1, 0), lead[5].clone().sub(lead[4])).translate(lead[4].x, lead[4].y, lead[4].z)), M.gunmetal, `ear_${sfx}_lead_ferrule`, { cast: false });
      const crv = new THREE.CatmullRomCurve3(lead), clips = [], clipRv = [];
      for (const u of [0.28, 0.62]) {
        const q = crv.getPointAt(u), t = crv.getTangentAt(u);
        clips.push(K.orient(K.latheY([[-0.003, 0.0036], [-0.0026, 0.0041], [0.0026, 0.0041], [0.003, 0.0036]], 14), V3(0, 1, 0), t).translate(q.x, q.y, q.z));
        const off = V3(0, -t.z, t.y).normalize().multiplyScalar(0.0072);
        clips.push(K.box(-0.0026, 0.0, -0.0028, 0.0028, -0.0028, 0.0028).translate(q.x + off.x, q.y + off.y, q.z + off.z));
        clipRv.push({ p: V3(q.x + 0.0003, q.y + off.y * 1.15, q.z + off.z * 1.15), n: V3(1, 0, 0) });
      }
      add('head', side(K.merge(clips)), M.gunmetal, `ear_${sfx}_lead_clips`, { cast: false });
      add('head', side(rivetSet(clipRv, 0.0022, 40 + s)), M.rivet, `ear_${sfx}_lead_rivets`, { cast: false });
      const rv = []; for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + 0.52; rv.push({ p: V3(earX0 + 0.0046, E.y + Math.sin(a) * 0.0286, E.z + Math.cos(a) * 0.0286), n: V3(1, 0, 0) }); }
      add('head', side(rivetSet(rv, 0.0033, 20 + s)), M.rivet, `ear_plate_${sfx}_rivets`, { cast: false });
    }
  }

  /* ---------------- neck: segmented rings on a dark spine, braided tendons, socket under the head */
  {
    const NZ = -0.015;
    add('neck', K.latheY([[1.534, 0], [1.534, 0.048], [1.546, 0.048], [1.549, 0.045], [1.551, 0.032], [1.551, 0]], 24).translate(0, 0, NZ), M.gunmetal, 'neck_base');
    add('neck', new THREE.CylinderGeometry(0.027, 0.029, 0.086, 24, 1).translate(0, 1.583, NZ), M.inner, 'neck_spine');
    const vert = (y, r, h = 0.0055) => K.latheY([[y - h, 0.026], [y - h, r - 0.003], [y - h + 0.001, r - 0.0008], [y - h + 0.0025, r], [y + h - 0.0025, r], [y + h - 0.001, r - 0.0008], [y + h, r - 0.003], [y + h, 0.026]], 28);
    // two vertebra rings, then the junction collar the cables plug into (the head swivels just above it)
    add('neck', K.merge([vert(1.5625, 0.043), vert(1.5785, 0.042), vert(1.5965, 0.047, 0.0065)]).translate(0, 0, NZ), M.gunmetal, 'neck_rings');
    // a hairline of purple energy between the two vertebra rings (the one Crystalix accent seen from the front)
    add('neck', new THREE.TorusGeometry(0.0395, 0.0011, 6, 48).rotateX(Math.PI / 2).translate(0, 1.5705, NZ), M.rim, 'neck_glow', { cast: false });
    // cable sockets under the collar: front left, front right, back ([side, angle from the front])
    const sockP = [[1, Math.PI / 4], [-1, Math.PI / 4], [0, Math.PI]].map(([sd, a]) => V3(sd * Math.sin(a) * 0.0505, 1.5915, NZ + Math.cos(a) * 0.0505));
    add('neck', K.merge(sockP.map((p) => K.latheY([[-0.0062, 0], [-0.0062, 0.0062], [-0.0055, 0.0072], [0.006, 0.0072], [0.006, 0]], 18).translate(p.x, p.y, p.z))), M.gunmetal, 'neck_sockets');
    const tendon = (s) => [V3(s * 0.03, 1.536, NZ + 0.028), V3(s * 0.034, 1.553, NZ + 0.032), V3(s * 0.041, 1.572, NZ + 0.041), V3(s * 0.0395, 1.587, NZ + 0.0395), V3(s * 0.0357, 1.592, NZ + 0.0357)];
    const spineC = [V3(0, 1.536, NZ - 0.04), V3(0, 1.553, NZ - 0.058), V3(0, 1.573, NZ - 0.065), V3(0, 1.588, NZ - 0.057), V3(0, 1.592, NZ - 0.0505)];
    add('neck', K.merge([K.cable(tendon(1), 0.004, { seg: 8 }), K.cable(tendon(-1), 0.004, { seg: 8 }), K.cable(spineC, 0.004, { seg: 8 })]), M.cable, 'neck_cables');
    // clamps tie the tendons to the middle ring
    const clamps = [];
    for (const s of [1, -1]) {
      const c = new THREE.CatmullRomCurve3(tendon(s)); let u = 0.5;
      for (let k = 0; k <= 40; k++) if (Math.abs(c.getPointAt(k / 40).y - 1.5785) < Math.abs(c.getPointAt(u).y - 1.5785)) u = k / 40;
      const p = c.getPointAt(u), t = c.getTangentAt(u);
      clamps.push(K.orient(K.latheY([[-0.0034, 0.0086], [-0.003, 0.0092], [0.003, 0.0092], [0.0034, 0.0086]], 18), V3(0, 1, 0), t).translate(p.x, p.y, p.z));
      const r = V3(p.x, 0, p.z - NZ).normalize();
      clamps.push(K.box(-0.0022, 0.0022, -0.0026, 0.0026, -0.0115, 0.0).applyQuaternion(new THREE.Quaternion().setFromUnitVectors(V3(0, 0, 1), r)).translate(p.x - r.x * 0.0083, 1.5785, p.z - r.z * 0.0083));
    }
    add('neck', K.merge(clamps), M.gunmetal, 'neck_clamps', { cast: false });
    // socket flange under the housing, bolted round its rim
    add('head', K.latheY([[1.6045, 0], [1.6045, 0.034], [1.6052, 0.0405], [1.607, 0.0428], [1.6185, 0.0428], [1.62, 0]], 40).translate(0, 0, NZ), M.gunmetal, 'head_socket');
    const sb = []; for (let i = 0; i < 6; i++) { const a = (i + 0.5) / 6 * Math.PI * 2, n = V3(Math.sin(a), 0, Math.cos(a)); sb.push(hexAt(V3(n.x * 0.0428, 1.6128, NZ + n.z * 0.0428), n, a)); }
    add('head', K.merge(sb), M.gunmetal, 'head_socket_bolts', { cast: false });
  }

  /* ---------------- face atlas and the face switching hook */
  const FACE_LIST = ['neutral', 'neutral_blink', 'happy', 'happy_blink', 'worried', 'worried_blink', 'laughing_a', 'laughing_b', 'sad', 'sad_blink', 'alert', 'alert_blink', 'talk_a', 'talk_b', 'focus', 'off'];
  drawAtlas();
  const red = new THREE.Color('#d8141a');
  K.hooks.face = {
    cells: FACE_LIST,
    offset: (i) => [(i % 4) / 4, Math.floor(i / 4) / 4],
    // show a cell (index or name) and an alarm tint 0..1 on the screen material
    set(cell, tint = 0) {
      const i = typeof cell === 'number' ? cell : Math.max(0, FACE_LIST.indexOf(cell));
      const [u, v] = this.offset(i);
      M.screen.emissiveMap.offset.set(u, v);
      M.screen.emissive.set('#ffffff').lerp(red, Math.min(1, Math.max(0, tint)));
      return i;
    },
  };

  // Crisp warm LED faces with sub-pixel stripes and scan rows, redrawn into TX.faceAtlasCanvas in place
  // (same 4 x 4 layout of 256 x 192 cells, 32 x 24 LEDs at 8 px). Alert cells are red.
  function drawAtlas() {
    const CW = 256, CH = 192, GW = 32, GH = 24, P = 8, SS = 4;
    const cvs = TX.faceAtlasCanvas, ctx = cvs.getContext('2d');
    const img = ctx.createImageData(CW * 4, CH * 4), px = img.data;
    const hi = document.createElement('canvas'); hi.width = GW * SS; hi.height = GH * SS;
    const S = hi.getContext('2d', { willReadFrequently: true });
    const EL = 10.5, ER = 21.5, EY = 9.5;
    const rr = (x, y, w, h, r) => { S.beginPath(); S.roundRect(x - w / 2, y - h / 2, w, h, r); S.fill(); };
    const ln = (pts, lw = 1.5) => { S.lineWidth = lw; S.beginPath(); S.moveTo(...pts[0]); for (const p of pts.slice(1)) S.lineTo(...p); S.stroke(); };
    const qd = (a, c, b, lw = 1.5) => { S.lineWidth = lw; S.beginPath(); S.moveTo(...a); S.quadraticCurveTo(...c, ...b); S.stroke(); };
    const fill = (f) => { S.beginPath(); f(); S.fill(); };
    const both = (f) => { f(EL, 1); f(ER, -1); };
    const eyes = (w = 3.1, h = 6.2, y = EY) => both((x) => rr(x, y, w, h, 1.5));
    const lids = (y = EY + 1, w = 4.6, droop = 0.7) => both((x) => qd([x - w / 2, y], [x, y + droop * 2], [x + w / 2, y], 1.5));
    const smile = (w = 8, d = 1.4, y = 16.8, lw = 1.6) => qd([16 - w / 2, y], [16, y + d * 2], [16 + w / 2, y], lw);
    const frown = (w = 7.6, d = 1.5, y = 19.2) => qd([16 - w / 2, y], [16, y - d * 2], [16 + w / 2, y], 1.5);
    const happyEyes = (lift = 3.4, y = EY + 1.6) => both((x) => qd([x - 2.8, y], [x, y - lift * 1.6], [x + 2.8, y], 1.7));
    const brows = (yo, yi, dx = 0) => both((x, s) => ln([[x - s * 2.8, yo], [x + s * (2.4 + dx), yi]], 1.6));
    const wavy = () => { S.lineWidth = 1.5; S.beginPath(); S.moveTo(11.4, 18.9); S.quadraticCurveTo(13.7, 16.6, 16, 18.4); S.quadraticCurveTo(18.3, 20.2, 20.6, 17.9); S.stroke(); };
    const laughEyes = (dy = 0) => both((x, s) => ln([[x - s * 2.3, EY - 2.3 + dy], [x + s * 1.9, EY + dy], [x - s * 2.3, EY + 2.3 + dy]], 1.6));
    const cut = (f) => { S.globalCompositeOperation = 'destination-out'; f(); S.globalCompositeOperation = 'source-over'; };
    const FACE = {
      neutral: () => { eyes(); smile(); },
      neutral_blink: () => { lids(); smile(); },
      happy: () => { happyEyes(); smile(11, 2.6, 15.9, 1.6); },
      happy_blink: () => { happyEyes(1.6, EY + 1.8); smile(11, 2.6, 15.9, 1.6); },
      worried: () => { eyes(3.0, 5.0, EY + 1.1); brows(5.2, 3.4); wavy(); },
      // worried: the blink frame is a quick eye-dart to one side
      worried_blink: () => { both((x) => rr(x + 1.1, EY + 1.3, 2.6, 4.4, 1.2)); brows(5.2, 3.4); wavy(); },
      laughing_a: () => { laughEyes(); fill(() => { S.moveTo(10.4, 14.8); S.lineTo(21.6, 14.8); S.quadraticCurveTo(16, 25, 10.4, 14.8); }); },
      laughing_b: () => { laughEyes(-0.5); fill(() => { S.moveTo(11.2, 14.6); S.lineTo(20.8, 14.6); S.quadraticCurveTo(16, 21.8, 11.2, 14.6); }); },
      // sad: eyes low with their outer tops cut away, brows drooping at the outer ends, a wide flat frown
      sad: () => {
        eyes(3.2, 4.6, EY + 3.1);
        cut(() => both((x, s) => fill(() => { S.moveTo(x - s * 3.6, EY + 2.7); S.lineTo(x + s * 2.4, EY - 0.1); S.lineTo(x - s * 3.6, EY - 1.9); })));
        brows(7.6, 4.6, -0.2); frown(10, 0.9, 19.6);
      },
      sad_blink: () => { both((x, s) => ln([[x - s * 2.3, EY + 4.1], [x + s * 2.1, EY + 3.2]], 1.5)); brows(7.6, 4.6, -0.2); frown(10, 0.9, 19.6); rr(EL - 1.2, EY + 6.4, 1, 1.4, 0.4); },
      alert: () => { eyes(4.1, 7.4, EY + 0.6); brows(3.7, 3.3); rr(16, 18.2, 4.2, 2.4, 1.1); },
      alert_blink: () => { lids(EY + 1.4, 5, 0.3); brows(3.7, 3.3); rr(16, 18.2, 4.2, 2.4, 1.1); },
      talk_a: () => { eyes(); rr(16, 17.7, 5.2, 2.6, 1.2); },
      talk_b: () => { eyes(); fill(() => { S.moveTo(12.2, 16.1); S.lineTo(19.8, 16.1); S.quadraticCurveTo(16, 21.8, 12.2, 16.1); }); },
      focus: () => { both((x) => rr(x, EY + 0.6, 4.8, 2.4, 1)); brows(5.5, 5.9); qd([12.8, 17.4], [16.6, 19.2], [19.8, 16.5], 1.5); },
      off: () => { },
    };
    const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
    const WARM = [215, 184, 140], REDC = [236, 46, 34];
    FACE_LIST.forEach((name, idx) => {
      S.setTransform(1, 0, 0, 1, 0, 0); S.clearRect(0, 0, hi.width, hi.height);
      // features drawn 1.28x about the face centre, so they fill the screen (eyes about 4 LEDs wide)
      const FS = 1.28, cx0 = 16, cy0 = 12.3;
      // worried and alert sit one LED lower, so their brows stay off the cell's edge row
      const dy = /^(worried|alert)/.test(name) ? SS : 0;
      S.setTransform(SS * FS, 0, 0, SS * FS, SS * cx0 * (1 - FS), SS * cy0 * (1 - FS) + dy); S.fillStyle = S.strokeStyle = '#fff'; S.lineCap = 'round'; S.lineJoin = 'round';
      FACE[name]();
      const a = S.getImageData(0, 0, hi.width, hi.height).data;
      // LED levels from coverage: off, a dim anti-alias step, on (mirrored for the symmetric faces)
      const cov = new Float32Array(GW * GH), lv = new Float32Array(GW * GH), sym = !/^(worried|focus)/.test(name);
      for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
        let c = 0; for (let y = 0; y < SS; y++) for (let x = 0; x < SS; x++) c += a[((j * SS + y) * hi.width + i * SS + x) * 4 + 3];
        cov[j * GW + i] = c / (SS * SS * 255);
      }
      for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
        const c = sym ? Math.max(cov[j * GW + i], cov[j * GW + GW - 1 - i]) : cov[j * GW + i];
        // the outer ring of LEDs stays dark: an 8 px gutter round every cell, so mipmaps never bleed a face into its neighbour
        const edge = i === 0 || j === 0 || i === GW - 1 || j === GH - 1;
        lv[j * GW + i] = edge || c < 0.22 ? 0 : c < 0.5 ? 0.42 : 1;
      }
      // soft glow: the LED levels blurred
      const gl = new Float32Array(GW * GH), kr = 2;
      for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
        let s = 0, w = 0;
        for (let y = -kr; y <= kr; y++) for (let x = -kr; x <= kr; x++) { const ii = i + x, jj = j + y, k = Math.exp(-(x * x + y * y) / 1.6); w += k; if (ii >= 0 && jj >= 0 && ii < GW && jj < GH) s += lv[jj * GW + ii] * k; }
        gl[j * GW + i] = s / w;
      }
      const glow = (fx, fy) => {
        const x = Math.min(GW - 1.001, Math.max(0, fx - 0.5)), y = Math.min(GH - 1.001, Math.max(0, fy - 0.5)), i = Math.floor(x), j = Math.floor(y), u = x - i, v = y - j;
        const g = (ii, jj) => gl[Math.min(GH - 1, jj) * GW + Math.min(GW - 1, ii)];
        return (g(i, j) * (1 - u) + g(i + 1, j) * u) * (1 - v) + (g(i, j + 1) * (1 - u) + g(i + 1, j + 1) * u) * v;
      };
      // unlit LEDs keep a faint warm backlight so the screen reads as on
      const isRed = name.startsWith('alert'), col = isRed ? REDC : WARM, base = isRed ? [20, 7, 6] : [17, 13, 10], ground = isRed ? [6, 2, 2] : [6, 5, 4];
      const ox = (idx % 4) * CW, oy = Math.floor(idx / 4) * CH, rnd = K.prng(77 + idx * 13);
      const vary = new Float32Array(GW * GH); for (let k = 0; k < vary.length; k++) vary[k] = 0.9 + rnd() * 0.16;
      for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
        const i = x >> 3, j = y >> 3, lx = x & 7, ly = y & 7, k = j * GW + i, b = lv[k] * vary[k];
        // LED cell: 6 x 6 lit area with clipped corners, one dark pixel of gap all round
        const inX = lx >= 1 && lx <= 6, inY = ly >= 1 && ly <= 6, corner = (lx === 1 || lx === 6) && (ly === 1 || ly === 6);
        const mask = inX && inY ? (corner ? 0.45 : 1) : 0;
        // sub-pixel stripes (R G B, two columns each) and a dim scan row at the bottom of each LED
        const sp = lx <= 2 ? 0 : lx <= 4 ? 1 : 2, scan = ly === 6 ? 0.72 : ly === 1 ? 0.92 : 1;
        const cx = lx - 3.5, cy = ly - 3.5, hot = 1 + 0.18 * Math.max(0, 1 - Math.sqrt(cx * cx + cy * cy) / 3.2);
        const vx = (x + 0.5) / CW - 0.5, vy = (y + 0.5) / CH - 0.5, vig = 1 - 0.32 * sstep(0.28, 0.62, Math.sqrt(vx * vx + vy * vy * 1.6));
        const g = glow((x + 0.5) / P, (y + 0.5) / P);
        const o = ((oy + y) * CW * 4 + ox + x) * 4;
        for (let c = 0; c < 3; c++) {
          const stripe = 0.94 + (c === sp ? 0.14 : 0);
          let v = mask ? base[c] * (0.7 + 0.3 * vary[k]) : ground[c];
          v += mask * b * col[c] * stripe * scan * hot;
          v += col[c] * g * (mask ? 0.1 : 0.2) + col[c] * 0.03 * (1 - sstep(0.1, 0.55, Math.sqrt(vx * vx + vy * vy * 1.6)));
          px[o + c] = Math.min(255, v * vig);
        }
        px[o + 3] = 255;
      }
    });
    ctx.putImageData(img, 0, 0);
    TX.faceAtlas.needsUpdate = true;

      const dr = 0.029, drum = K.latheX([[ax - 0.044, 0], [ax - 0.044, dr - 0.004], [ax - 0.041, dr], [ax - 0.016, dr], [ax - 0.0145, dr - 0.003], [ax - 0.0105, dr - 0.003], [ax - 0.009, dr], [ax + 0.009, dr], [ax + 0.0105, dr - 0.003], [ax + 0.0145, dr - 0.003], [ax + 0.016, dr], [ax + 0.041, dr], [ax + 0.044, dr - 0.004], [ax + 0.044, 0]], 18).translate(0, ay, azz);

  /* ---------------- boot: flat-bottomed sections lofted along z, articulated instep lames, flat rubber sole on y = 0 */
  function buildBoot(sx, s, FT, TO, seed) {
    const fx = J.foot_l.x, ax = J.foot_l.x, ay = J.foot_l.y, azz = J.foot_l.z;
    const side = (g) => sx > 0 ? g : K.mirrorX(g);
    // section loop: flat bottom at yb, walls, rounded top corners (radius rc), top at yt; half width w
    const secLoop = (w, yb, yt, rc, xo, ns = 5, cr = 0) => {

      const lat = [[xo, yt + cr]];
      for (let i = 1; i <= 2; i++) lat.push([xo + (w - rc) * i / 2, yt + cr * (1 - i / 2) * 0.35]);
      for (let i = 1; i <= ns; i++) { const a = PI / 2 * i / ns; lat.push([xo + w - rc + rc * Math.sin(a), yt - rc + rc * Math.cos(a)]); }

      const col = (i) => K.curve(st.map((r) => [r[0], r[i]]));
      const fw = col(1), ft = col(2), fr = col(3), fo = col(4), fc = K.curve(st.map((r) => [r[0], r[5] || 0])), yb = 0.022;

        let ins = 0;
        if (r0 && ds < r0) ins = r0 - Math.sqrt(Math.max(0, r0 * r0 - (r0 - Math.max(ds, 0)) ** 2));
        if (r1 && de < r1) ins = Math.max(ins, r1 - Math.sqrt(Math.max(0, r1 * r1 - (r1 - Math.max(de, 0)) ** 2)));
        return secLoop(Math.max(0.004, fw(z) - ins), yb, Math.max(yb + 0.006, ft(z) - ins * 0.75), fr(z), fo(z), 5, fc(z) * (1 - Math.min(1, ins / 0.012)));

    const BODY = [[-0.077, 0.041, 0.088, 0.012, 0], [-0.064, 0.046, 0.097, 0.013, 0], [-0.052, 0.0475, 0.094, 0.013, 0], [-0.041, 0.048, 0.073, 0.012, 0], [-0.027, 0.0485, 0.057, 0.011, 0],
      [-0.012, 0.0485, 0.053, 0.011, 0], [0.004, 0.0485, 0.057, 0.011, 0], [0.022, 0.049, 0.073, 0.011, 0.0005], [0.045, 0.0495, 0.08, 0.01, 0.001, 0.0006], [0.09, 0.0505, 0.072, 0.009, 0.0015, 0.001], [0.152, 0.051, 0.0615, 0.008, 0, 0.0014]];
    const BS = loopSurf(rowsF(BODY, -0.077, 0.152, 0.032, 0), sx, { axis: 'z' });
    put(FT, 'iron', shell(BS, -0.077, 0.152, { cols: 32, dv: 0.008, cap0: 0.003, tile: 0.3 }), `boot_${s}`, { wear: { k: 130, chip: 0.6, freq: 60, inner: false } });
    // toe cap on the toes bone: a little proud of the body, rounded nose

    put(TO, 'plate', spring(shell(TS, 0.144, 0.215, { cols: 40, dv: 0.0045, cap0: 0.002, cap1: 0.002, tile: 0.3 })), `toecap_${s}`, { wear: { k: 140, chip: 0.6, freq: 60, inner: false } });
    // articulated instep lames (sabaton) with a forged centre ridge: the rear one laps over the front one,
    // which laps over the toe cap
    const rgB = ridge(0.0016, 0.009);
    const lame = (pts, liftF, sd) => plate(FT, skin(BS, shapeOf(pts), { t: 0.0048, bevel: 0.002, lift: (u, v) => liftF(u, v) + rgB(u), seed: seed + sd, grid: 0.02, chip: 0.5 }), `boot_plates_${s}`);
    const lA = lame([[-0.07, 0.03, 0.01], [0.07, 0.03, 0.01], [0.071, 0.142, 0.012], [0.03, 0.156, 0.02], [-0.03, 0.156, 0.02], [-0.071, 0.142, 0.012]], () => 0.0012, 21);

      { t: 0.0055, bevel: 0.0022, lift: 0.0008, seed: seed + 24, grid: 0.022, chip: 0.62 }), `boot_plates_${s}`);
    const brv = [...on(lA, [[-0.06, 0.048], [0.06, 0.048], [-0.062, 0.128], [0.062, 0.128]]),
      ...on(heel, [[-0.078, -0.06], [0.078, -0.06], [-0.032, -0.063], [0.032, -0.063]])];
    // welt rivets low on the boot sides

    put(FT, 'rivet', K.merge(rivetSet(brv, 0.0036)), `boot_rivets_${s}`);

      put(FT, 'iron', side(K.merge([cheek(ax + 0.0522), cheek(ax - 0.0452)])), `boot_cheeks_${s}`, { wear: { k: 130 } });
      const capL = K.latheX([[ax + 0.052, 0], [ax + 0.052, 0.02], [ax + 0.0555, 0.02], [ax + 0.058, 0.016], [ax + 0.0585, 0.01], [ax + 0.0585, 0]], 16).translate(0, ay, azz);
      const capM = flipAbout(capL.clone(), ax);
      const bl = [bolt(0.0055, V3(ax + 0.0585, ay, azz), V3(1, 0, 0)), bolt(0.0055, V3(ax - 0.0585, ay, azz), V3(-1, 0, 0))];

      put(FT, 'gunmetal', side(gm(K.merge([capL, capM, ...bl, lug]))), `boot_mech_${s}`);
      // welds along the cheek roots on the boot sides
      const wl = [];
      for (const [x, sg] of [[ax + 0.0522, 1], [ax - 0.0522, -1]]) for (const [za, zb] of [[-0.061, -0.05], [0.032, 0.036]]) {
        const pts = [], nn = [];
        for (let i = 0; i <= 5; i++) { const t = i / 5; pts.push(V3(x - sg * 0.0006, lerp(0.03, 0.058, t), lerp(za, zb, t) + (za < 0 ? -0.0035 : 0.0035))); nn.push(V3(sg, 0, za < 0 ? -0.6 : 0.6).normalize()); }
        wl.push(weld(pts, nn, weldOpts(seed + 41 + x * 100 + za * 100, { w: 0.0065, h: 0.0019 })));
      }
      put(FT, 'weld', side(K.merge(wl)), `boot_welds_${s}`);
      // a short lead from the outer cheek back into the heel counter
      const cp = [V3(ax + 0.052, 0.06, -0.046), V3(ax + 0.0545, 0.062, -0.056), V3(ax + 0.052, 0.07, -0.066), V3(ax + 0.046, 0.074, -0.071)];
      put(FT, 'cable', side(bundle(cp, { n: 2, r: 0.0026, twist: 3 })), `boot_cables_${s}`);
      put(FT, 'gunmetal', side(gm(ferrules(cp, 0.0052, 0.009))), `boot_mech_${s}`);
    }
    // sole: outsole and midsole with a groove between them; the toe part on the toes bone
    const hw = (z) => z < -0.04 ? lerp(0.044, 0.0505, sst(-0.08, -0.04, z)) : z < 0.13 ? lerp(0.0505, 0.0555, sst(-0.04, 0.13, z)) : lerp(0.0555, 0.05, sst(0.13, 0.218, z));
    const Z0 = -0.0815, Z1 = 0.2205, ZS = 0.1495;
    const solePlan = (z0, z1, grow) => {
      // half width with round ends
      const w = (z) => {
        let v = hw(z) + grow;
        const r0 = hw(Z0) + grow, r1 = hw(Z1) * 0.9 + grow, ds = z - (Z0 - grow), de = (Z1 + grow) - z;
        if (ds < r0) v = Math.min(v, Math.sqrt(Math.max(0, r0 * r0 - (r0 - ds) ** 2)));
        if (de < r1) v = Math.min(v, Math.sqrt(Math.max(0, r1 * r1 - (r1 - de) ** 2)) * (v / r1));
        return Math.max(v, 0.0008);
      };
      const n = Math.max(6, Math.round((z1 - z0) / 0.012)), zs = [];
      for (let i = 0; i <= n; i++) { const u = i / n, e = 0.5 - 0.5 * Math.cos(PI * u); zs.push(lerp(z0, z1, 0.35 * u + 0.65 * e)); }
      const sh = new THREE.Shape();
      zs.forEach((z, i) => i ? sh.lineTo(fx + w(z), -z) : sh.moveTo(fx + w(z), -z));
      for (let i = n; i >= 0; i--) sh.lineTo(fx - w(zs[i]), -zs[i]);
      sh.closePath();

    };
    // plate() extrudes along +z: rotateX(-90) sends (x, y, w) to (x, w, -y), so the shape holds (x, -z)
    const slabY = (shape, y0, y1, bevel) => {
      const g = K.plate(shape, y1 - y0, { bevel, segs: 1, curveSegments: 2 }).rotateX(-PI / 2).translate(0, y0, 0), p = g.attributes.position;
      for (let i = 0; i < p.count; i++) if (Math.abs(p.getY(i) - y0) < 1e-6) p.setY(i, y0);   // the tread sits exactly on y0
      return g;
    };
    // one 18 mm rubber outsole whose tread lugs (3 mm, every 12 mm) show in profile, under a 5 mm iron welt
    const LUG = 0.003, TOP = 0.018, lugs = (z0, z1) => { const out = []; for (let z = z0; z < z1 - 0.004; z += 0.012) out.push(slabY(solePlan(z + 0.0015, Math.min(z1, z + 0.0085), 0.0012), 0, LUG + 0.0006, 0.0008)); return out; };
    const soleF = [slabY(solePlan(Z0 - 0.0012, ZS - 0.001, 0.0012), LUG, TOP, 0.003), ...lugs(Z0, ZS - 0.001)];
    const soleT = [slabY(solePlan(ZS + 0.001, Z1 + 0.0012, 0.0012), LUG, TOP, 0.003), ...lugs(ZS + 0.001, Z1)];
    put(FT, 'rubber', side(K.merge(soleF)), `sole_${s}`);
    put(TO, 'rubber', side(spring(K.merge(soleT))), `sole_toe_${s}`);
    put(FT, 'iron', side(slabY(solePlan(Z0 + 0.0005, ZS - 0.001, 0.0018), TOP - 0.0005, TOP + 0.005, 0.0016)), `boot_welt_${s}`, { wear: { k: 150, chip: 0.46, inner: false } });
    put(TO, 'iron', side(spring(slabY(solePlan(ZS + 0.001, Z1 - 0.0005, 0.0018), TOP - 0.0005, TOP + 0.005, 0.0016))), `boot_welt_toe_${s}`, { wear: { k: 150, chip: 0.4, inner: false } });
  }

  for (const sx of [1, -1]) buildLeg(sx);

  for (const b of bags.values()) {
    const g = b.geos.length === 1 ? b.geos[0] : K.merge(b.geos);
    K.addW(b.bone, g, M[b.mat], b.name, b.opts);
  }
};


/* ------------------------------------------------------------------ animation: poses, clips and face timelines */
// Owner: the animation agent. Contract: SPEC.md §10.
// CLIPS[name] = { len, loop, label, pose(t) -> { rot, hips }, face(t) -> cell name, tint(t)?, field(t)?,
//                 faces: [[t, cell], ...] (the face timeline, blinks included), speed? (m/s, walk only) }.
// How clips are made: a "spec" is { rot: { bone: [x, y, z] deg }, hips: [dx, dy, dz], feet: { l, r } } where a foot
// is [x, z, yaw, lift, heelUp, toeUp] (ankle over the ground, degrees). Keys are specs; they interpolate as
// quaternions (Catmull-Rom), then the legs are solved with IK every frame, so planted feet never slide or sink.
// Arms are posed with FK angles or placed with IK when a key is made (hand on the belly, hands together).
// No clip has root motion. walk is in place: the stance foot moves back at exactly `speed` (1.3 m/s), so the
// game moves the root forward at that speed.
// Every one-shot clip starts and ends on idle(0) exactly, and loops match at 0 and len, so blends stay clean.
// Clips (seconds): idle 4 loop | walk 1.1 loop | talk_gesture 4 loop | wave 2.4 | laugh 2 | sad 3 | worried 2.6 |
// alert 1.6 (tint up to 0.8) | nullfield_activate 1.8 (field 0 -> 1 -> 0.6). Each clip's face keys and blink
// times are written next to it below; CLIPS[name].faces is the resolved timeline.
const ANIM = (() => {
  const { sym, curl } = POSE;
  const TAU = Math.PI * 2, R2D = 180 / Math.PI;
  const AX = V3(1, 0, 0), AY = V3(0, 1, 0), AZ = V3(0, 0, 1);
  const Qn = () => new THREE.Quaternion();
  const qE = (r) => Qn().setFromEuler(new THREE.Euler(deg(r[0]), deg(r[1]), deg(r[2]), 'XYZ'));
  const eQ = (q) => { const e = new THREE.Euler().setFromQuaternion(q, 'XYZ'); return [e.x * R2D, e.y * R2D, e.z * R2D]; };
  const qAx = (ax, a) => Qn().setFromAxisAngle(ax, deg(a));
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const sm = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  // 0 -> 1 over a..b, back to 0 over c..d
  const win = (t, a, b, c, d) => sm((t - a) / (b - a)) * (1 - sm((t - c) / (d - c)));
  const SIDES = ['l', 'r'];
  const sg = (s) => (s === 'l' ? 1 : -1);
  const M3 = (v) => [v[0], -v[1], -v[2]];
  // add small Euler offsets to a bone
  const nudge = (rot, b, d) => { const r = rot[b] || [0, 0, 0]; rot[b] = [r[0] + d[0], r[1] + d[1], r[2] + d[2]]; };
  const nudgeSym = (rot, b, d) => { nudge(rot, b + '_l', d); nudge(rot, b + '_r', M3(d)); };

  /* ---------------- forward kinematics (root space) */
  // fk(pose)(bone) -> { q, p }: world rotation and joint position for a pose ({ rot, hips })
  function fk(pose) {
    const W = {};
    const get = (n) => {
      if (W[n]) return W[n];
      const par = PARENT[n], r = pose.rot[n], ql = r ? qE(r) : Qn();
      let o;
      if (!par) { const h = pose.hips || [0, 0, 0]; o = { q: ql, p: J[n].clone().add(V3(h[0], h[1], h[2])) }; }
      else { const P = get(par); o = { q: P.q.clone().multiply(ql), p: J[n].clone().sub(J[par]).applyQuaternion(P.q).add(P.p) }; }
      return (W[n] = o);

  // a rest-pose world point carried by a bone into the posed spec
  function carry(pose, bone, p) { const W = fk(pose)(bone); return p.clone().sub(J[bone]).applyQuaternion(W.q).add(W.p); }

  /* ---------------- leg IK */
  const HK = J.lower_leg_l.clone().sub(J.upper_leg_l), KA = J.foot_l.clone().sub(J.lower_leg_l);
  const LEG_MAX = HK.clone().add(KA).length();               // straight leg (no hyperextension)
  const HEEL = V3(0, -J.foot_l.y, -0.068);                   // heel's back-bottom edge, foot space
  const BALL = J.toes_l.clone().sub(J.foot_l);                // toes joint (the ball), foot space; 26 mm above the sole
  const dbg = { legStretch: 0 };
  // place the ankle at A with foot rotation qF, toes rotation qT (root space); the knee faces `pole`
  function legIK(pose, s, A, qF, qT, pole) {

    const C1 = HK.y * KA.y + HK.z * KA.z, Sn = HK.z * KA.y - HK.y * KA.z;
    const k = (d * d - HK.lengthSq() - KA.lengthSq()) / 2;
    const phi = Math.max(0, Math.atan2(Sn, C1) + Math.acos(clamp(k / Math.hypot(C1, Sn), -1, 1)));
    const qK = Qn().setFromAxisAngle(AX, phi);
    const v = KA.clone().applyQuaternion(qK).add(HK).normalize(), w = dv.normalize();
    const q1 = Qn().setFromUnitVectors(v, w);
    const kz = AZ.clone().applyQuaternion(q1); kz.addScaledVector(w, -kz.dot(w)).normalize();
    const pp = pole.clone().addScaledVector(w, -pole.dot(w)).normalize();
    const qT2 = Qn().setFromAxisAngle(w, Math.atan2(kz.clone().cross(pp).dot(w), kz.dot(pp))).multiply(q1);
    pose.rot['upper_leg_' + s] = eQ(qHips.clone().invert().multiply(qT2));

  // toes flat on the ground, toeUp pivots on the heel edge; lift raises the whole foot
  function footTarget(f) {
    const [x, z, yaw, lift, heelUp, toeUp] = f;
    const qY = qAx(AY, yaw), flat = V3(x, J.foot_l.y + lift, z);
    const pitch = heelUp > 0 ? heelUp : toeUp > 0 ? -toeUp : 0, piv = heelUp > 0 ? BALL : toeUp > 0 ? HEEL : null;
    const qF = qY.clone().multiply(qAx(AX, pitch));

    if (piv) A = flat.clone().add(piv.clone().applyQuaternion(qY)).sub(piv.clone().applyQuaternion(qF));
    return { A, qF, qT: heelUp > 0 ? qY.clone() : qF.clone(), pole: AZ.clone().applyQuaternion(qAx(AY, yaw * 0.6)) };
  }

  /* ---------------- arm IK (used when keys are made) */
  const UA = J.lower_arm_l.x - J.upper_arm_l.x, FA = J.hand_l.x - J.lower_arm_l.x;
  // wrist to Wt; the elbow points toward `pole`; the hand's fingers along F with the palm facing N (root space).
  // The elbow stays a pure hinge (the forearm never twists, so the elbow fork and hub stay aligned); the upper
  // arm takes the twist and the wrist rotator the rest.
  function armIK(pose, s, Wt, pole, F, N) {
    const k = sg(s), W = fk(pose), S = W('upper_arm_' + s).p, qSh = W('shoulder_' + s).q;
    const dv = Wt.clone().sub(S), d = clamp(dv.length(), 0.09, (UA + FA) * 0.9995), w = dv.normalize();
    const pp = pole.clone().addScaledVector(w, -pole.dot(w)).normalize();
    const cb = clamp((UA * UA + d * d - FA * FA) / (2 * UA * d), -1, 1), sb = Math.sqrt(1 - cb * cb);
