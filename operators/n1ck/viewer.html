<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices, toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { TessellateModifier } from 'three/addons/modifiers/TessellateModifier.js';
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';
import { MeshBVH } from 'three-mesh-bvh';

// Metres, +Y up, N1CK faces +Z, his left is +X. Origin on the plinth top between his feet.

/* ------------------------------------------------------------------ helpers */

// Monotone cubic interpolation through [x, y] points (no overshoot).
function curve(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const constant = v => () => v;

// Loft a superellipse cross-section along X. top/bot/hw/n are functions of x.
// round: radius used to roll the edges at both ends; caps are flat.
function loft({ x0, x1, top, bot, hw, n = constant(2.6), cy = null, steps = 160, seg = 72, round = 0, roundStart = round, roundEnd = round, groove = null }) {
  const xs = [];
  // denser stations near the ends so the rolled edges stay smooth
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const e = 0.5 - 0.5 * Math.cos(Math.PI * u);
    xs.push(x0 + (x1 - x0) * (0.55 * u + 0.45 * e));
  }
  const pos = [], idx = [];
  const ring = (x) => {
    let T = top(x), B = bot(x), W = hw(x);
    const ds = x - x0, de = x1 - x;
    let inset = 0;
    if (roundStart > 0 && ds < roundStart) inset = Math.max(inset, roundStart - Math.sqrt(Math.max(0, roundStart * roundStart - (roundStart - ds) ** 2)));
    if (roundEnd > 0 && de < roundEnd) inset = Math.max(inset, roundEnd - Math.sqrt(Math.max(0, roundEnd * roundEnd - (roundEnd - de) ** 2)));
    let gB = 0, gW = 0;
    if (groove) { const g = groove(x); gB = g; gW = g; }
    T -= inset; B += inset + gB; W -= inset + gW;
    // a rounding radius larger than the section must not turn the ring inside out
    W = Math.max(0.002, W);
    const c = cy ? cy(x) : (T + B) / 2, ry = Math.max(0.001, (T - B) / 2);
    const e = 2 / n(x), out = [];
    for (let j = 0; j < seg; j++) {
      const t = (j / seg) * Math.PI * 2, co = Math.cos(t), si = Math.sin(t);
      const z = W * Math.sign(co) * Math.pow(Math.abs(co), e);
      const y = c + ry * Math.sign(si) * Math.pow(Math.abs(si), e);
      out.push([x, y, z]);
    }
    return out;
  };
  const rings = xs.map(ring);
  rings.forEach(r => r.forEach(p => pos.push(...p)));
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * seg + j, b = i * seg + (j + 1) % seg, c = (i + 1) * seg + j, d = (i + 1) * seg + (j + 1) % seg;
      idx.push(a, c, b, b, c, d);
    }
  }
  // flat caps with their own vertices
  const capAt = (r, flip) => {
    const base = pos.length / 3;
    const cx = r.reduce((s, p) => s + p[1], 0) / r.length;
    pos.push(r[0][0], cx, 0);
    r.forEach(p => pos.push(...p));
    for (let j = 0; j < seg; j++) {
      const a = base + 1 + j, b = base + 1 + (j + 1) % seg;
      flip ? idx.push(base, a, b) : idx.push(base, b, a);
    }
  };
  // caps face outward: -x at the start, +x at the end
  capAt(rings[0], true);
  capAt(rings[rings.length - 1], false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Polygon with per-corner radius: pts = [[x, y, r], ...]
function roundedShape(pts, shape = new THREE.Shape()) {
  const n = pts.length;
  const P = pts.map(p => new THREE.Vector2(p[0], p[1]));
  for (let i = 0; i < n; i++) {
    const prev = P[(i - 1 + n) % n], cur = P[i], next = P[(i + 1) % n], r = pts[i][2] || 0;
    const v1 = prev.clone().sub(cur), v2 = next.clone().sub(cur);
    const l1 = v1.length(), l2 = v2.length();
    const rr = Math.min(r, l1 / 2.05, l2 / 2.05);
    const a = cur.clone().add(v1.normalize().multiplyScalar(rr));
    const b = cur.clone().add(v2.normalize().multiplyScalar(rr));
    if (i === 0) shape.moveTo(a.x, a.y); else shape.lineTo(a.x, a.y);
    if (rr > 0) shape.quadraticCurveTo(cur.x, cur.y, b.x, b.y);
  }
  shape.closePath();
  return shape;
}
function roundedPath(pts) { return roundedShape(pts, new THREE.Path()); }

// Extrude a side-profile shape (in the XY plane) across Z, centred on zc.
function slab(shape, width, { bevel = 0.04, segs = 3, zc = 0, curveSegments = 24 } = {}) {
  const depth = Math.max(0.001, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.9, bevelSegments: segs, curveSegments,
  });
  g.translate(0, 0, zc - depth / 2);
  return g;
}

// Lathe around the X axis. pts = [[x, r], ...]
function latheX(pts, seg = 64) {
  const g = new THREE.LatheGeometry(pts.map(([x, r]) => new THREE.Vector2(r, x)), seg);
  g.rotateZ(-Math.PI / 2);
  g.scale(1, 1, 1);
  // after rotateZ(-90deg) the lathe axis (y) maps to +x
  return g;
}

function clean(g) {
  g = g.index ? g.toNonIndexed() : g;
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  return g;
}
function creased(g, angle = 34) { return toCreasedNormals(clean(g), THREE.MathUtils.degToRad(angle)); }

const evaluator = new Evaluator();
evaluator.attributes = ['position', 'normal'];
evaluator.useGroups = false;
// Cutters passed together must not overlap each other (they are merged into one brush).
function subtract(base, ...cutters) {
  let a = new Brush(clean(base)); a.updateMatrixWorld();
  const cut = new Brush(mergeGeometries(cutters.map(clean))); cut.updateMatrixWorld();
  const r = evaluator.evaluate(a, cut, SUBTRACTION);
  return r.geometry;
}
// For cutters that overlap, subtract them one after another.
function subtractEach(base, ...cutters) {
  let g = base;
  for (const c of cutters) g = subtract(g, c);
  return g;
}
function box(x0, x1, y0, y1, z0, z1) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return g;
}



// Screw head with its drive recess ("inlet"). Built along +y with the underside at y = 0.
// style: 'slot' (flat blade), 'phillips' (cross), 'hex' (socket). countersunk heads sit nearly flush.
function screwHead(r, { style = 'slot', h, countersunk = false, seg = 36 } = {}) {
  if (h === undefined) h = countersunk ? r * 0.5 : r * 0.6;
  const prof = countersunk
    ? [[0, 0], [r * 0.5, 0], [r, h - 0.006], [r, h], [0, h]]
    : [[0, 0], [r, 0], [r, h * 0.45], [r * 0.86, h * 0.82], [r * 0.55, h * 0.97], [0, h]];
  let g = new THREE.LatheGeometry(prof.map(([x, y]) => new THREE.Vector2(x, y)), seg);
  // the recess a driver goes into: deep enough to grip, open across the head for a blade
  const d = Math.min(h * 0.85, r * 0.62);
  if (style === 'slot') g = subtract(g, box(-r * 1.3, r * 1.3, h - d, h + 0.2, -r * 0.17, r * 0.17));
  else if (style === 'phillips') {
    g = subtractEach(g, box(-r * 0.68, r * 0.68, h - d, h + 0.2, -r * 0.13, r * 0.13), box(-r * 0.13, r * 0.13, h - d, h + 0.2, -r * 0.68, r * 0.68));
  } else if (style === 'hex') {
    g = subtract(g, new THREE.CylinderGeometry(r * 0.5, r * 0.5, d * 2, 6).translate(0, h, 0));
  }
  return creased(g, 35);
}
// Put a screw head at pos with its axis along normal; spin turns the recess about that axis.
function placeScrew(geo, pos, normal, spin = 0) {
  geo.applyMatrix4(new THREE.Matrix4().makeRotationY(spin));
  geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal.clone().normalize()));
  geo.translate(pos.x, pos.y, pos.z);
  return geo;
}


/* ================================================================== N1CK core (v2) */
// Proportions, rig, materials and procedural textures, the v2 hard-surface and gear kit, blockouts and the part loader.
// Metres, +Y up, N1CK faces +Z and his left is +X. Rest pose: T-pose with every bone at identity
// rotation, so at rest a bone's local axes are the world axes and local = world - joint position.
// See SPEC.md for the contract the part files build against (the "v2 redesign" section first).

const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const deg = THREE.MathUtils.degToRad;
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const clampR = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const sstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ------------------------------------------------------------------ proportions */

const HEIGHT = 1.85;
// joint centres in the rest T-pose, world metres; right-side joints mirror x
const JOINT_L = {
  hips: [0, 1.0, 0], spine: [0, 1.09, -0.005], chest: [0, 1.215, -0.01], upper_chest: [0, 1.345, -0.012],
  neck: [0, 1.555, -0.02], head: [0, 1.64, -0.01],
  shoulder_l: [0.03, 1.47, -0.015], upper_arm_l: [0.185, 1.47, -0.025], lower_arm_l: [0.485, 1.47, -0.025], hand_l: [0.75, 1.47, -0.025],
  upper_leg_l: [0.092, 0.955, 0], lower_leg_l: [0.092, 0.515, 0.006], foot_l: [0.092, 0.09, -0.012], toes_l: [0.092, 0.026, 0.15],
};
// fingers of the left hand: knuckle offset from the wrist, segment lengths (proximal, middle, distal),
// width (across the hand) and thickness (back to palm). The thumb runs along dir; the others along +X.
const FINGER = {
  thumb: { base: [0.024, -0.012, 0.022], dir: [0.62, -0.3, 0.72], len: [0.046, 0.033, 0.028], w: 0.022, t: 0.019 },
  index: { base: [0.094, 0.003, 0.028], len: [0.043, 0.026, 0.021], w: 0.019, t: 0.017 },

function onBasis(g, o, ex, ey) { const ez = ex.clone().cross(ey).normalize(); return g.applyMatrix4(new THREE.Matrix4().makeBasis(ex.clone().normalize(), ey.clone().normalize(), ez).setPosition(o)); }

function turn(g, axis, d, pivot) { return g.translate(-pivot.x, -pivot.y, -pivot.z).applyMatrix4(new THREE.Matrix4().makeRotationAxis(axis.clone().normalize(), deg(d))).translate(pivot.x, pivot.y, pivot.z); }

const PARTS = {};   // parts/*.js fill these: PARTS.torso, PARTS.legs, PARTS.arms, PARTS.head, PARTS.gear
const REGIONS = ['torso', 'legs', 'arms', 'head', 'gear'];
const REGION_BONES = {
  head: ['neck', 'head'],
  torso: ['hips', 'spine', 'chest', 'upper_chest'],
  arms: BONE_NAMES.filter((n) => /^(shoulder|upper_arm|lower_arm|hand|thumb|index|middle|ring|pinky)_/.test(n)),
  legs: BONE_NAMES.filter((n) => /^(upper_leg|lower_leg|foot|toes)_/.test(n)),

    THREE, D, J, TIP, FINGER, FINGERS, HUMAN, M, TX, bones: rig.bones, rig, hooks: {}, timings: {}, blockout: BLOCKOUT,

    addW: (bone, geo, mat, name, opts) => addTo(rig, bone, geo, mat, name, opts, true),

    // older shape helpers (still fine for under-structure and round parts)
    merge: mergeUV, mirrorX, orient, boxUV, prepUV, sLoft, plate, rect, rshape: roundedShape, roundedShape, slab, loft, latheX, latheY, curve,
    cable, cableBundle, cableEnds, pistonGeos, rotary,

    region: (name) => rig.regions[name] || [],

}
function buildParts(K) {
  window.__partErrors = window.__partErrors || [];
  K.rig.regions = {};
  const seen = new Set();
  const collect = (r) => { const out = []; K.rig.root.traverse((o) => { if (o.isMesh && !seen.has(o)) { seen.add(o); o.userData.region = r; out.push(o); } }); K.rig.regions[r] = out; };
  for (const r of REGIONS) {
    const t0 = performance.now(), nodes = [];
    K.rig.root.traverse((o) => nodes.push(o));
    const before = new Map(nodes.map((o) => [o, o.children.slice()])), np = K.rig.pistons.length;
    try {
      if (typeof PARTS[r] !== 'function') throw new Error('no builder for ' + r);
      PARTS[r](K);
    } catch (e) {
      console.error(`part ${r} failed:`, e);
      window.__partErrors.push({ region: r, message: String(e && e.message || e), stack: String(e && e.stack || '').split('\n').slice(0, 6).join('\n') });
      for (const [o, kids] of before) for (const c of o.children.slice()) if (!kids.includes(c)) o.remove(c);
      K.rig.pistons.length = np;
      try { BLOCKOUT[r](K); } catch (e2) { console.error('blockout failed', r, e2); window.__partErrors.push({ region: r, message: 'blockout: ' + e2.message }); }
    }
    collect(r);
    K.timings[r] = Math.round(performance.now() - t0);
  }
}

/* ------------------------------------------------------------------ poses and faces */
// A pose: { rot: { bone: [x, y, z] degrees, Euler order XYZ (Rx * Ry * Rz) }, hips: [dx, dy, dz] metres
// from rest }. Missing bones are at identity (rest). Mirror a left value to the right with [x, -y, -z].
const POSE = {
  mirror: (v) => [v[0], -v[1], -v[2]],
  sym(rot, base, v) { rot[base + '_l'] = v.slice(); rot[base + '_r'] = [v[0], -v[1], -v[2]]; return rot; },
  // finger curl in degrees per joint (positive bends toward the palm); spread fans the proximal joint
  // thumb: opp rolls the metacarpal about the hand's long axis so the thumb swings under the palm (opposition;
  // 0 open, 15-20 relaxed, 45 cup, 70 grip, 85-95 fist), then each joint flexes about thumbFlexAxis in its own frame
  curl(rot, s, finger, a, spread = 0, opp = 0) {
    for (let i = 0; i < 3; i++) {
      let v;
      if (finger === 'thumb') {
        const q = new THREE.Quaternion().setFromAxisAngle(D.thumbFlexAxis_l, deg(a[i]));
        if (i === 0 && opp) q.premultiply(new THREE.Quaternion().setFromAxisAngle(D.thumbOppAxis_l, deg(opp)));
        const e = new THREE.Euler().setFromQuaternion(q, 'XYZ'); v = [e.x, e.y, e.z].map(THREE.MathUtils.radToDeg);
      }
      else v = [0, i === 0 ? spread : 0, -a[i]];
      rot[`${finger}_${i + 1}_${s}`] = s === 'l' ? v : [v[0], -v[1], -v[2]];
    }
    return rot;
  },
  // Euler XYZ degrees for a rotation of angle degrees about an axis (V3, bone-local)
  axis: (axis, angle) => { const e = new THREE.Euler().setFromQuaternion(new THREE.Quaternion().setFromAxisAngle(axis.clone().normalize(), deg(angle)), 'XYZ'); return [e.x, e.y, e.z].map(THREE.MathUtils.radToDeg); },
  quats(pose) {
    const out = {};
    for (const n of BONE_NAMES) { const r = pose.rot && pose.rot[n]; out[n] = r ? new THREE.Quaternion().setFromEuler(new THREE.Euler(deg(r[0]), deg(r[1]), deg(r[2]), 'XYZ')) : new THREE.Quaternion(); }
    return out;
  },
  // set the rig to a pose; with `from` (another pose) and w, blend from -> pose by w
  apply(rig, pose, from = null, w = 1) {
    const qb = POSE.quats(pose), qa = from ? POSE.quats(from) : null;
    for (const n of BONE_NAMES) { const q = rig.bones[n].quaternion; q.copy(qb[n]); if (qa) q.copy(qa[n]).slerp(qb[n], w); }
    const h = pose.hips || [0, 0, 0], h0 = from ? (from.hips || [0, 0, 0]) : h;
    rig.bones.hips.position.set(J.hips.x + lerp(h0[0], h[0], w), J.hips.y + lerp(h0[1], h[1], w), J.hips.z + lerp(h0[2], h[2], w));
    solveConstraints(rig);
  },
  rest(rig) { POSE.apply(rig, { rot: {} }); },
};
// show a face cell on the screen material and record it on the face channel:
// face_ctrl.position = (cell index, alarm tint 0..1, nullfield glow 0..1)
function setFace(rig, name, tint = 0, field = 0) {
  const [u, v] = faceOffset(name);
  M.screen.emissiveMap.offset.set(u, v);
  M.screen.emissive.set('#ffffff').lerp(new THREE.Color('#d8141a'), clamp01(tint));
  if (rig) rig.faceCtrl.position.set(FACE_INDEX[name] ?? 0, tint, field);
}

// Build everything: materials, rig, parts. Returns { rig, K, timings }.
function buildN1CK() {
  const t0 = performance.now(), timings = {};
  if (!M.paint) timings.materials = Math.round(buildMaterials());
  const rig = buildRig(), K = makeKit(rig);
  buildParts(K);
  Object.assign(timings, K.timings, { total: Math.round(performance.now() - t0) });
  POSE.rest(rig);
  return { rig, K, timings };
}


/* ================================================================== PARTS.head (v2) */
// Head and neck (SPEC.md v2). A rounded-rectangle housing in light paint with crisp bevels (brow, chin, back), a
// panel seam and a 4 degree taper behind it; a thick dark bezel and a metal trim ring round the recessed screen; a
// crown plate; light side panels; a light raised rear panel over a small louvred vent; ear pods (speaker on his left,
// mic and a stub antenna on his right) on dark angular plates. The exposed neck has wide faceted rings, braided cables
// into bosses, a purple hairline in the ring gap, two small pistons to the head and a wide head-base disc. Modelled in rest-pose world space and attached with K.addW.
// The face atlas drawing and hooks.face are v1's, unchanged.
PARTS.head = function (K) {
  const { THREE, D, M, TX, V3 } = K;
  const H = D.head, SC = H.screen, E = H.ear;
  const X = V3(1, 0, 0), Y = V3(0, 1, 0), Z = V3(0, 0, 1);

  /* ---------------- geometry helpers (non-indexed, with the kit's wear tag: 0 surface, 1 exposed edge, 2 crevice) */
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const nrm = (a) => { const l = Math.hypot(a[0], a[1], a[2]); return l > 1e-14 ? [a[0] / l, a[1] / l, a[2] / l] : [0, 0, 0]; };
  const soup = () => {
    const T = [];
    T.tri = (p, n, uv, tag, want) => {
      const g = crs(sub(p[1], p[0]), sub(p[2], p[0]));
      if (dot(g, g) < 1e-22) return;
      if (dot(g, want) < 0) T.push([[p[0], p[2], p[1]], [n[0], n[2], n[1]], [uv[0], uv[2], uv[1]], tag]); else T.push([p, n, uv, tag]);
    };
    T.quad = (p, n, uv, tag) => {
      const f = crs(sub(p[2], p[0]), sub(p[3], p[1])), s = [0, 1, 2].map((k) => n[0][k] + n[1][k] + n[2][k] + n[3][k]), w = dot(s, s) > 1e-12 ? s : f;
      T.tri([p[0], p[1], p[2]], [n[0], n[1], n[2]], [uv[0], uv[1], uv[2]], tag, w);
      T.tri([p[0], p[2], p[3]], [n[0], n[2], n[3]], [uv[0], uv[2], uv[3]], tag, w);
    };
    return T;
  };
  const geo = (T) => {
    const n = T.length, P = new Float32Array(n * 9), N = new Float32Array(n * 9), U = new Float32Array(n * 6), W = new Float32Array(n * 3);
    T.forEach(([p, nn, uv, tag], i) => { for (let k = 0; k < 3; k++) { P.set(p[k], i * 9 + k * 3); N.set(nn[k], i * 9 + k * 3); U.set(uv[k], i * 6 + k * 2); W[i * 3 + k] = tag; } });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(P, 3)); g.setAttribute('normal', new THREE.BufferAttribute(N, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(U, 2)); g.setAttribute('wtag', new THREE.BufferAttribute(W, 1));
    return g;
  };
  // rounded rectangle (CCW seen from +Z) with fixed point counts Q = [side, top, corner], so rings of any size match
  const rrPts = (cx, cy, hw, hh, r, Q) => {
    r = Math.max(0.0004, Math.min(r, hw - 2e-4, hh - 2e-4));
    const sx = hw - r, sy = hh - r, P = [];
    const arc = (ox, oy, a0) => { for (let i = 0; i < Q[2]; i++) { const a = a0 + Math.PI / 2 * i / Q[2]; P.push([cx + ox + r * Math.cos(a), cy + oy + r * Math.sin(a)]); } };
    for (let i = 0; i < Q[0]; i++) P.push([cx + hw, cy - sy + 2 * sy * i / Q[0]]);
    arc(sx, sy, 0);
    for (let i = 0; i < Q[1]; i++) P.push([cx + sx - 2 * sx * i / Q[1], cy + hh]);
    arc(-sx, sy, Math.PI / 2);
    for (let i = 0; i < Q[0]; i++) P.push([cx - hw, cy + sy - 2 * sy * i / Q[0]]);
    arc(-sx, -sy, Math.PI);
    for (let i = 0; i < Q[1]; i++) P.push([cx - sx + 2 * sx * i / Q[1], cy - hh]);

  };

  // around x along, so an outer shell runs back to front and a frame runs outer edge -> face -> inner edge -> back.
  // Every band has its own normals (crisp between bands, smooth round the ring). autoTag: a narrow band that turns
  // more than 7 degrees from both neighbours is an exposed chamfer (tag 1). Returns the ring points.
  const rrLoft = (T, rings, Q, { closed = false, tile = 0.3, autoTag = false, cap0 = null, cap1 = null } = {}) => {
    const R = rings.map((g) => rrPts(g.cx || 0, g.cy, g.hw, g.hh, g.r, Q).map(([x, y]) => [x, y, g.z]));
    const S = R.length, N = R[0].length, nb = closed ? S : S - 1, cos7 = Math.cos(7 * Math.PI / 180);
    const V = [new Float64Array(N)];
    for (let i = 1; i <= nb; i++) { const v = new Float64Array(N); for (let j = 0; j < N; j++) v[j] = V[i - 1][j] + Math.hypot(...sub(R[i % S][j], R[i - 1][j])); V.push(v); }
    const U = R.map((ring) => { const u = [0]; for (let j = 1; j <= N; j++) u.push(u[j - 1] + Math.hypot(...sub(ring[j % N], ring[j - 1]))); return u; });

    const vn = (ring, j, al) => nrm(crs(sub(ring[(j + 1) % N], ring[(j - 1 + N) % N]), al));
    for (let i = 0; i < nb; i++) {

  const capT = (T, ring, z, nz, holes = [], tag = 0, tile = 0.3) => {
    const C = ring.map((p) => new THREE.Vector2(p[0], p[1])), Hs = holes.map((h) => h.map((p) => new THREE.Vector2(p[0], p[1])));
    const all = C.concat(...Hs), n = [0, 0, nz];
    for (const t of THREE.ShapeUtils.triangulateShape(C, Hs)) { const p = t.map((i) => [all[i].x, all[i].y, z]); T.tri(p, [n, n, n], p.map((q) => [q[0] / tile, q[1] / tile]), tag, n); }

  // coordinate along the axis. smooth: normals smooth round the axis, else flat facets (seg sides, phase).
  const lathe = (T, prof, { axis = 'y', o = [0, 0, 0], seg = 32, smooth = true, phase = 0, tile = 0.3 } = {}) => {
    const pt = (r, h, a) => (axis === 'y' ? [o[0] + r * Math.sin(a), h, o[2] + r * Math.cos(a)] : [h, o[1] + r * Math.cos(a), o[2] + r * Math.sin(a)]);
    const nAt = (r0, h0, r1, h1, a) => { const al = sub(pt(r1, h1, a), pt(r0, h0, a)), ar = sub(pt(1, 0, a + 1e-3), pt(1, 0, a - 1e-3)); return nrm(crs(ar, al)); };

  const onM = (g, m) => g.applyMatrix4(m);

    const st = [[ZB, sec(ZB + cB, cB), 1]];

  // Crisp warm LED faces with sub-pixel stripes and scan rows, redrawn into TX.faceAtlasCanvas in place
  // (same 4 x 4 layout of 256 x 192 cells, 32 x 24 LEDs at 8 px). Alert cells are red.
  function drawAtlas() {
    const CW = 256, CH = 192, GW = 32, GH = 24, P = 8, SS = 4;
    const cvs = TX.faceAtlasCanvas, ctx = cvs.getContext('2d');
    const img = ctx.createImageData(CW * 4, CH * 4), px = img.data;
    const hi = document.createElement('canvas'); hi.width = GW * SS; hi.height = GH * SS;
    const S = hi.getContext('2d', { willReadFrequently: true });
    const EL = 10.5, ER = 21.5, EY = 9.5;
    const rr = (x, y, w, h, r) => { S.beginPath(); S.roundRect(x - w / 2, y - h / 2, w, h, r); S.fill(); };
    const ln = (pts, lw = 1.5) => { S.lineWidth = lw; S.beginPath(); S.moveTo(...pts[0]); for (const p of pts.slice(1)) S.lineTo(...p); S.stroke(); };
    const qd = (a, c, b, lw = 1.5) => { S.lineWidth = lw; S.beginPath(); S.moveTo(...a); S.quadraticCurveTo(...c, ...b); S.stroke(); };
    const fill = (f) => { S.beginPath(); f(); S.fill(); };
    const both = (f) => { f(EL, 1); f(ER, -1); };
    const eyes = (w = 3.1, h = 6.2, y = EY) => both((x) => rr(x, y, w, h, 1.5));
    const lids = (y = EY + 1, w = 4.6, droop = 0.7) => both((x) => qd([x - w / 2, y], [x, y + droop * 2], [x + w / 2, y], 1.5));

  // orthonormal frame on it (no shear, true 45 degree chamfers).

    const ex = U.clone().addScaledVector(E, a).normalize(), ey = n.clone().cross(ex).normalize();

          { type: 'groove', a: [-0.07, -0.058], b: [0.07, -0.08] }] });
      put(UL, M.paint, ar, tb.g);
      const ti = plate([[-0.04, -0.06, 0.006], [0.03, -0.066, 0.006], [0.04, 0.01, 0], [0.028, 0.062, 0.008], [-0.03, 0.05, 0.008], [-0.046, 0.0, 0]],
        0.006, W(-0.045, 0.755, 0.01), V3(-1, 0, 0.22), Y, { chamfer: 0.0028, back: 0.001, lines: [
          { type: 'ridge', a: [0, 0], angle: 90, deg: 6 }, { type: 'groove', a: [-0.05, -0.03], b: [0.05, -0.018] }] });
      put(UL, M.paint, ar, ti.g);
      // cables down the inner back of the thigh, into the knee fork
      const cp = [W(-0.028, 0.885, -0.03), W(-0.046, 0.78, -0.05), W(-0.044, 0.66, -0.042), W(-0.03, 0.6, -0.026)];
      put(UL, M.cable, `thigh_${s}_cables`, bundle(cp));
      put(UL, M.under, fr, ferrules(cp, 0.0062));
      // knee fork: a slim arm down each side of the knee drum to an octagonal boss on the axle, so the drum shows round it
      const ch = [[0.0092, -0.0222, 0], [0.0222, -0.0092, 0], [0.0222, 0.0092, 0], [0.016, 0.03, 0], [0.018, 0.074, 0.004], [-0.011, 0.078, 0.004], [-0.015, 0.03, 0], [-0.0222, 0.0092, 0], [-0.0222, -0.0092, 0], [-0.0092, -0.0222, 0]];
      put(UL, M.under, fr, plate(ch, 0.0065, W(0.034, KY, KZ), X, Y, { chamfer: 0.0016, back: 0.0008, lines: [{ type: 'groove', a: [-0.04, 0.05], angle: -6 }] }).g);
      put(UL, M.under, fr, plate(ch.map(([x, y, c]) => [-x, y, c]), 0.0065, W(-0.034, KY, KZ), V3(-1, 0, 0), Y, { chamfer: 0.0016, back: 0.0008 }).g);
    }

    /* ---------------- knee: drum and hubs (lower leg), shield-shaped guard (thigh) */
    {
      const fr = `shin_${s}_frame`;
      put(LL, M.under, fr, drumX(0.03, 12, -0.034 + XL, -0.025 + XL, KY, KZ, { dir: -1 }));
      put(LL, M.under, fr, drumX(0.0265, 12, -0.0255 + XL, 0.0255 + XL, KY, KZ, { chamfer: 0.001, back: 0.001 }));
      put(LL, M.under, fr, drumX(0.03, 12, 0.025 + XL, 0.034 + XL, KY, KZ));
      put(LL, M.under, fr, drumX(0.017, 8, XL + 0.041, XL + 0.0455, KY, KZ, { chamfer: 0.0012, back: 0.0005 }));
      put(LL, M.under, fr, drumX(0.0085, 8, XL + 0.0455, XL + 0.0518, KY, KZ, { chamfer: 0.0008, back: 0.0004 }));
      put(LL, M.under, fr, drumX(0.015, 8, XL - 0.0445, XL - 0.041, KY, KZ, { dir: -1, chamfer: 0.0012, back: 0.0005 }));
      screw(LL, fr, { p: W(0.0518, KY, KZ), n: X }, 0.0034, 0.5);
      // knee guard rides on the thigh, so it stays over the joint's front as the shin swings back
      // three big planes: a centre face with an 8 degree ridge and two flat cheeks folded back 20 degrees
      const kn = V3(0.05, 0.03, 1), ko = W(0.002, KY + 0.002, KZ + 0.045);
      const kc = plate([[-0.03, 0.05, 0.006], [0.03, 0.05, 0.006], [0.0375, 0.018, 0], [0.033, -0.022, 0], [0.012, -0.05, 0.004], [-0.012, -0.05, 0.004], [-0.033, -0.022, 0], [-0.0375, 0.018, 0]],
        0.0075, ko, kn, Y, { chamfer: 0.0026, back: 0.001, lines: [
          { type: 'ridge', a: [0, 0], angle: 90, deg: 8 }, { type: 'crease', a: [0.019, 0], angle: -90, deg: 20 }, { type: 'crease', a: [-0.019, 0], angle: 90, deg: 20 }, { type: 'groove', a: [-0.05, -0.03], angle: 0 }] });
      put(UL, M.paint, `knee_${s}_cap`, kc.g);
      // a dark lip plate lapping over the cap's top at a 2 mm stand-off
      const kl = plate([[-0.03, 0.074, 0.004], [0.03, 0.074, 0.004], [0.034, 0.05, 0.003], [0.024, 0.037, 0.006], [-0.024, 0.037, 0.006], [-0.034, 0.05, 0.003]],
        0.005, ko.clone().addScaledVector(kn.clone().normalize(), 0.0095), kn, Y, { chamfer: 0.0022, back: 0.0008, lines: [{ type: 'ridge', a: [0, 0], angle: 90, deg: 8 }, { type: 'crease', a: [-0.05, 0.066], angle: 0, deg: 14 }] });
      put(UL, M.paint, `knee_${s}_cap`, kl.g);
      screw(UL, `thigh_${s}_frame`, kl.at(0, 0.056, 0), 0.0026, 0.3);
      // side guards: clipped octagons over the knee hubs, on the thigh and centred on the knee axis (rotation safe)
      const kg = [[0.03, -0.012, 0.004], [0.03, 0.012, 0.004], [0.012, 0.031, 0.004], [-0.012, 0.031, 0.004], [-0.03, 0.012, 0.006], [-0.03, -0.012, 0.004], [-0.012, -0.029, 0.004], [0.012, -0.029, 0.004]];
      const kgo = plate(kg, 0.0045, W(0.0478, KY, KZ), X, Y, { chamfer: 0.0022, back: 0.0008, holes: [ngon(0.0098, 8, Math.PI / 8)], holeChamfer: 0.0012, holeBack: 0.0005, lines: [{ type: 'groove', a: [0.016, -0.04], b: [0.022, 0.04] }] });
      put(UL, M.paint, `knee_${s}_guard`, kgo.g);
      put(UL, M.paint, `knee_${s}_guard`, plate(kg.map(([x, y, c]) => [-x, y, c]), 0.0035, W(-0.0478, KY, KZ), V3(-1, 0, 0), Y, { chamfer: 0.0018, back: 0.0006, holes: [ngon(0.0098, 8, Math.PI / 8)], holeChamfer: 0.001, holeBack: 0.0005 }).g);
    }

    /* ---------------- shin: core, light keeled front guard, calf, side plates, cables */
    {
      const fr = `shin_${s}_frame`, ar = `shin_${s}_armor`;
      put(LL, M.under, `shin_${s}_core`, K.facetLoft([[0.112, 0.02, 0.018, 0.007, XL, AZ], [0.2, 0.024, 0.02, 0.008, XL, -0.006], [0.33, 0.03, 0.024, 0.01, XL, -0.002], [0.43, 0.03, 0.025, 0.01, XL, 0.002], [0.5, 0.026, 0.024, 0.009, XL, KZ]], { axis: 'y', steps: 6, micro: 0, grooves: [0.16] }));
      // light shin guard in two layers: the upper section laps over the recessed lower one
      const gl = (o) => [{ type: 'ridge', a: [0, 0], angle: 90, deg: 9 }, { type: 'crease', a: [0.02, 0], angle: -90, deg: 15 }, { type: 'crease', a: [-0.02, 0], angle: 90, deg: 15 }, ...o];
      const sf = plate([[-0.026, 0.122, 0.006], [0.028, 0.122, 0.006], [0.038, 0.07, 0], [0.034, 0.004, 0], [0.024, -0.012, 0], [0.0, -0.022, 0], [-0.022, -0.012, 0], [-0.032, 0.004, 0], [-0.035, 0.07, 0]],
        0.006, W(0.002, 0.33, 0.034), V3(0.06, -0.08, 1), Y, { chamfer: 0.0028, back: 0.001, lines: gl([{ type: 'groove', a: [-0.05, 0.088], angle: 0 }, { type: 'step', a: [-0.05, 0.03], b: [0.05, 0.022], h: 0.0014 }]) });
      const sl = plate([[-0.029, 0.01, 0.004], [0.03, 0.01, 0.004], [0.031, -0.04, 0], [0.022, -0.125, 0], [0.014, -0.165, 0.004], [-0.013, -0.165, 0.004], [-0.02, -0.125, 0], [-0.029, -0.04, 0]],
        0.0055, W(0.002, 0.33, 0.0265), V3(0.06, -0.05, 1), Y, { chamfer: 0.0026, back: 0.001, lines: gl([{ type: 'groove', a: [-0.05, -0.092], angle: 0 }]) });
      put(LL, M.paint2, `shin_${s}_guard`, sl.g);
      put(LL, M.paint2, `shin_${s}_guard`, sf.g);
      const sc = plate([[0.03, 0.1, 0.008], [-0.032, 0.106, 0.008], [-0.048, 0.03, 0], [-0.042, -0.05, 0], [-0.024, -0.104, 0.006], [-0.0125, -0.106, 0], [-0.0115, -0.07, 0.003], [0.0115, -0.07, 0.003], [0.0125, -0.108, 0], [0.02, -0.108, 0.006], [0.038, -0.05, 0], [0.046, 0.02, 0]],
        0.0065, W(-0.004, 0.36, -0.052), V3(0.08, 0, -1), Y, { chamfer: 0.003, back: 0.001, seg: 0.018, lines: [
          { type: 'ridge', a: [0, 0], angle: 90, deg: 14 }, { type: 'ridge', a: [0, 0], angle: 0, deg: 7 }, { type: 'crease', a: [0, 0.045], angle: 0, deg: 8 },
          { type: 'groove', a: [-0.06, -0.07], b: [0.06, -0.052] }] });
      put(LL, M.paint, ar, sc.g, { wear: { chip: 0.55 } });
      const so = plate([[-0.028, 0.1, 0.006], [0.022, 0.112, 0.006], [0.03, 0.04, 0], [0.025, -0.07, 0], [0.012, -0.148, 0.005], [-0.012, -0.15, 0.005], [-0.024, -0.06, 0]],
        0.0055, W(0.049, 0.33, -0.004), V3(1, 0, 0.12), Y, { chamfer: 0.0026, back: 0.0008, lines: [
          { type: 'crease', a: [0.014, 0], angle: -90, deg: 14 }, { type: 'ridge', a: [0, 0.03], angle: 0, deg: 6 }, { type: 'groove', a: [-0.04, -0.052], angle: 8 }] });
      put(LL, M.paint, ar, so.g);
      screw(LL, fr, so.at(-0.016, 0.08), 0.0026);
      const si = plate([[-0.02, -0.092, 0.005], [0.016, -0.092, 0.005], [0.028, 0.0, 0], [0.024, 0.075, 0.006], [-0.022, 0.08, 0.006], [-0.03, 0.0, 0]],
        0.0055, W(-0.046, 0.27, -0.006), V3(-1, 0, 0.15), Y, { chamfer: 0.0026, back: 0.0008, lines: [
          { type: 'crease', a: [-0.012, 0], angle: 90, deg: 14 }, { type: 'groove', a: [-0.04, -0.03], angle: -6 }] });
      put(LL, M.paint, ar, si.g);
      const cp = [W(-0.02, 0.475, -0.024), W(-0.036, 0.37, -0.034), W(-0.034, 0.24, -0.03), W(-0.022, 0.135, -0.026)];
      put(LL, M.cable, `shin_${s}_cables`, bundle(cp));
      put(LL, M.under, fr, ferrules(cp, 0.0062));
    }

    /* ---------------- ankle: drum and hubs (lower leg) */
    {
      const fr = `shin_${s}_frame`;
      put(LL, M.under, fr, drumX(0.022, 12, XL - 0.032, XL - 0.025, AY, AZ, { dir: -1 }));
      put(LL, M.under, fr, drumX(0.019, 12, XL - 0.0255, XL + 0.0255, AY, AZ, { chamfer: 0.001, back: 0.001 }));
      put(LL, M.under, fr, drumX(0.022, 12, XL + 0.025, XL + 0.032, AY, AZ));
      put(LL, M.under, fr, drumX(0.008, 10, XL + 0.03, XL + 0.0475, AY, AZ, { chamfer: 0.0006, back: 0.0006 }));
      put(LL, M.under, fr, drumX(0.008, 10, XL - 0.0475, XL - 0.03, AY, AZ, { dir: -1, chamfer: 0.0006, back: 0.0006 }));
      put(LL, M.under, fr, drumX(0.0128, 8, XL + 0.047, XL + 0.051, AY, AZ, { chamfer: 0.001, back: 0.0005 }));
      put(LL, M.under, fr, drumX(0.012, 8, XL - 0.0505, XL - 0.047, AY, AZ, { dir: -1, chamfer: 0.001, back: 0.0005 }));
      screw(LL, fr, { p: W(0.051, AY, AZ), n: X }, 0.0034, 0.9);
    }

    /* ---------------- ankle cuff (lower leg): a faceted collar round the shin above the ankle actuator, inside the
       boot's shaft plates, with a panel line and a front keel */
    put(LL, M.paint, `ankle_${s}_cuff`, K.facetLoft([[0.118, 0.0372, 0.0336, [0.016, 0.014], XL, -0.0084, 0.003], [0.165, 0.0345, 0.0274, [0.015, 0.013], XL, -0.0128, 0.003]],
      { axis: 'y', linear: true, endChamfer: 0.0028, grooves: [0.152] }), { wear: { chip: 0.56 } });

    /* ---------------- boot (foot): slim faceted shell, shaft side plates round the ankle hubs (a notch at the back for
       the Achilles piston), heel counter, vamp folding up into a short tongue; one 22 mm rubber sole with lugs on its
       sides */
    {
      const ar = `boot_${s}_armor`, fr = `boot_${s}_frame`;
      put(FT, M.paint, ar, K.facetLoft([[-0.072, 0.034, 0.0255, [0.012, 0.005], XL, 0.0465], [-0.04, 0.0375, 0.0275, [0.013, 0.005], XL, 0.0485, 0.002], [0.0, 0.0385, 0.0265, [0.012, 0.005], XL, 0.0475, 0.002],
        [0.055, 0.0405, 0.0225, [0.012, 0.005], XL - 0.001, 0.0435, 0.003], [0.1, 0.041, 0.019, [0.011, 0.005], XL - 0.002, 0.04, 0.003], [0.132, 0.04, 0.0165, [0.01, 0.005], XL - 0.002, 0.0375, 0.002]], { axis: 'z', linear: true, endChamfer: 0.003 }));
      // shaft sides: plate x runs toward the back (outer) / front (inner), y up, origin on the ankle axis
      const shaft = [[-0.072, -0.04, 0.006], [-0.046, 0.008, 0], [-0.034, 0.028, 0.004], [0.0, 0.05, 0], [0.03, 0.062, 0.008], [0.05, 0.045, 0.006], [0.058, -0.015, 0], [0.056, -0.04, 0.005]];
      const hole = [ngon(0.0165, 8, Math.PI / 8)];
      const sideOpts = (sg) => ({ chamfer: 0.0026, back: 0.0008, holes: hole, holeChamfer: 0.0012, holeBack: 0.0006, lines: [
        { type: 'crease', a: [sg * 0.024, 0], angle: sg > 0 ? -90 : 90, deg: 35 }, { type: 'ridge', a: [0, 0.032], angle: 0, deg: 6 }, { type: 'groove', a: [0, -0.028], angle: 0 }] });
      const so = plate(shaft, 0.0055, W(0.0415, AY, AZ), V3(1, 0.08, 0), Y, sideOpts(1));
      put(FT, M.paint, ar, so.g);
      put(FT, M.paint, ar, plate(shaft.map(([x, y, c]) => [-x, y, c]), 0.0055, W(-0.0415, AY, AZ), V3(-1, 0.08, 0), Y, sideOpts(-1)).g);
      screw(FT, fr, so.at(-0.052, -0.022), 0.0024);
      // heel counter: a keeled plate cupping the heel, over the shell
      const hc = plate([[-0.037, -0.04, 0.006], [0.035, -0.04, 0.006], [0.04, 0.012, 0], [0.026, 0.047, 0.006], [-0.028, 0.047, 0.006], [-0.042, 0.012, 0]],
        0.0062, W(0, 0.062, -0.0752), V3(0, 0.2, -1), Y, { chamfer: 0.0028, back: 0.0008, lines: [
          { type: 'crease', a: [0.022, 0], angle: -90, deg: 24 }, { type: 'crease', a: [-0.022, 0], angle: 90, deg: 24 }, { type: 'ridge', a: [0, 0], angle: 90, deg: 6 }, { type: 'groove', a: [-0.05, -0.014], angle: 0 }] });
      put(FT, M.paint, ar, hc.g);
      // vamp over the instep, folding up into a short tongue in front of the ankle
      const vp = plate([[-0.033, 0.054, 0.008], [0.031, 0.054, 0.008], [0.037, 0.0, 0], [0.03, -0.04, 0], [0.022, -0.07, 0.006], [-0.024, -0.07, 0.006], [-0.032, -0.04, 0], [-0.039, 0.0, 0]],
        0.0055, W(0, 0.0725, 0.082), V3(0, 1, 0.17), Z, { chamfer: 0.0026, back: 0.0008, lines: [
          { type: 'ridge', a: [0, 0], angle: 90, deg: 9 }, { type: 'valley', a: [0, -0.03], angle: 0, deg: 30 }, { type: 'crease', a: [0, -0.03], angle: 0, deg: 30 },
          { type: 'groove', a: [-0.05, 0.026], angle: 0 }] });
      put(FT, M.paint, ar, vp.g, { wear: { chip: 0.55 } });
      // piston lug on the heel
      put(FT, M.under, fr, K.cbox(XL - 0.009, XL + 0.009, 0.066, 0.084, -0.091, -0.078, 0.0015));
      // sole: one 22 mm rubber block (face down at y = 0) with tread grooves, split at the ball; lugs along its sides
      const soleF = [[-0.034, -0.077, 0.012], [0.036, -0.077, 0.012], [0.041, -0.03, 0], [0.044, 0.05, 0], [0.045, 0.148, 0], [-0.044, 0.148, 0], [-0.043, 0.095, 0], [-0.035, 0.03, 0], [-0.037, -0.03, 0]];
      const tread = [-0.058, -0.04, 0.05, 0.072, 0.094, 0.116].map((z) => ({ type: 'groove', a: [0, z], angle: 0, w: 0.0045, depth: 0.0025 }));
      put(FT, M.rubber, `sole_${s}`, plate(soleF, 0.022, W(0, 0.022, 0), V3(0, -1, 0), Z, { chamfer: 0.003, back: 0.0015, lines: tread, seg: 0.03 }).g);
      const edgeX = (z, sg) => { const P = sg > 0 ? [[-0.077, 0.036], [-0.03, 0.041], [0.05, 0.044], [0.148, 0.045]] : [[-0.077, -0.034], [-0.03, -0.037], [0.03, -0.035], [0.095, -0.043], [0.148, -0.044]]; for (let i = 1; i < P.length; i++) if (z <= P[i][0]) return P[i - 1][1] + (P[i][1] - P[i - 1][1]) * (z - P[i - 1][0]) / (P[i][0] - P[i - 1][0]); return P[P.length - 1][1]; };
      const lugs = [];
      for (const sg of [1, -1]) for (let z = -0.058; z < 0.14; z += 0.032) { const e = edgeX(z, sg); lugs.push(K.cbox(XL + (sg > 0 ? e - 0.004 : e - 0.0024), XL + (sg > 0 ? e + 0.0024 : e + 0.004), 0, 0.0077, z - 0.0055, z + 0.0055, 0.0011)); }
      put(FT, M.rubber, `sole_${s}`, K.merge(lugs, 0.1));
    }

    /* ---------------- toes: tapered cap sliding under the vamp (two facets rising from the tip), toe sole with a
       little toe spring, hinge bar */
    {
      put(TO, M.paint, `toecap_${s}`, K.facetLoft([[0.122, 0.041, 0.017, [0.009, 0.004], XL - 0.002, 0.0385, 0.006, 0.001], [0.15, 0.0398, 0.0172, [0.011, 0.004], XL - 0.002, 0.0385, 0.0062, 0.0015], [0.176, 0.0345, 0.0138, [0.011, 0.004], XL - 0.003, 0.034, 0.0054, 0.0015], [0.197, 0.025, 0.0098, [0.008, 0.004], XL - 0.004, 0.0288, 0.004, 0.001]], { axis: 'z', linear: true, endChamfer: 0.006, grooves: [0.166] }), { wear: { chip: 0.47 } });
      const soleT = [[-0.044, 0.152, 0], [0.045, 0.152, 0], [0.043, 0.178, 0], [0.03, 0.199, 0.008], [0.008, 0.207, 0], [-0.012, 0.207, 0], [-0.031, 0.198, 0.008], [-0.044, 0.178, 0]];
      // toe spring lifts the tip 6 mm, and the top drops 3.5 mm toward the tip: the sole thins to about 12.5 mm there
      const spring = (x, y, z) => { const f = Math.max(0, (y - 0.158) / 0.049); return [x, y, z - 0.006 * f * f + 0.0035 * Math.min(1, Math.max(0, (y - 0.15) / 0.057)) * (1 - z / 0.022)]; };
      put(TO, M.rubber, `sole_toe_${s}`, plate(soleT, 0.022, W(0, 0.022, 0), V3(0, -1, 0), Z, { chamfer: 0.003, back: 0.0015, seg: 0.03, warp: spring, tess: 0.016, lines: [0.17, 0.188].map((z) => ({ type: 'groove', a: [0, z], angle: 0, w: 0.004, depth: 0.0025 })) }).g);
      put(TO, M.under, `toe_${s}_frame`, drumX(0.0085, 10, XL - 0.042, XL + 0.043, TY - 0.004, TZ - 0.001, { chamfer: 0.001, back: 0.001 }));
    }

    /* ---------------- pistons: knee (inner side, in front of the knee axis) and Achilles (behind the ankle), with lugs */
    put(UL, M.under, `thigh_${s}_frame`, K.cbox(XL - 0.0675, XL - 0.0505, 0.656, 0.674, 0.01, 0.026, 0.0015));
    put(LL, M.under, `shin_${s}_frame`, K.cbox(XL - 0.0675, XL - 0.047, 0.414, 0.43, 0.01, 0.026, 0.0015));
    put(LL, M.under, `shin_${s}_frame`, K.cbox(XL - 0.007, XL + 0.007, 0.26, 0.284, -0.034, -0.016, 0.0015));

    for (const b of bags.values()) { const g = K.merge(b.geos); K.addW(b.bone, L ? g : K.mirrorX(g), b.mat, b.name, b.opts); }
    { const g = K.merge(cup); K.addW('hips', L ? g : K.mirrorX(g), M.paint, `hip_${s}_socket`, { wear: false }); }

    const sx = L ? 1 : -1, mv = (v) => V3(v.x * sx, v.y, v.z);
    {
      K.piston('knee_' + s, UL, mv(W(-0.062, 0.665, 0.018)), LL, mv(W(-0.062, 0.422, 0.018)), { r: 0.0075 });
      K.piston('heel_' + s, LL, mv(W(0, 0.272, -0.028)), FT, mv(W(0, 0.075, -0.086)), { r: 0.0082 });
    }
  }
  leg('l');
  leg('r');
};

/* ================================================================== PARTS.gear (v2) */
// Tactical gear (SPEC.md §0.4): a duty belt with two mag pouches, a zip utility pouch and a D-ring; a chest harness
// (band with a buckle, two shoulder straps with ladder locks and daisy loops, a back yoke and back strap); a drop-leg
// rig on the right thigh. The rig hangs from a swivel on the hip actuator's hub, and a moulded bracket on the belt
// reaches down under the swivel (the hub turns on the hip's flexion axis, so nothing pulls apart as the leg swings).
// Every mesh is gear_* and rides on the bone it moves with. Straps are laid onto the rest-pose armour with ray

//                 faces: [[t, cell], ...] (the face timeline, blinks included), speed? (m/s, walk only) }.
// How clips are made: a "spec" is { rot: { bone: [x, y, z] deg }, hips: [dx, dy, dz], feet: { l, r } } where a foot

// Clips (seconds): idle 4 loop | walk 1.1 loop | talk_gesture 4 loop | wave 2.4 | laugh 2 | sad 3 | worried 2.6 |
// alert 1.6 (tint up to 0.8) | nullfield_activate 1.8 (field 0 -> 1 -> 0.6). Each clip's face keys and blink

    grip: { index: [48, 56, 34, 1], middle: [52, 60, 38, 0], ring: [56, 62, 40, -1], pinky: [60, 64, 42, -3], thumb: [0, 32, 30, 30, 70] },
    fist: { index: [85, 95, 70, 0], middle: [85, 95, 70, 0], ring: [85, 95, 70, 0], pinky: [85, 95, 70, 0], thumb: [0, 45, 40, 45, 85] },
    ready: { index: [33, 43, 28, -2], middle: [35, 45, 30, 0], ring: [37, 46, 31, 1], pinky: [39, 47, 32, 3], thumb: [-15, 22, 20, -28, 22] },
    point: { index: [2, 3, 2, -2], middle: [80, 92, 62, 0], ring: [84, 94, 66, -2], pinky: [86, 95, 68, -4], thumb: [0, 42, 36, 42, 88] },

  // settle (-1 .. 1, about 1.5 cm).

  /* ---------------- keyed tracks */

  /* ================================================================== walk (1.1 s loop, in place at 1.3 m/s) */

  // travels back with the ground at exactly 1.3 m/s, then the heel lifts and the foot rolls over the ball with

  function walkSpec(t) {

    rot.spine = [0, 2.2 * c1, -1.6 * sw(0.08)];
    rot.chest = [1.5, 3 * cw(0.03), -0.8 * sw(0.08)];
    rot.upper_chest = [-1 + 0.6 * c2(0.15), 2.6 * cw(0.05), -0.3 * sw(0.1)];
    rot.neck = [0, -1.4 * cw(0.05), 0.4 * sw(0.1)];
    rot.head = [-4 + 1.3 * c2(0.06), -1.3 * cw(0.05), 2.2 + 0.5 * sw(0.12)];
    sym(rot, 'shoulder', [0, 3, -3.5 + 0.8 * c2(0.12)]);
    // arms swing opposite to the legs, lagging a little; the forward arm bends more

    hand(rot, 'r', HANDS.relaxed, { index: [-3 * cw(0.25), -2 * cw(0.3), 0, 0], middle: [-3 * cw(0.27), -2 * cw(0.32), 0, 0], ring: [-3 * cw(0.29), -2 * cw(0.34), 0, 0], pinky: [-3 * cw(0.31), -2 * cw(0.36), 0, 0], thumb: [-2 * cw(0.2), 0, 0, 0] });

  /* ================================================================== talk_gesture (4 s loop) */
  // "So here's the thing..." (offer, palms up) - beats with the right hand - "you know?" (open shrug) -
  // "me" (left hand to the chest) - explaining with an open right hand - settle

    const rest = key(IDLE0, (sp, r) => { nudgeSym(r, 'lower_arm', [0, -6, 0]); });

      offer(sp, 'r', [0.16, 1.12, 0.26], { F: [0.25, -0.25, 1] }); nudge(r, 'hand_r', [0, 0, -12]); hand(r, 'r', mixH(HANDS.open, HANDS.relaxed, 0.4));
    });
    const K3 = key(K1, (sp, r) => {                  // point: the right index out in front, a nod
      r.head[0] += 3; r.head[1] -= 4; r.neck[0] += 1; r.chest[0] += 4; r.upper_chest[0] += 1; r.upper_chest[1] -= 8; r.chest[1] -= 3; r.spine[1] -= 2;
      reachR(sp, { at: [0.14, 1.25, 0.3], pole: [0.9, -1, -0.3], F: [0.15, 0.1, 1], N: [-0.2, -1, 0.1] }); hand(r, 'r', HANDS.point);
      offer(sp, 'l', [0.16, 1.1, 0.2]); hand(r, 'l', HANDS.relaxed);
    });
    const K4 = key(IDLE0, (sp, r) => {               // a two-hand frame: palms facing, fingers up, head tilted
      r.chest[0] -= 1.5; r.upper_chest[0] -= 1; r.head[2] -= 7; r.neck[2] -= 3; r.head[0] -= 1; r.upper_chest[2] -= 3;
      nudgeSym(r, 'shoulder', [0, -2, 8]);
      const fr = { pole: [1, -0.8, -0.5], F: [-0.15, 1, 0.25], N: [-1, 0.05, 0.1] };

      nudge(r, 'shoulder_l', [0, -2, 5]);

    const chop = (z, y, tw) => key(IDLE0, (sp, r) => {   // explaining: right hand a vertical blade
      r.chest[1] -= 5; r.upper_chest[1] -= 8; r.chest[0] += 3; r.head[1] -= 2; r.neck[0] += 1; r.spine[1] -= 2;
      reachR(sp, { at: [0.14, y, z], pole: [0.8, -1, -0.4], F: [0.12, 0.25 + tw, 1], N: [-1, 0.1, 0.15] });
      offer(sp, 'l', [0.2, 1.08, 0.18], { F: [0.5, -0.1, 1], N: [0.3, 1, 0] });

    });
    const K6 = chop(0.28, 1.26, 0.25), K7 = chop(0.3, 1.2, -0.1), K8 = chop(0.29, 1.25, 0.2);
    K7.rot.head[0] += 3; K7.rot.neck[0] += 1; K7.rot.chest[0] += 2;      // a nod on the middle chop, the right shoulder lifts

    const K9 = key(K1, (sp, r) => {                  // settle: hands low in front, open
      offer(sp, 'l', [0.2, 1.07, 0.18], { F: [0.4, -0.15, 1] }); offer(sp, 'r', [0.2, 1.07, 0.18], { F: [0.4, -0.15, 1] });

    const tr = track(keys, true);

      const sp = tr(t);
      sp.hips[0] += 0.004 * Math.sin(TAU * t / 4 + 0.5);              // a small weight sway
      curlAdd(sp.rot, 'l', ripple(TAU * t / 2 + 0.4, 3)); curlAdd(sp.rot, 'r', ripple(TAU * t / 1 + 1.3, 3.5));

  /* ================================================================== wave (2.4 s) */

    const up = (lean) => key(IDLE0, (sp, r) => {

  /* ================================================================== laugh (2 s) */
  // a little inhale, head thrown back with the shoulders bouncing, then doubled over with a hand on the belly

        const dy = t < 0.92 ? 0 : t < 1.1 ? 0.016 * e(0.92, 1.1, t) : t < 1.47 ? 0.016 + 0.0024 * e(1.1, 1.47, t) : 0.0184 - 0.0088 * e(1.47, 1.62, t);

  /* ================================================================== worried (2.6 s) */
  // hunched, shoulders up, the hands wringing in front of the sternum (palms 3-5 cm apart, one rising as the other

  {
    const WRING = (dy) => ({ at: [0.032, 1.232 + dy, 0.262], palm: true, frame: 'upper_chest', pole: [1, -0.75, -0.35], F: [-0.04, 0.55, 1], N: [-1, 0.1, 0.12] });

      r.spine[0] += 3 * k; r.chest[0] += 4 * k; r.upper_chest[0] += 7 * k; r.neck[0] += 4 * k; r.head[0] += 4 * k; r.head[2] += 8 * k - look * 0.1;
