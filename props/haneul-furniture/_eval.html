<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
import { mergeGeometries, mergeVertices, toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { Brush, Evaluator, SUBTRACTION, INTERSECTION } from 'three-bvh-csg';

// Metres, +Y up, +Z is each piece's front. Each piece's origin is on the floor under its middle.

/* ------------------------------------------------------------------ helpers */

// Monotone cubic interpolation through [x, y] points (no overshoot).
function curve(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const constant = v => () => v;

// Loft a superellipse cross-section along X. top/bot/hw/n are functions of x.
// round: radius used to roll the edges at both ends; caps are flat.
function loft({ x0, x1, top, bot, hw, n = constant(2.6), cy = null, steps = 160, seg = 72, round = 0, roundStart = round, roundEnd = round, groove = null }) {
  const xs = [];
  // denser stations near the ends so the rolled edges stay smooth
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const e = 0.5 - 0.5 * Math.cos(Math.PI * u);
    xs.push(x0 + (x1 - x0) * (0.55 * u + 0.45 * e));
  }
  const pos = [], idx = [];
  const ring = (x) => {
    let T = top(x), B = bot(x), W = hw(x);
    const ds = x - x0, de = x1 - x;
    let inset = 0;
    if (roundStart > 0 && ds < roundStart) inset = Math.max(inset, roundStart - Math.sqrt(Math.max(0, roundStart * roundStart - (roundStart - ds) ** 2)));
    if (roundEnd > 0 && de < roundEnd) inset = Math.max(inset, roundEnd - Math.sqrt(Math.max(0, roundEnd * roundEnd - (roundEnd - de) ** 2)));
    let gB = 0, gW = 0;
    if (groove) { const g = groove(x); gB = g; gW = g; }
    T -= inset; B += inset + gB; W -= inset + gW;
    // a rounding radius larger than the section must not turn the ring inside out
    W = Math.max(0.002, W);
    const c = cy ? cy(x) : (T + B) / 2, ry = Math.max(0.001, (T - B) / 2);
    const e = 2 / n(x), out = [];
    for (let j = 0; j < seg; j++) {
      const t = (j / seg) * Math.PI * 2, co = Math.cos(t), si = Math.sin(t);
      const z = W * Math.sign(co) * Math.pow(Math.abs(co), e);
      const y = c + ry * Math.sign(si) * Math.pow(Math.abs(si), e);
      out.push([x, y, z]);
    }
    return out;
  };
  const rings = xs.map(ring);
  rings.forEach(r => r.forEach(p => pos.push(...p)));
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * seg + j, b = i * seg + (j + 1) % seg, c = (i + 1) * seg + j, d = (i + 1) * seg + (j + 1) % seg;
      idx.push(a, c, b, b, c, d);
    }
  }
  // flat caps with their own vertices
  const capAt = (r, flip) => {
    const base = pos.length / 3;
    const cx = r.reduce((s, p) => s + p[1], 0) / r.length;
    pos.push(r[0][0], cx, 0);
    r.forEach(p => pos.push(...p));
    for (let j = 0; j < seg; j++) {
      const a = base + 1 + j, b = base + 1 + (j + 1) % seg;
      flip ? idx.push(base, a, b) : idx.push(base, b, a);
    }
  };
  // caps face outward: -x at the start, +x at the end
  capAt(rings[0], true);
  capAt(rings[rings.length - 1], false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Polygon with per-corner radius: pts = [[x, y, r], ...]
function roundedShape(pts, shape = new THREE.Shape()) {
  const n = pts.length;
  const P = pts.map(p => new THREE.Vector2(p[0], p[1]));
  for (let i = 0; i < n; i++) {
    const prev = P[(i - 1 + n) % n], cur = P[i], next = P[(i + 1) % n], r = pts[i][2] || 0;
    const v1 = prev.clone().sub(cur), v2 = next.clone().sub(cur);
    const l1 = v1.length(), l2 = v2.length();
    const rr = Math.min(r, l1 / 2.05, l2 / 2.05);
    const a = cur.clone().add(v1.normalize().multiplyScalar(rr));
    const b = cur.clone().add(v2.normalize().multiplyScalar(rr));
    if (i === 0) shape.moveTo(a.x, a.y); else shape.lineTo(a.x, a.y);
    if (rr > 0) shape.quadraticCurveTo(cur.x, cur.y, b.x, b.y);
  }
  shape.closePath();
  return shape;
}
function roundedPath(pts) { return roundedShape(pts, new THREE.Path()); }

// Extrude a side-profile shape (in the XY plane) across Z, centred on zc.
function slab(shape, width, { bevel = 0.04, segs = 3, zc = 0, curveSegments = 24 } = {}) {
  const depth = Math.max(0.001, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.9, bevelSegments: segs, curveSegments,
  });
  g.translate(0, 0, zc - depth / 2);
  return g;
}

// Lathe around the X axis. pts = [[x, r], ...]
function latheX(pts, seg = 64) {
  const g = new THREE.LatheGeometry(pts.map(([x, r]) => new THREE.Vector2(r, x)), seg);
  g.rotateZ(-Math.PI / 2);
  g.scale(1, 1, 1);
  // after rotateZ(-90deg) the lathe axis (y) maps to +x
  return g;
}

function clean(g) {
  g = g.index ? g.toNonIndexed() : g;
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  return g;
}
function creased(g, angle = 34) { return toCreasedNormals(clean(g), THREE.MathUtils.degToRad(angle)); }

const evaluator = new Evaluator();
evaluator.attributes = ['position', 'normal'];
evaluator.useGroups = false;
// Cutters passed together must not overlap each other (they are merged into one brush).
function subtract(base, ...cutters) {
  let a = new Brush(clean(base)); a.updateMatrixWorld();
  const cut = new Brush(mergeGeometries(cutters.map(clean))); cut.updateMatrixWorld();
  const r = evaluator.evaluate(a, cut, SUBTRACTION);
  return r.geometry;
}
// For cutters that overlap, subtract them one after another.
function subtractEach(base, ...cutters) {
  let g = base;
  for (const c of cutters) g = subtract(g, c);
  return g;
}
function box(x0, x1, y0, y1, z0, z1) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return g;
}



// Screw head with its drive recess ("inlet"). Built along +y with the underside at y = 0.
// style: 'slot' (flat blade), 'phillips' (cross), 'hex' (socket). countersunk heads sit nearly flush.
function screwHead(r, { style = 'slot', h, countersunk = false, seg = 36 } = {}) {
  if (h === undefined) h = countersunk ? r * 0.5 : r * 0.6;
  const prof = countersunk
    ? [[0, 0], [r * 0.5, 0], [r, h - 0.006], [r, h], [0, h]]
    : [[0, 0], [r, 0], [r, h * 0.45], [r * 0.86, h * 0.82], [r * 0.55, h * 0.97], [0, h]];
  let g = new THREE.LatheGeometry(prof.map(([x, y]) => new THREE.Vector2(x, y)), seg);
  // the recess a driver goes into: deep enough to grip, open across the head for a blade
  const d = Math.min(h * 0.85, r * 0.62);
  if (style === 'slot') g = subtract(g, box(-r * 1.3, r * 1.3, h - d, h + 0.2, -r * 0.17, r * 0.17));
  else if (style === 'phillips') {
    g = subtractEach(g, box(-r * 0.68, r * 0.68, h - d, h + 0.2, -r * 0.13, r * 0.13), box(-r * 0.13, r * 0.13, h - d, h + 0.2, -r * 0.68, r * 0.68));
  } else if (style === 'hex') {
    g = subtract(g, new THREE.CylinderGeometry(r * 0.5, r * 0.5, d * 2, 6).translate(0, h, 0));
  }
  return creased(g, 35);
}
// Put a screw head at pos with its axis along normal; spin turns the recess about that axis.
function placeScrew(geo, pos, normal, spin = 0) {
  geo.applyMatrix4(new THREE.Matrix4().makeRotationY(spin));
  geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal.clone().normalize()));
  geo.translate(pos.x, pos.y, pos.z);
  return geo;
}


/* ================================================================== Haneul furniture: shared kit (core.js) */
// See DESIGN.md (the contract). Metres, +Y up, front +Z, origin on the floor under the middle of the piece.
// Every name below is a global of the page's module. Sections:
//   math       V3 deg clamp01 clampR lerp sstep prng hashStr canvas hexRGB
//   textures   vnoise fbmT worley stretch blurW addScratch rgbaCanvas normalFrom pack asTex texSet
//              woodSheet fabricSheet leatherSheet stoneSheet celadonSheet brushedSheet paperSheet grainSheet
//              screenCanvas leafCanvas
//   materials  M (by key), buildMaterials(), pbr(), glowMat(), matClass(mat), innerOf(mat), MATERIAL_TABLE
//   geometry   prepUV boxUV bx rbox cylY cylX cylZ rod lathe planY profZ profX flipX moveGeo rotGeo
//   builder    defPiece(spec) PIECES Piece Part (see DESIGN.md section 4)
//   shapes     softBox taperLeg bottlePart mergeGeos pillowGeo pipeLoop insetPoly frameX fineWood placeGeo screenBox
//              addMonitor leafCards taperTube puffPad clothSheet

// foliage cards: n quads (own 0..1 UVs) scattered in an ellipsoid shell round c with radii r, each turned to face
// outward, vertex normals bent toward the radial direction so the clump shades like a mass
function leafCards(c, r, n, size, seed) {
  const rnd = prng(seed), pos = [], nor = [], uv = [];
  const v = new THREE.Vector3(), nn = new THREE.Vector3(), t1 = new THREE.Vector3(), t2 = new THREE.Vector3(), up = V3(0, 1, 0);
  for (let i = 0; i < n; i++) {
    const th = rnd() * 6.283, ph = Math.acos(1 - 2 * Math.pow(rnd(), 0.85)), k = 0.3 + 0.7 * Math.pow(rnd(), 0.5);
    const d = V3(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th));
    const m = size * 0.35, p = V3(c[0] + d.x * (r[0] - m) * k, c[1] + d.y * (r[1] - m) * k, c[2] + d.z * (r[2] - m) * k);
    nn.copy(d).add(V3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(1.4)).normalize();
    if (nn.dot(d) < 0.15) nn.add(d).normalize();
    t1.crossVectors(Math.abs(nn.y) > 0.95 ? V3(1, 0, 0) : up, nn).normalize(); t2.crossVectors(nn, t1);
    const a = rnd() * 6.283, ca = Math.cos(a), sa = Math.sin(a), s = size * (0.7 + 0.6 * rnd()) / 2;
    const U = t1.clone().multiplyScalar(ca).addScaledVector(t2, sa), W = t1.clone().multiplyScalar(-sa).addScaledVector(t2, ca);
    const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a1, b1]) => p.clone().addScaledVector(U, a1 * s).addScaledVector(W, b1 * s));
    const cu = [[0, 0], [1, 0], [1, 1], [0, 1]];

    for (const q of [0, 1, 2, 0, 2, 3, 0, 2, 1, 0, 3, 2]) {
      const back = pos.length % 36 >= 18, P0 = corners[q].clone().addScaledVector(nn, back ? -0.001 : 0); pos.push(P0.x, P0.y, P0.z);
      v.set((P0.x - c[0]) / r[0], (P0.y - c[1]) / r[1], (P0.z - c[2]) / r[2]).normalize().multiplyScalar(0.7).addScaledVector(nn, 0.3).normalize();

// tapered round tube through points (CatmullRom), radius r0 -> r1, capped both ends; non-indexed
function taperTube(pts, r0, r1, seg = 10, steps = 16) {

    const u = i / steps, p = curve.getPointAt(u), r = lerp(r0, r1, u);
    for (let j = 0; j < seg; j++) { const a = j / seg * 6.283, q = p.clone().addScaledVector(fr.normals[i], Math.cos(a) * r).addScaledVector(fr.binormals[i], Math.sin(a) * r); pos.push(q.x, q.y, q.z); }
  }
  for (let i = 0; i < steps; i++) for (let j = 0; j < seg; j++) { const a = i * seg + j, b = i * seg + (j + 1) % seg, c2 = a + seg, d = b + seg; idx.push(a, c2, b, b, c2, d); }
  const tube = new THREE.BufferGeometry(); tube.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); tube.setIndex(idx); tube.computeVertexNormals();
  const parts = [tube.toNonIndexed()];
  for (const [i, sgn] of [[0, -1], [steps, 1]]) {
    const ctr = curve.getPointAt(i / steps), cp = [], base = i * seg;
    for (let j = 0; j < seg; j++) {
      const A = [pos[(base + j) * 3], pos[(base + j) * 3 + 1], pos[(base + j) * 3 + 2]], B = [pos[(base + (j + 1) % seg) * 3], pos[(base + (j + 1) % seg) * 3 + 1], pos[(base + (j + 1) % seg) * 3 + 2]];
      if (sgn < 0) cp.push(ctr.x, ctr.y, ctr.z, ...A, ...B); else cp.push(ctr.x, ctr.y, ctr.z, ...B, ...A);
    }

  }

}
// upholstered pad: rounded box (radius r) whose top bulges up by puff toward the middle
function puffPad(x0, x1, y0, y1, z0, z1, r, puff) {
  const g = rbox(x0, x1, y0, y1 - puff, z0, z1, r, 4), p = g.attributes.position;
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, hx = (x1 - x0) / 2, hz = (z1 - z0) / 2, ym = (y0 + y1 - puff) / 2;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i); if (y <= ym) continue;
    const u = (p.getX(i) - cx) / hx, w = (p.getZ(i) - cz) / hz, f = Math.max(0, 1 - u * u * u * u) * Math.max(0, 1 - w * w * w * w);
    p.setY(i, y + puff * f * (y - ym) / (y1 - puff - ym));
  }

}
// thin sheet (cloth) from a side-view polyline [[z, y], ...] of thickness t, extruded across x0..x1
function clothSheet(path, t, x0, x1) {
  const n = path.length, a = [], b = [];
  for (let i = 0; i < n; i++) {
    const p = path[Math.max(0, i - 1)], q = path[Math.min(n - 1, i + 1)], dz = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dz, dy) || 1;
    const nz = -dy / l * t / 2, ny = dz / l * t / 2;
    a.push([path[i][0] + nz, path[i][1] + ny, 0]); b.push([path[i][0] - nz, path[i][1] - ny, 0]);
  }
  return profX(a.concat(b.reverse()), x0, x1, 0);
}

// one cut cell per slat (in z, between neighbouring slats), and a cut across the slat (in x, toothed) for the slats
// listed in split: a slat breaks on its own into one or two pieces
function slatCells(part, split, hx) {
  const zs = part.items.map((it) => { it.geo.computeBoundingBox(); return [it.geo.boundingBox.min.z, it.geo.boundingBox.max.z]; }).sort((a, b) => a[0] - b[0]);
  const cells = [], rnd = prng(hashStr(part.piece.id + part.name) % 9999 + 1);
  zs.forEach(([lo, hi], i) => {
    const z = [i ? (zs[i - 1][1] + lo) / 2 : -9, i + 1 < zs.length ? (hi + zs[i + 1][0]) / 2 : 9];
    if (split.includes(i)) { const xs = (rnd() - 0.5) * hx * 0.9; cells.push({ z, x: [-9, xs] }, { z, x: [xs, 9] }); } else cells.push({ z });
  });
  return cells;
}

    t3.colBox(-0.16, 0.16, BY, BY + 0.068, tz - 0.10, tz + 0.10);

defPiece({

  build(P) {

    base.colBox(-0.33, 0.33, 0, 0.125, -0.33, 0.33);

    const col = P.part('column', { break: 'detach', attach: 'base', mass: 1.5, cls: 'metal' });

    col.add(mergeGeos([rbox(-0.09, 0.09, 0.355, 0.40, -0.11, 0.10, 0.01, 2), rod([0.09, 0.38, 0.02], [0.2, 0.37, 0.06], 0.006, 8)]), M.graphite);

    seat.colBox(-0.25, 0.25, 0.398, 0.48, -0.235, 0.25);

    // back: a 2 cm tubular frame that wraps about 4 cm round the sitter and has a lumbar S in profile, a woven mesh
    // held inside it, a separate lumbar pad, and a spine from the seat mechanism up to the frame
    const bz = (x, y) => -0.262 - 0.13 * (y - 0.56) + 0.022 * Math.exp(-(((y - 0.68) / 0.075) ** 2)) - 0.012 * ((y - 0.56) / 0.58) ** 2 + 0.04 * (x / 0.235) ** 2;
    const BX = 0.235, BY0 = 0.56, BY1 = 1.14, BR = 0.07;
    // the frame line: a rounded rectangle in x, y, laid on the curved surface
    const loop = [];
    for (let k = 0; k < 4; k++) {
      const cx = k === 0 || k === 3 ? BX - BR : -(BX - BR), cy = k < 2 ? BY1 - BR : BY0 + BR, a0 = k * Math.PI / 2;
      for (let j = 0; j <= 6; j++) { const a = a0 + j / 6 * Math.PI / 2, x = cx + Math.cos(a) * BR, y = cy + Math.sin(a) * BR; loop.push(V3(x, y, bz(x, y))); }
    }
    const back = P.part('back', { break: 'detach', attach: 'seat', mass: 2.5, cls: 'metal' });

    // mesh panel: a 4 mm woven sheet on a grid, corners rounded with a superellipse
    {
      const NX = 14, NY = 18, pos = [], idx = [], ring = [];
      const at = (s_, t_, off) => {
        const m = Math.max(Math.abs(s_), Math.abs(t_)), q = m > 0 ? m / Math.pow(Math.abs(s_) ** 6 + Math.abs(t_) ** 6, 1 / 6) : 0;
        const x = s_ * q * (BX - 0.012), y = (BY0 + BY1) / 2 + t_ * q * ((BY1 - BY0) / 2 - 0.012);
        return [x, y, bz(x, y) - 0.001 + off];
      };
      for (const off of [0.002, -0.002]) for (let j = 0; j <= NY; j++) for (let i = 0; i <= NX; i++) pos.push(...at(-1 + 2 * i / NX, -1 + 2 * j / NY, off));
      const V = (side, i, j) => side * (NX + 1) * (NY + 1) + j * (NX + 1) + i;
      for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
        idx.push(V(0, i, j), V(0, i + 1, j), V(0, i + 1, j + 1), V(0, i, j), V(0, i + 1, j + 1), V(0, i, j + 1));
        idx.push(V(1, i, j), V(1, i + 1, j + 1), V(1, i + 1, j), V(1, i, j), V(1, i, j + 1), V(1, i + 1, j + 1));

      const mg = new THREE.BufferGeometry(); mg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); mg.setIndex(idx); mg.computeVertexNormals();
      back.add(mg, M.fabricCharcoal, { tile: 0.035, grain: 'y' });
    }
    // spine: an oval-section arm from under the seat, curving up behind the frame, and the clamp block on the frame
    back.add(taperTube([[0, 0.385, -0.05], [0, 0.385, -0.17], [0, 0.42, -0.26], [0, 0.49, -0.292], [0, 0.585, -0.282]], 0.018, 0.015, 10, 20).scale(1.8, 1, 1), M.graphite);
    back.add(rbox(-0.055, 0.055, 0.555, 0.625, -0.292, -0.262, 0.008, 2), M.graphite);
    back.colHull(mergeGeos(loop.map((p) => new THREE.BoxGeometry(0.02, 0.02, 0.02).translate(p.x, p.y, p.z))));

    {
      const g = softBox(-0.17, 0.17, 0.62, 0.74, -0.03, 0, { r: 0.012, puff: 0.006, axis: 'z', n: 10 }), p = g.attributes.position;
      for (let i = 0; i < p.count; i++) p.setZ(i, p.getZ(i) + bz(p.getX(i), p.getY(i)) + 0.036);

    }

    for (const [nm, s] of [['arm_l', 1], ['arm_r', -1]]) {
      const arm = P.part(nm, { break: 'detach', attach: 'seat', mass: 0.6, cls: 'plastic' });
      const xo = (a, b) => (s > 0 ? [a, b] : [-b, -a]);
      const [a0, a1] = xo(0.12, 0.27), [p0, p1] = xo(0.25, 0.275), [q0, q1] = xo(0.23, 0.30);
      arm.add(mergeGeos([rbox(a0, a1, 0.375, 0.395, -0.07, -0.01, 0.006, 2), rbox(p0, p1, 0.375, 0.64, -0.075, -0.03, 0.008, 2)]), M.plastic);

// planter_large garden_bench potted_tree reception_desk lobby_bench floor_lamp service_trolley crate_stack

// a lumpy block of soil: a subdivided box whose sides and top are pushed out by 0..amp of noise (the base stays flat)
function soilBlock(x0, x1, y0, y1, z0, z1, amp) {
  let g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0, 8, 3, 4); g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g, 1e-6);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  const p = g.attributes.position, e = 1e-6;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), d = amp * (0.5 + 0.5 * lumpN(x, y, z, 0.05));
    if (y <= y0 + e) continue;
    p.setXYZ(i, x + (x >= x1 - e ? d : x <= x0 + e ? -d : 0), y + (y >= y1 - e ? d * 0.8 : 0), z + (z >= z1 - e ? d : z <= z0 + e ? -d : 0));
  }
  g.computeVertexNormals();
  return g;
}

function concreteTexture(seamsX, seamsY, tone) {
  const c = canvas(1024, 1024), x = c.getContext('2d');
  x.fillStyle = tone; x.fillRect(0, 0, 1024, 1024);
  let s = 1234567;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 60; i++) {
    const gx = rnd() * 1024, gy = rnd() * 1024, g = x.createRadialGradient(gx, gy, 0, gx, gy, 80 + rnd() * 240);
    const v = rnd() < 0.5 ? 0 : 255; g.addColorStop(0, `rgba(${v},${v},${v},${0.035 + rnd() * 0.04})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, 1024, 1024);
  }
  for (let i = 0; i < 26000; i++) { const v = rnd() < 0.5 ? 20 : 220; x.fillStyle = `rgba(${v},${v},${v},${0.05 + rnd() * 0.08})`; x.fillRect(rnd() * 1024, rnd() * 1024, 1 + rnd() * 2, 1 + rnd() * 2); }
  x.lineWidth = 3;
  for (let i = 0; i <= seamsX; i++) { const p = (i / seamsX) * 1024; x.strokeStyle = 'rgba(0,0,0,0.5)'; x.beginPath(); x.moveTo(p, 0); x.lineTo(p, 1024); x.stroke(); x.strokeStyle = 'rgba(255,255,255,0.08)'; x.beginPath(); x.moveTo(p + 3, 0); x.lineTo(p + 3, 1024); x.stroke(); }
  for (let i = 0; i <= seamsY; i++) { const p = (i / seamsY) * 1024; x.strokeStyle = 'rgba(0,0,0,0.5)'; x.beginPath(); x.moveTo(0, p); x.lineTo(1024, p); x.stroke(); x.strokeStyle = 'rgba(255,255,255,0.08)'; x.beginPath(); x.moveTo(0, p + 3); x.lineTo(1024, p + 3); x.stroke(); }
  if (seamsX) for (let i = 0; i < seamsX; i++) for (let j = 0; j < seamsY; j++) for (const [u, v] of [[0.25, 0.3], [0.75, 0.3], [0.25, 0.7], [0.75, 0.7]]) {
    const cx = ((i + u) / seamsX) * 1024, cy = ((j + v) / seamsY) * 1024;
    x.fillStyle = 'rgba(0,0,0,0.55)'; x.beginPath(); x.arc(cx, cy, 6, 0, Math.PI * 2); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.07)'; x.beginPath(); x.arc(cx + 1.5, cy + 2, 6, 0, Math.PI); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}

/* ================================================================== catalogue viewer (scene.js) */
// A dark high-rise room on a rainy night. Piece view: one piece on a turntable (intact, parts pulled apart, chunks,
// colliders, a break demo, or Shoot). Room view: a sample suite furnished with copies of the pieces. In Shoot mode a
// click damages the part under the cursor with the chosen weapon; parts come loose (simple rigid-body motion: gravity,
// floor bounces, spin) or swap to their chunks, following each part's health, break type and support links.
const $ = (id) => document.getElementById(id);
const tMat = buildMaterials();
const IS_AUTO = navigator.webdriver;
bloom.threshold = 1.0;   // only emissive surfaces above 1 bloom: pale paper and stone under the key light do not

// GTAO skips see-through and cut-out surfaces (glass, rain, leaf cards), which would otherwise draw dark halos
{
  const ov = ao._overrideVisibility.bind(ao);
  ao._overrideVisibility = function () {
    ov();
    this.scene.traverse((o) => { if (o.isMesh && o.visible && o.material && (o.material.alphaTest > 0 || o.material.transparent)) { o.visible = false; this._visibilityCache.push(o); } });

  const n = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / n;
  for (const inst of scopeInsts()) if (inst.game.bodies.length) for (let i = 0; i < n; i++) stepBodies(inst, h);
}
function tick(dt) {
  simT += dt; rainMat.uniforms.time.value = simT;
  if (state.mode === 'broken' && state.breakT >= 0) {
    state.breakT += dt; if (state.breakT > 3.2) state.breakT = 0;
    for (const inst of scopeInsts()) simBreak(inst, state.breakT);
  }
  if (state.mode === 'shoot') physics(dt);
  if (state.view === 'piece' && state.spin && state.mode !== 'shoot') holders.get(BUILT[state.idx].id).rotation.y += dt * 0.3;
  for (const f of flashes) if (f.visible) { f.userData.t -= dt; if (f.userData.t <= 0) f.visible = false; else { f.material.opacity = f.userData.t / 0.12; f.scale.setScalar(f.userData.s * (1.6 - f.userData.t / 0.12 * 0.6)); } }

}
function loop() { const dt = Math.min(clock.getDelta(), 1 / 30); tick(dt); controls.update(); composer.render(dt); }
// under automation (export, screenshots) frames are drawn on demand only: software rendering is slow
if (IS_AUTO) composer.render(); else setLoop(true);
window.__model.ready = true;
const instOf = (o) => (o.room !== undefined ? roomInst[o.room] : byId.get(o.piece) || BUILT[state.idx]);
window.__model.debug = {
  tick, stop: () => setLoop(false), renderOnce: () => { controls.update(); composer.render(); },
  // set({ piece: id, mode: intact | exploded | chunks | colliders | broken | shoot, view: piece | room, k, t, dir, dist, frame, pos, target, spin, turn })
  set(o = {}) {
    if (o.piece !== undefined) { viewInst(BUILT[state.idx], 'intact'); state.idx = Math.max(0, BUILT.findIndex((b) => b.id === o.piece)); }
    setView(o.view === 'all' ? 'room' : o.view || state.view);
    if (o.mode) state.mode = o.mode;
    if (o.weapon) state.weapon = o.weapon;
    if (o.spin !== undefined) state.spin = o.spin;
    state.breakT = state.mode === 'broken' ? (o.t ?? 1.0) : -1;
    holders.forEach((h) => { h.rotation.y = o.turn ?? 0; });
    applyMode(o); showInfo(); syncButtons();
    if (o.frame !== false) refocus(o);
    return { piece: BUILT[state.idx].id, mode: state.mode, view: state.view };
  },
  // shoot({ part, piece? | room? (index into the room layout), amount, dir: [x, y, z] (root frame), force }): damage one part directly
  shoot(o) {
    const inst = instOf(o), bp = partOf(inst, o.part); if (!bp) return 'no part ' + o.part;
    inst.root.updateMatrixWorld(true);
    const box = localBox(bp.node).clone().applyMatrix4(bp.node.matrix), p = box.getCenter(V3());
    const d = o.dir ? V3(...o.dir).normalize() : dirLocal(inst, p.clone().applyMatrix4(inst.root.matrixWorld).sub(camera.position).normalize());
    const r = damagePart(inst, bp, o.amount ?? 40, p, d, o.force ?? 2.2); lastHit = { inst, part: bp.name, res: r }; refreshParts();
    return r;
  },
  fire: (x, y) => fire(new THREE.Vector2(x, y)),   // a click at ndc (x, y) with the current weapon
  // triangles in each shatter part's chunk set, by piece
  chunkTris: () => Object.fromEntries(BUILT.map((b) => [b.id, Object.fromEntries(b.parts.filter((bp) => bp.chunkGroup).map((bp) => { let t = 0; bp.chunkGroup.traverse((o) => { if (o.isMesh) t += o.geometry.attributes.position.count / 3; }); return [bp.name, Math.round(t)]; }))])),
  blastAt: (p) => { const r = blast(V3(...p)); refreshParts(); return r; },   // frag at a world point
  step(sec, dt = 1 / 60) { for (let t = 0; t < sec; t += dt) tick(dt); return true; },
  state: (o = {}) => { const inst = instOf(o); return { id: inst.id, bodies: inst.game.bodies.length, asleep: inst.game.bodies.filter((b) => b.asleep).length, parts: Object.fromEntries(inst.parts.map((bp) => [bp.name, [inst.game.state.get(bp.name), Math.ceil(inst.game.hp.get(bp.name))]])) }; },
  // parts.json: every piece's metadata plus the material and class tables
  partsJson: () => ({ pack: 'haneul-furniture', units: 'metres, kilograms', axes: '+Y up, +Z front, origin on the floor under the middle', hidden_scale: CHUNK_SCALE,
    classes: Object.fromEntries(Object.keys(CLASS_HEALTH).map((c) => [c, { density_kg_m3: CLASS_DENSITY[c], base_health: CLASS_HEALTH[c], debris: CLASS_DEBRIS[c] }])),
    materials: MATERIAL_TABLE, pieces: BUILT.map((b) => b.meta) }),
  info: (id) => (byId.get(id) || BUILT[state.idx]).meta,
  list: () => BUILT.map((b) => ({ id: b.id, batch: b.meta.batch, tris: b.meta.triangles, parts: b.meta.parts.length, size: b.meta.size_m })),
  pieceBox: (id) => { const b = pieceBox(byId.get(id)); return { min: b.min.toArray(), max: b.max.toArray() }; },
  timings: () => ({ materials_ms: Math.round(tMat), build_ms: Math.round(tBuild), errors, room_copies: roomInst.length }),
  frame, frameRoom, byId, BUILT, holders, roomInst, M,
  camera, controls, scene, renderer, setSpin: (on) => { state.spin = on; }, pivot: { rotation: {} },
};
